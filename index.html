<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programme Manager</title>
<style>
/* ============================================================
   BRAND PALETTE — tweak these to match mansfield.consulting
   ============================================================ */
:root{
  --ink:      #22303e;   /* primary text — deep navy */
  --ink-2:    #5b6b7a;   /* secondary text */
  --ink-3:    #96a2ae;   /* muted text */
  --bg:       #f7f5f0;   /* warm paper background */
  --surface:  #ffffff;   /* cards, tables */
  --surface-2:#fbfaf6;   /* subtle panels */
  --line:     #e6e2d8;   /* borders */
  --line-2:   #efece4;   /* faint borders */
  --navy:     #22303e;   /* brand primary */
  --accent:   #b06a3b;   /* copper accent */
  --accent-soft:#f4e8de;
  --good:     #4a7c59;   /* sage */
  --good-soft:#e8f0ea;
  --warn:     #b45309;
  --warn-soft:#fdf1e3;
  --bad:      #b3423a;
  --bad-soft: #f9e9e8;
  --sel:      #eef3f7;
  --shadow: 0 1px 2px rgba(34,48,62,.06), 0 4px 16px rgba(34,48,62,.05);
  --radius: 10px;
  --serif: Georgia, 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:.01em}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:10px 22px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:15px;flex:none}
#progName{font-family:var(--serif);font-size:18px;font-weight:600;padding:2px 6px;border-radius:6px;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
#progName:hover,#progName:focus{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.tabs{display:flex;gap:2px;margin-left:6px}
.tabs button{border:0;background:none;font:inherit;color:var(--ink-2);padding:7px 14px;border-radius:8px;cursor:pointer}
.tabs button:hover{background:var(--surface);color:var(--ink)}
.tabs button.on{background:var(--navy);color:#fff}
.hd-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.hd-actions .stamp{color:var(--ink-3);font-size:12px;margin-right:6px}

/* ---------- buttons & inputs ---------- */
button{font:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#2e4052}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface);color:var(--ink)}
.btn.sm{padding:3px 8px;font-size:12.5px;border-radius:7px}
.btn.icon{padding:4px 7px}
.btn.danger{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
input[type=date]{padding:4px 6px}
textarea{resize:vertical}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:3px}
label.f input,label.f select,label.f textarea{width:100%}

/* ---------- layout ---------- */
main{max-width:1400px;margin:0 auto;padding:20px 22px 80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .card-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.card .card-b{padding:12px 14px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
.subtabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px}
.subtabs button{border:0;background:none;padding:5px 12px;border-radius:7px;color:var(--ink-2);cursor:pointer}
.subtabs button.on{background:var(--navy);color:#fff}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.nowrap{white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* ---------- tables ---------- */
table.tbl{border-collapse:collapse;width:100%;background:var(--surface);font-size:13.5px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
.tbl td{padding:5px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:hover td{background:var(--surface-2)}
.tbl td input,.tbl td select{border-color:transparent;background:transparent;width:100%;min-width:60px;padding:4px 6px}
.tbl td input:hover,.tbl td select:hover{border-color:var(--line)}
.tbl td input:focus,.tbl td select:focus{border-color:var(--accent);background:var(--surface)}
.tbl td input.num{text-align:right}
.tbl .grp td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--line)}
.tbl .tot td{background:var(--surface-2);font-weight:600;border-top:2px solid var(--line)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);background:var(--surface)}
.tbl td textarea{border-color:transparent;background:transparent;width:100%;min-width:110px;padding:4px 6px;resize:none;field-sizing:content;max-height:150px;line-height:1.35;display:block}
.tbl td textarea:hover{border-color:var(--line)}
.tbl td textarea:focus{border-color:var(--accent);background:var(--surface)}
tr.arch td{opacity:.5}
.card.arch{opacity:.6}
tr.fc-line>td{background:var(--surface-2)}
.ev.done{color:var(--good)}
.fc-caret{width:16px;display:inline-grid;place-items:center;color:var(--ink-3);cursor:pointer;border-radius:4px;font-size:10px}
.fc-caret:hover{background:var(--sel);color:var(--ink)}
.dragh{cursor:grab;color:var(--ink-3);padding:0 4px;user-select:none;font-size:13px;flex:none}
.dragh:active{cursor:grabbing}
.drop-above{box-shadow:inset 0 3px 0 var(--accent)!important}
.drop-below{box-shadow:inset 0 -3px 0 var(--accent)!important}
.fc-addrow td{padding:4px 10px;background:var(--surface-2)}
.fc-cell.fc-ro{color:var(--ink);font-weight:600;background:var(--surface-2)}
.fc-cell.fc-ro .sub{font-weight:400}

/* ---------- chips & pills ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--sel);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:1px 9px;font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap;vertical-align:middle}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip .x{color:var(--ink-3);margin-left:2px;padding:0 2px}
.chip .x:hover{color:var(--bad)}
.chip .ic{opacity:.65;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ---------- modal / toast ---------- */
dialog{border:0;border-radius:14px;box-shadow:0 12px 48px rgba(34,48,62,.25);padding:0;max-width:640px;width:min(92vw,640px);background:var(--surface)}
dialog::backdrop{background:rgba(34,48,62,.35)}
dialog .m-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2)}
dialog .m-h h3{margin:0;font-size:17px}
dialog .m-b{padding:16px 18px;max-height:70vh;overflow:auto}
dialog .m-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line-2)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toast.show{opacity:1}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}100%{background:none}}

/* ---------- start screen ---------- */
#start{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;place-items:center}
#start.show{display:grid}
#start .panel{width:min(92vw,460px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:34px 38px}
#start h1{margin:0 0 4px;font-size:26px}
#start .sub{color:var(--ink-2);margin-bottom:22px}
#start .existing{margin-top:20px;border-top:1px solid var(--line-2);padding-top:14px}
#start .existing button{display:flex;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit;color:var(--ink);justify-content:space-between}
#start .existing button:hover{background:var(--sel)}

/* ---------- budget structure ---------- */
.contract-card{margin-bottom:16px}
.contract-card .card-h .title{font-family:var(--serif);font-size:16px;font-weight:600}
.po-block{border:1px solid var(--line-2);border-radius:8px;margin:10px 0;background:var(--surface-2)}
.po-block .po-h{display:flex;align-items:center;gap:10px;padding:7px 12px;cursor:pointer}
.po-block .po-b{padding:0 12px 10px}
.inv-rows{margin:4px 0 4px 24px;border-left:2px solid var(--line);padding-left:12px}
.inv-rows .inv{display:flex;gap:8px;align-items:center;padding:2px 0;font-size:12.5px}

/* ---------- forecast ---------- */
.fc-cell{position:relative}
.fc-cell input{width:86px;text-align:right;font-variant-numeric:tabular-nums}
.fc-cell .sub{display:block;font-size:10.5px;color:var(--ink-3);text-align:right;padding-right:6px}
.fc-cell input.pct{color:var(--accent);font-weight:600}

/* ---------- calendar ---------- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--line-2);gap:1px;box-shadow:var(--shadow)}
.cal-grid .dow{background:var(--surface-2);padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;text-align:center}
.cal-cell{background:var(--surface);min-height:112px;padding:5px 6px;position:relative}
.cal-cell.dim{background:var(--surface-2)}
.cal-cell.today .dnum{background:var(--accent);color:#fff}
.cal-cell .dnum{font-size:12px;font-weight:600;width:22px;height:22px;display:inline-grid;place-items:center;border-radius:50%;color:var(--ink-2)}
.cal-cell .addbtn{position:absolute;top:4px;right:4px;opacity:0;border:0;background:var(--sel);border-radius:6px;cursor:pointer;padding:1px 7px;color:var(--ink-2)}
.cal-cell:hover .addbtn{opacity:1}
.ev{display:flex;align-items:center;gap:5px;font-size:12px;padding:1px 6px;border-radius:6px;cursor:pointer;margin:1px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ev:hover{background:var(--sel)}
.ev .t{overflow:hidden;text-overflow:ellipsis}
.ev.task{color:var(--ink-2)}
.cal-list .day-h{font-family:var(--serif);font-size:15px;margin:16px 0 6px;font-weight:600}

/* ---------- tasks ---------- */
.task-tree{padding:4px 2px}
.task-row{display:flex;align-items:center;gap:5px;padding:1px 2px;border-radius:6px;position:relative}
.task-row:hover{background:var(--surface-2)}
.task-row .caret{flex:0 0 16px;width:16px;min-width:16px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);cursor:pointer;border-radius:5px;font-size:10px}
.task-row .caret:hover{background:var(--sel);color:var(--ink)}
.task-row .caret.chidden{visibility:hidden}
.task-row input.tname{flex:1;border-color:transparent;background:transparent;min-width:140px}
.task-row input.tname:focus{border-color:var(--accent);background:var(--surface)}
.task-row.done input.tname{color:var(--ink-3);text-decoration:line-through}
.task-row .meta{display:flex;align-items:center;gap:6px;flex:none}
.task-row input[type=date]{border-color:transparent;background:transparent;color:var(--ink-2);font-size:12px;width:118px}
.task-row input[type=date]:hover{border-color:var(--line)}
.task-row .rowtools{display:none;gap:2px}
.task-row:hover .rowtools{display:inline-flex}
.task-row .dragh{opacity:0;width:14px;padding:0 2px}
.task-row:hover .dragh{opacity:.5}
.task-kids{margin-left:14px;border-left:1px solid var(--line-2);padding-left:6px}
.task-notes{margin:0 0 3px 40px}
.task-notes textarea{width:min(680px,94%);font-size:12.5px;min-height:44px}
.task-row .notebtn{font-size:11px;color:var(--ink-2);cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
.task-row .notebtn:hover{border-color:var(--accent);color:var(--accent)}
.task-row .notebtn.open{background:var(--accent-soft);border-color:var(--accent)}
.header-row .rowtools{display:none}
.header-row:hover .rowtools{display:inline-flex}
.tlinks{display:inline-flex;gap:4px;flex-wrap:wrap;max-width:340px}
.due-over{color:var(--bad)!important;font-weight:600}
.due-soon{color:var(--warn)!important;font-weight:600}
.task-row .prio{flex:none;width:30px;text-align:center;font-size:10.5px;font-weight:700;color:#fff;border-radius:5px;padding:2px 0;cursor:pointer;letter-spacing:.02em}
.task-row .prio.none{background:transparent;color:var(--ink-3);border:1px dashed var(--line)}
.task-row .prio.none:hover{color:var(--accent);border-color:var(--accent)}
.task-row .towner{width:88px;border-color:transparent;background:transparent;font-size:12px;color:var(--ink-2)}
.task-row .towner:hover{border-color:var(--line)}
.task-row .towner:focus{border-color:var(--accent);background:var(--surface)}
.header-row{margin-top:10px;border-bottom:1px solid var(--line);border-radius:0;padding-bottom:4px}
.header-row input.theader{flex:1;border-color:transparent;background:transparent;font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink)}
.header-row input.theader:focus{border-color:var(--accent);background:var(--surface)}
/* notes: page rail + heading */
.note-rail{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.note-tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit;color:var(--ink-2);display:inline-flex;gap:5px;align-items:center}
.note-tab:hover{border-color:var(--ink-3);color:var(--ink)}
.note-tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.note-tab.add{border-style:dashed;color:var(--ink-3)}
.page-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.page-head .pico{font-size:26px;cursor:pointer;line-height:1}
.page-head .ptitle{flex:1;border:0;background:none;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink);padding:2px 4px;border-radius:6px}
.page-head .ptitle:hover,.page-head .ptitle:focus{background:var(--surface-2);outline:none}

/* ---------- status / notes editor ---------- */
.doc{max-width:860px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:44px 56px;min-height:60vh}
.blk{position:relative;margin:2px 0;border-radius:6px}
.blk .bc{outline:none;padding:3px 6px;border-radius:6px;min-height:1.4em}
.blk .bc:focus{background:var(--surface-2)}
.blk .bc:empty:before{content:attr(data-ph);color:var(--ink-3)}
.blk.t-h1 .bc{font-family:var(--serif);font-size:26px;font-weight:600;margin-top:10px}
.blk.t-h2 .bc{font-family:var(--serif);font-size:20px;font-weight:600;margin-top:8px}
.blk.t-h3 .bc{font-size:16px;font-weight:600}
.blk.t-bullet{display:flex}.blk.t-bullet:before{content:'•';padding:3px 2px 0 10px;color:var(--ink-2)}
.blk.t-bullet .bc{flex:1}
.blk.t-callout{background:var(--accent-soft);border:1px solid #eadbce;padding:6px 10px}
.blk.t-divider{border-top:1px solid var(--line);margin:14px 0;height:0}
.blk .handle{position:absolute;left:-30px;top:3px;opacity:0;color:var(--ink-3);cursor:pointer;padding:2px 6px;border-radius:5px;font-size:13px}
.blk:hover .handle{opacity:1}
.blk .handle:hover{background:var(--sel)}
.blk.t-toggle>.tg-head{display:flex;align-items:flex-start;gap:2px}
.blk.t-toggle>.tg-head .tgc{cursor:pointer;padding:4px 4px 0 2px;color:var(--ink-2);font-size:11px;width:18px;flex:none;text-align:center}
.blk.t-toggle>.tg-head .bc{flex:1;font-weight:600}
.blk.t-toggle>.tg-kids{margin-left:22px;border-left:1px solid var(--line-2);padding-left:8px}
.blk table.ntbl{border-collapse:collapse;margin:4px 0;width:100%}
.blk table.ntbl td{border:1px solid var(--line);padding:4px 8px;min-width:70px}
.blk table.ntbl td[contenteditable]:focus{background:var(--surface-2);outline:none}
.blk table.ntbl tr:first-child td{background:var(--surface-2);font-weight:600}
.tbl-tools{display:none;gap:4px;margin:2px 0 6px}
.blk:hover .tbl-tools{display:flex}
#slashmenu{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(34,48,62,.18);padding:5px;display:none;width:230px}
#slashmenu button{display:flex;width:100%;border:0;background:none;text-align:left;padding:6px 10px;border-radius:7px;cursor:pointer;font:inherit;gap:9px;align-items:center}
#slashmenu button:hover,#slashmenu button.hl{background:var(--sel)}
#slashmenu .ic{width:22px;text-align:center;color:var(--ink-2)}

/* ---------- link picker ---------- */
#lp-results{max-height:320px;overflow:auto;margin-top:8px}
#lp-results button{display:flex;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit;gap:9px;align-items:center}
#lp-results button:hover{background:var(--sel)}
#lp-results .ty{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);width:64px;flex:none}
#lp-results .sub{color:var(--ink-3);font-size:12px;margin-left:auto}

.backlinks{margin-top:4px}
.empty{padding:36px;text-align:center;color:var(--ink-3)}
.settings-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
input[type=color]{padding:0;width:34px;height:28px;border-radius:6px;cursor:pointer}
@media print{header,.toolbar{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark">M</span><span id="progName" contenteditable="true" spellcheck="false"></span></div>
  <nav class="tabs" id="tabs">
    <button data-tab="budget">Budget</button>
    <button data-tab="calendar">Calendar</button>
    <button data-tab="actions">Actions</button>
    <button data-tab="status">Notes</button>
  </nav>
  <div class="hd-actions">
    <span class="stamp" id="stamp"></span>
    <button class="btn sm" data-act="saveJSON" title="Save programme file (JSON)">💾 Save</button>
    <button class="btn sm" data-act="openJSON" title="Open programme file">📂 Open</button>
    <button class="btn sm" data-act="importCSV" title="Download data to Excel, edit, and re-upload">📥 Data</button>
    <button class="btn sm" data-act="exportExcel" title="Export to Excel">📊 Excel</button>
    <button class="btn sm" data-act="exportMD" title="Export Markdown snapshot (AI-friendly)">📝 Markdown</button>
    <button class="btn sm ghost" data-act="settings" title="Settings">⚙</button>
  </div>
</header>
<main id="view"></main>
<dialog id="modal"></dialog>
<div id="slashmenu"></div>
<div id="toast"></div>
<div id="start">
  <div class="panel">
    <h1>Programme Manager</h1>
    <div class="sub">Budgets · Calendar · Actions · Status — one file per programme.</div>
    <form data-form="newProgramme">
      <label class="f"><span>New programme name</span><input name="name" placeholder="e.g. Bike Hubs" required></label>
      <button class="btn primary" type="submit">Create programme</button>
      <button class="btn" type="button" data-act="openJSON">Open a programme file…</button>
    </form>
    <div class="existing" id="startExisting"></div>
  </div>
</div>
<input type="file" id="filein" accept=".json,application/json" style="display:none">
<script>
'use strict';
/* ================= core: state, persistence, boot ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const parseNum=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0;};
const fmt=n=>Number(n||0).toLocaleString('en-NZ',{minimumFractionDigits:0,maximumFractionDigits:2});
const money=n=>(S.programme.currency||'$')+fmt(n);
const dstr=d=>d?new Date(d+'T00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'}):'';

let S=null, lsKey=null, TAB='budget';

function defaultState(name){return {
  v:5,
  programme:{name:name||'New Programme',currency:'$',created:todayStr(),modified:''},
  settings:{
    whereLabel:'Where',   // customisable secondary identifier (e.g. "Site", "Workstream", "Region")
    taskStates:[
      {id:'todo', name:'To do', color:'#96a2ae', done:false},
      {id:'doing',name:'Doing', color:'#b06a3b', done:false},
      {id:'done', name:'Complete', color:'#4a7c59', done:true},
    ],
    taskPriorities:[
      {id:'p1',name:'P1 · Urgent',color:'#b3423a'},
      {id:'p2',name:'P2 · High',color:'#b45309'},
      {id:'p3',name:'P3 · Normal',color:'#5b6b7a'},
      {id:'p4',name:'P4 · Low',color:'#96a2ae'},
    ],
    taskTags:[
      {id:'chasing',name:'Chasing',color:'#b45309'},
      {id:'blocked',name:'Blocked',color:'#b3423a'},
      {id:'quickwin',name:'Quick win',color:'#4a7c59'},
    ],
    eventTags:[
      {id:'milestone',name:'Milestone',color:'#b06a3b'},
      {id:'meeting',  name:'Meeting',  color:'#22303e'},
      {id:'hui',      name:'Hui',      color:'#4a7c59'},
      {id:'activation',name:'Activation/Activity',color:'#7a5299'},
      {id:'deadline', name:'Deadline', color:'#b3423a'},
    ],
    fcStatuses:[
      {id:'planned',name:'Planned',color:'#96a2ae'},
      {id:'committed',name:'Committed',color:'#b06a3b'},
      {id:'inprogress',name:'In progress',color:'#b45309'},
      {id:'complete',name:'Complete',color:'#4a7c59'},
    ],
  },
  contracts:[],  // {id,supplier,supplierNumber,contractNumber,totalValue,variations:[{id,label,value,date}],startDate,endDate,notes,archived,what,where}
  pos:[],        // {id,poNumber,contractId ('' = standalone),supplier,description,archived,where}
  poLines:[],    // {id,poId,lineNo,wbs,spendCode,glCode,value,description,archived}
  invoices:[],   // {id,poLineId,invoiceNumber,value,date,forWhat,notes}
  budget:[],     // legacy manual budget lines (shown read-only on Overview)
  fcLines:[],    // forecast lines {id,parentRef,poId,poLineId,forWhat,statusId,startDate,endDate,archived}
  forecast:{},   // '<type>:<id>|<period>' -> {mode:'val'|'pct', v:number}
  fcCfg:{gran:'month',start:currentMonthKey(),count:12},
  events:[],     // {id,title,date,endDate,time,tagIds:[],organiser,notes,links:[]}
  tasks:[],      // nested: {id,name,type('task'|'header'),due,lastActioned,completed,stateId,priorityId,owner,tagIds:[],notes,links:[],collapsed,children:[]}
  notes:[{id:uid(),name:'Notes',icon:'📝',kind:'doc',blocks:[{id:uid(),type:'h1',html:'Notes'},{id:uid(),type:'p',html:''}]}],  // pages (was S.status)
  links:[],      // links database [{id,title,url,category,notes}]
  views:[],      // custom budget views {id,name,cols:[],groupBy,filter}
  structViews:[],// saved contract-page views {id,name,filter,mode}
  fcViews:[],    // saved forecast views {id,name,gran,start,count,filter}
  ui:{budgetTab:'lines',calMode:'month',calDate:todayStr(),view:'full',hideDone:false,
      budgetArch:'hide',structView:'active',structFilter:'',fcFilter:'',fcView:'',fcOpen:{},
      structCollapsed:{},poCollapsed:{},notePage:'',taskGroup:'',taskWeekOnly:false,fcArch:'active'},
};}
function currentMonthKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

function save(){ if(!S) return; S.programme.modified=new Date().toISOString();
  try{ localStorage.setItem(lsKey,JSON.stringify(S)); }catch(e){ console.warn(e); }
  const t=new Date(); $('#stamp').textContent='Saved '+t.toLocaleTimeString('en-NZ',{hour:'2-digit',minute:'2-digit'});
}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'programme';}
function listLocal(){const out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
  if(k.startsWith('progapp:data:')){try{const d=JSON.parse(localStorage.getItem(k));out.push({key:k,name:d.programme.name,modified:d.programme.modified});}catch(e){}}}
  return out.sort((a,b)=>(b.modified||'').localeCompare(a.modified||''));}

function boot(){
  const last=localStorage.getItem('progapp:last');
  if(last&&localStorage.getItem(last)){ openKey(last); } else { showStart(); }
}
function showStart(){
  const ex=listLocal();
  $('#startExisting').innerHTML= ex.length? '<div class="small muted" style="margin-bottom:6px">Programmes on this computer</div>'+
    ex.map(p=>`<button data-act="openKey" data-key="${esc(p.key)}"><span>${esc(p.name)}</span><span class="muted small">${p.modified?new Date(p.modified).toLocaleDateString('en-NZ'):''}</span></button>`).join('') : '';
  $('#start').classList.add('show');
}
function openKey(key){
  try{ S=migrate(JSON.parse(localStorage.getItem(key))); }catch(e){ toast('Could not open programme'); showStart(); return; }
  lsKey=key; localStorage.setItem('progapp:last',key);
  $('#start').classList.remove('show'); initUI();
}
function createProgramme(name){
  S=defaultState(name); lsKey='progapp:data:'+slug(name)+'-'+uid().slice(-4);
  localStorage.setItem('progapp:last',lsKey); save();
  $('#start').classList.remove('show'); initUI();
}
function migrate(d){ const def=defaultState('x');
  for(const k of Object.keys(def)) if(d[k]===undefined) d[k]=def[k];
  for(const k of Object.keys(def.ui)) if(d.ui[k]===undefined) d.ui[k]=def.ui[k];
  if(!d.v||d.v<2){ // v1 → v2: variations move from budget lines to contracts; forecast re-keyed
    (d.budget||[]).forEach(r=>{ const vars=r.variations||[];
      if(vars.length){ const c=(d.contracts||[]).find(c=>c.id===r.contractId);
        if(c){ c.variations=(c.variations||[]).concat(vars); }
        else { r.orig=parseNum(r.orig)+vars.reduce((s,v)=>s+parseNum(v.value),0); } }
      delete r.variations; });
    const nf={};
    Object.entries(d.forecast||{}).forEach(([k,v])=>{ const [rid,p]=k.split('|');
      if(rid.includes(':')){ nf[k]=v; return; }
      const r=(d.budget||[]).find(b=>b.id===rid);
      let ref='budget:'+rid;
      if(r&&r.contractId) ref='contract:'+r.contractId; else if(r&&r.poId) ref='po:'+r.poId;
      const nk=ref+'|'+p;
      if(nf[nk]&&nf[nk].mode===v.mode) nf[nk]={mode:v.mode,v:nf[nk].v+v.v}; else nf[nk]=v; });
    d.forecast=nf; d.v=2;
  }
  if(d.v<3){ // v2 → v3: PO-line forecasts become named forecast lines under their contract/PO
    d.fcLines=d.fcLines||[];
    const map={};
    Object.entries(d.forecast||{}).forEach(([k,v])=>{ const [ref,p]=k.split('|');
      if(!ref.startsWith('poline:')) return;
      const lid=ref.slice(7);
      if(!map[lid]){ const l=(d.poLines||[]).find(x=>x.id===lid); if(!l){ delete d.forecast[k]; return; }
        const po=(d.pos||[]).find(x=>x.id===l.poId);
        const parentRef=po&&po.contractId?('contract:'+po.contractId):('po:'+(po?po.id:''));
        const f={id:uid(),parentRef,poId:l.poId,poLineId:lid,forWhat:''};
        d.fcLines.push(f); map[lid]=f.id; }
      d.forecast['fcline:'+map[lid]+'|'+p]=v; delete d.forecast[k];
    });
    d.v=3;
  }
  if(d.v<4){ // v3 → v4: status doc becomes the first notes page; new settings/fields backfilled
    d.notes=d.notes||[];
    if(d.status&&d.status.length) d.notes.unshift({id:uid(),name:'Notes',icon:'📝',blocks:d.status});
    delete d.status;
    const def=defaultState('x');
    if(!d.settings.whereLabel) d.settings.whereLabel='Where';
    ['taskPriorities','taskTags','fcStatuses'].forEach(k=>{ if(!d.settings[k]) d.settings[k]=def.settings[k]; });
    if(!(d.settings.eventTags||[]).some(t=>t.id==='activation')) (d.settings.eventTags=d.settings.eventTags||[]).push({id:'activation',name:'Activation/Activity',color:'#7a5299'});
    d.links=d.links||[];
    d.v=4;
  }
  if(d.v<5){ // v4 → v5: contract/PO-level forecast entries become forecast lines so the parent row is a pure sum
    d.fcLines=d.fcLines||[];
    const parents={};
    Object.keys(d.forecast||{}).forEach(k=>{ const [ref,p]=k.split('|');
      if(ref.startsWith('contract:')||ref.startsWith('po:')){
        if(!parents[ref]){ const f={id:uid(),parentRef:ref,poId:'',poLineId:'',forWhat:'General',statusId:'',startDate:'',endDate:'',archived:false}; d.fcLines.push(f); parents[ref]=f.id; }
        d.forecast['fcline:'+parents[ref]+'|'+p]=d.forecast[k]; delete d.forecast[k];
      }
    });
    d.v=5;
  }
  (d.fcLines||[]).forEach(f=>{ if(f.archived===undefined) f.archived=false; });
  if(!d.notes||!d.notes.length) d.notes=[{id:uid(),name:'Notes',icon:'📝',blocks:[{id:uid(),type:'h1',html:'Notes'},{id:uid(),type:'p',html:''}]}];
  (d.contracts||[]).forEach(c=>{ if(!c.variations) c.variations=[]; });
  (d.tasks||[]).forEach(function fix(t){ if(!t.type) t.type='task'; if(!t.tagIds) t.tagIds=[]; (t.children||[]).forEach(fix); });
  if(!d.ui.fcOpen) d.ui.fcOpen={};
  if(!d.ui.structCollapsed) d.ui.structCollapsed={};
  if(!d.ui.poCollapsed) d.ui.poCollapsed={};
  if(!d.links) d.links=[];
  return d;
}
function importState(obj){
  if(!obj||!obj.programme){ toast('Not a valid programme file'); return; }
  S=migrate(obj); lsKey='progapp:data:'+slug(S.programme.name)+'-'+uid().slice(-4);
  const dup=listLocal().find(p=>p.name===S.programme.name);
  if(dup) lsKey=dup.key; // overwrite the local copy of the same programme
  localStorage.setItem('progapp:last',lsKey); save();
  $('#start').classList.remove('show'); initUI(); toast('Programme loaded');
}
function initUI(){
  $('#progName').textContent=S.programme.name;
  document.title=S.programme.name+' — Programme Manager';
  setTab(TAB);
}
function setTab(name){ TAB=name;
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  render();
}
function render(){
  const v=$('#view');
  if(TAB==='budget') renderBudget(v);
  else if(TAB==='calendar') renderCalendar(v);
  else if(TAB==='actions') renderTasks(v);
  else if(TAB==='status') renderStatus(v);
}

/* ================= lookups & derived values ================= */
const byId=(arr,id)=>arr.find(x=>x.id===id);
const contractOf=id=>byId(S.contracts,id), poOf=id=>byId(S.pos,id), lineOf=id=>byId(S.poLines,id);
const linesOfPO=poId=>S.poLines.filter(l=>l.poId===poId);
const posOfContract=cId=>S.pos.filter(p=>p.contractId===cId);
const invoicesOfLine=lId=>S.invoices.filter(i=>i.poLineId===lId);
const lineInvoiced=lId=>invoicesOfLine(lId).reduce((s,i)=>s+parseNum(i.value),0);
const contractLinesSum=cId=>posOfContract(cId).flatMap(p=>linesOfPO(p.id)).reduce((s,l)=>s+parseNum(l.value),0);
const contractVarsSum=c=>(c.variations||[]).reduce((s,v)=>s+parseNum(v.value),0);
const contractCurrent=c=>parseNum(c.totalValue)+contractVarsSum(c);
const contractActuals=cId=>posOfContract(cId).flatMap(p=>linesOfPO(p.id)).reduce((s,l)=>s+lineInvoiced(l.id),0);
const poLinesSum=poId=>linesOfPO(poId).reduce((s,l)=>s+parseNum(l.value),0);
const poActuals=poId=>linesOfPO(poId).reduce((s,l)=>s+lineInvoiced(l.id),0);
const standalonePOs=()=>S.pos.filter(p=>!p.contractId);
function rowCalc(r){ // budget row derived values — auto-populated from the linked contract / PO
  const c=contractOf(r.contractId), p=poOf(r.poId), l=lineOf(r.poLineId);
  let orig,vars,current,actuals;
  if(c){ orig=parseNum(c.totalValue); vars=contractVarsSum(c); current=orig+vars; actuals=contractActuals(c.id); }
  else if(l){ orig=parseNum(l.value); vars=0; current=orig; actuals=lineInvoiced(l.id); }
  else if(p){ orig=poLinesSum(p.id); vars=0; current=orig; actuals=poActuals(p.id); }
  else { orig=parseNum(r.orig); vars=0; current=orig; actuals=0; }
  return {orig,vars,current,actuals,remaining:current-actuals,auto:!!(c||p||l),
    supplier:c?c.supplier:(p&&p.supplier?p.supplier:(r.supplier||'')),
    contractNo:c?c.contractNumber:'', poNo:p?p.poNumber:'',
    lineNo:l?l.lineNo:'',
    endDate:c&&c.endDate?c.endDate:(r.endDate||'')};
}

/* ================= cross-linking ================= */
const TYPE_META={
  task:{ic:'☑',label:'Task'}, event:{ic:'📅',label:'Event'}, contract:{ic:'📜',label:'Contract'},
  po:{ic:'🧾',label:'PO'}, poline:{ic:'#',label:'PO line'}, budget:{ic:'💰',label:'Budget'}, invoice:{ic:'🧮',label:'Invoice'},
};
function walkTasks(fn,list,depth,parent){ (list||S.tasks).forEach(t=>{ fn(t,depth||0,parent||null); if(t.children&&t.children.length) walkTasks(fn,t.children,(depth||0)+1,t); }); }
function refLabel(type,id){
  if(type==='task'){ let n=null; walkTasks(t=>{if(t.id===id)n=t;}); return n?n.name||'(untitled task)':'(deleted task)'; }
  if(type==='event'){ const e=byId(S.events,id); return e?e.title||'(event)':'(deleted event)'; }
  if(type==='contract'){ const c=contractOf(id); return c?(c.supplier+' · '+(c.contractNumber||'no #')):'(deleted contract)'; }
  if(type==='po'){ const p=poOf(id); return p?('PO '+(p.poNumber||'?')):'(deleted PO)'; }
  if(type==='poline'){ const l=lineOf(id); if(!l) return '(deleted line)'; const p=poOf(l.poId); return 'PO '+(p?p.poNumber:'?')+' / '+(l.lineNo||'?'); }
  if(type==='budget'){ const b=byId(S.budget,id); return b?(b.what||'(budget line)'):'(deleted budget line)'; }
  if(type==='invoice'){ const i=byId(S.invoices,id); return i?('Inv '+(i.invoiceNumber||'?')):'(deleted invoice)'; }
  return '(?)';
}
function chipHTML(ref,removeCtx){ const [type,id]=ref.split(':'); const m=TYPE_META[type]||{ic:'∙'};
  return `<span class="chip" data-goto="${esc(ref)}"><span class="ic">${m.ic}</span>${esc(refLabel(type,id))}${removeCtx?`<span class="x" data-act="unlink" data-ref="${esc(ref)}" data-ctx="${esc(removeCtx)}" title="Remove link">×</span>`:''}</span>`;
}
function allEntities(){ const out=[];
  walkTasks((t,d)=>out.push({ref:'task:'+t.id,label:t.name||'(untitled)',sub:'· '.repeat(d)+(stateOf(t.stateId).name),ty:'Task'}));
  S.events.forEach(e=>out.push({ref:'event:'+e.id,label:e.title,sub:dstr(e.date),ty:'Event'}));
  S.contracts.forEach(c=>out.push({ref:'contract:'+c.id,label:c.supplier+' — '+(c.contractNumber||'no #'),sub:money(contractCurrent(c))+(c.archived?' · archived':''),ty:'Contract'}));
  S.pos.forEach(p=>{const c=contractOf(p.contractId);out.push({ref:'po:'+p.id,label:'PO '+(p.poNumber||'?'),sub:c?c.supplier:'',ty:'PO'});});
  S.poLines.forEach(l=>{const p=poOf(l.poId);out.push({ref:'poline:'+l.id,label:'PO '+(p?p.poNumber:'?')+' / line '+(l.lineNo||'?'),sub:money(l.value),ty:'PO line'});});
  S.budget.forEach(b=>out.push({ref:'budget:'+b.id,label:b.what||'(budget line)',sub:b.where||'',ty:'Budget'}));
  S.invoices.forEach(i=>out.push({ref:'invoice:'+i.id,label:'Inv '+(i.invoiceNumber||'?'),sub:money(i.value),ty:'Invoice'}));
  return out;
}
let lpCallback=null;
function linkPicker(cb,excludeRef){ lpCallback=cb;
  modal(`<div class="m-h"><h3>Link to…</h3></div><div class="m-b">
    <input id="lp-q" placeholder="Search tasks, events, contracts, POs, budget lines…" style="width:100%" autocomplete="off">
    <div id="lp-results"></div></div>
    <div class="m-f"><button class="btn" data-act="closeModal">Cancel</button></div>`);
  const draw=q=>{ q=(q||'').toLowerCase();
    const items=allEntities().filter(e=>e.ref!==excludeRef&&(!q||(e.label+' '+e.sub+' '+e.ty).toLowerCase().includes(q))).slice(0,40);
    $('#lp-results').innerHTML=items.map(e=>`<button data-act="lpPick" data-ref="${esc(e.ref)}"><span class="ty">${e.ty}</span><span>${esc(e.label)}</span><span class="sub">${esc(e.sub)}</span></button>`).join('')||'<div class="empty">Nothing found</div>';
  };
  draw(''); $('#lp-q').addEventListener('input',e=>draw(e.target.value)); setTimeout(()=>{const i=$('#lp-q'); if(i) i.focus();},50);
}
function backlinksTo(ref){ const out=[];
  walkTasks(t=>{ if((t.links||[]).includes(ref)) out.push('task:'+t.id); });
  S.events.forEach(e=>{ if((e.links||[]).includes(ref)) out.push('event:'+e.id); });
  S.notes.forEach(pg=>{ const scan=b=>{ if(b.html&&b.html.includes('data-goto="'+ref+'"')) out.push('note:'+pg.id); (b.children||[]).forEach(scan); }; (pg.blocks||[]).forEach(scan); });
  return out;
}
function gotoRef(ref){ const [type,id]=ref.split(':');
  if(ref==='__status'||type==='status'||type==='note'){ if(type==='note'&&byId(S.notes,id)) S.ui.notePage=id; setTab('status'); return; }
  const tab={task:'actions',event:'calendar'}[type]||'budget';
  if(type==='event'){ const e=byId(S.events,id); if(e){ S.ui.calDate=e.date; } }
  if(['contract','po','poline','invoice'].includes(type)) S.ui.budgetTab='structure';
  if(type==='budget') S.ui.budgetTab='lines';
  if(type==='task'){ // expand ancestors so it is visible
    const expand=(list,path)=>{ for(const t of list){ if(t.id===id){ path.forEach(a=>a.collapsed=false); return true; } if(t.children&&expand(t.children,[...path,t])) return true; } return false; };
    expand(S.tasks,[]);
  }
  setTab(tab);
  setTimeout(()=>{ const el=document.querySelector(`[data-anchor="${ref}"]`);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    else if(type==='event'){ openEventModal(id); }
  },80);
}
const stateOf=id=>byId(S.settings.taskStates,id)||S.settings.taskStates[0]||{id:'todo',name:'To do',color:'#999',done:false};
const tagOf=id=>byId(S.settings.eventTags,id);
const taskTagOf=id=>byId(S.settings.taskTags||[],id);
const priorityOf=id=>byId(S.settings.taskPriorities||[],id);
const priorityName=id=>{const p=priorityOf(id);return p?p.name:'';};
const fcStatusOf=id=>byId(S.settings.fcStatuses||[],id);
const fcStatusName=id=>{const s=fcStatusOf(id);return s?s.name:'';};
function fcSupplier(ref){ const [t,id]=ref.split(':');
  if(t==='contract'){ const c=contractOf(id); return c?c.supplier:''; }
  if(t==='po'){ const p=poOf(id); return p?(p.supplier||''):''; }
  return ''; }

/* ================= modal / toast / delegation ================= */
function modal(html){ const d=$('#modal'); d.innerHTML=html; if(!d.open) d.showModal(); }
function closeModal(){ const d=$('#modal'); if(d.open) d.close(); d.innerHTML=''; }
let toastTimer=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

const ACTIONS={}, FORMS={};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]');
  if(g&&!e.target.closest('.x')){ e.preventDefault(); gotoRef(g.dataset.goto); return; }
  const t=e.target.closest('[data-act]');
  if(t){ const fn=ACTIONS[t.dataset.act]; if(fn){ e.preventDefault(); fn(t,e); } return; }
  const tb=e.target.closest('#tabs button');
  if(tb) setTab(tb.dataset.tab);
});
document.addEventListener('change',e=>{
  const b=e.target.closest('[data-bind]'); if(b){ handleBind(b); return; }
  const f=e.target.closest('[data-fc]'); if(f){ handleForecastCell(f); return; }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]'); if(f){ e.preventDefault(); const fn=FORMS[f.dataset.form]; if(fn) fn(f); }
});
$('#progName').addEventListener('blur',()=>{ S.programme.name=$('#progName').textContent.trim()||S.programme.name; $('#progName').textContent=S.programme.name; document.title=S.programme.name+' — Programme Manager'; save(); });
$('#progName').addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();e.target.blur();} });

/* data-bind="collection.id.field" (collections) or "path.field" for S.programme etc */
function handleBind(el){
  const parts=el.dataset.bind.split('.');
  const type=el.dataset.type||'text';
  let val=el.value;
  if(type==='num') val=parseNum(val);
  if(el.type==='checkbox') val=el.checked;
  if(parts[0]==='programme'||parts[0]==='fcCfg'||parts[0]==='ui'){ S[parts[0]][parts[1]]= (type==='num'?parseNum(val):val); }
  else{
    const coll=S[parts[0]]; const item=byId(coll,parts[1]);
    if(!item) return;
    item[parts[2]]=val;
    if(parts[0]==='budget'){ // trickle-down resets
      if(parts[2]==='contractId'){ item.poId=''; item.poLineId=''; }
      if(parts[2]==='poId'){ item.poLineId=''; }
    }
    if(parts[0]==='fcLines'&&parts[2]==='poId') item.poLineId='';
  }
  save();
  const norerender=el.dataset.norerender;
  if(!norerender) renderKeepFocus();
}
/* re-render without breaking Tab-through-fields: after the change event settles,
   remember which field now has focus, rebuild the view, then restore focus + caret */
function renderKeepFocus(){
  setTimeout(()=>{
    const ae=document.activeElement; let attr=null;
    for(const a of ['data-bind','data-fc','data-tname','data-tdue','data-tnotes']){ if(ae&&ae.getAttribute&&ae.getAttribute(a)!==null){ attr=a; break; } }
    const key=attr?ae.getAttribute(attr):null;
    let selS=null,selE=null; try{ selS=ae.selectionStart; selE=ae.selectionEnd; }catch(e){}
    render();
    if(key){ const el=document.querySelector(`[${attr}="${key}"]`);
      if(el){ el.focus(); try{ if(selS!=null&&el.setSelectionRange) el.setSelectionRange(selS,selE); }catch(e){} } }
  },0);
}
/* ---- drag & drop reordering (contracts, POs, PO lines, forecast lines) ---- */
let DRAG=null;
function taskParentList(id){ const r=findTask(id); return r?r.list:null; }
function dragArrayFor(coll,id){ if(coll==='tasks') return taskParentList(id); return S[coll]; }
function sameDragGroup(coll,aId,bId){
  if(coll==='contracts'||coll==='links') return true;
  if(coll==='pos') return ((poOf(aId)||{}).contractId||'')===((poOf(bId)||{}).contractId||'');
  if(coll==='poLines') return (lineOf(aId)||{}).poId===(lineOf(bId)||{}).poId;
  if(coll==='fcLines') return (byId(S.fcLines,aId)||{}).parentRef===(byId(S.fcLines,bId)||{}).parentRef;
  if(coll==='tasks'){ const a=taskParentList(aId); const b=taskParentList(bId); return a&&a===b; }
  return false;
}
function reorderIn(arr,dragId,targetId,before){
  if(!arr) return;
  const di=arr.findIndex(x=>x.id===dragId); if(di<0) return;
  const [item]=arr.splice(di,1);
  let ti=arr.findIndex(x=>x.id===targetId); if(ti<0){ arr.splice(di,0,item); return; }
  arr.splice(before?ti:ti+1,0,item);
}
document.addEventListener('dragstart',e=>{ const h=e.target.closest&&e.target.closest('[data-drag]');
  if(!h) return; DRAG=h.dataset.drag; e.dataTransfer.setData('text/plain',DRAG); e.dataTransfer.effectAllowed='move'; });
document.addEventListener('dragover',e=>{ if(!DRAG) return;
  const t=e.target.closest&&e.target.closest('[data-drop]'); if(!t) return;
  const [c,id]=DRAG.split(':'), [tc,tid]=t.dataset.drop.split(':');
  if(c!==tc||id===tid||!sameDragGroup(c,id,tid)) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  const rect=t.getBoundingClientRect(); const before=e.clientY<rect.top+rect.height/2;
  t.classList.toggle('drop-above',before); t.classList.toggle('drop-below',!before);
});
document.addEventListener('dragleave',e=>{ const t=e.target.closest&&e.target.closest('[data-drop]');
  if(t){ t.classList.remove('drop-above','drop-below'); } });
document.addEventListener('drop',e=>{ if(!DRAG) return;
  const t=e.target.closest&&e.target.closest('[data-drop]'); if(!t){ DRAG=null; return; }
  t.classList.remove('drop-above','drop-below');
  const [c,id]=DRAG.split(':'), [tc,tid]=t.dataset.drop.split(':'); DRAG=null;
  if(c!==tc||id===tid||!sameDragGroup(c,id,tid)) return;
  e.preventDefault();
  const rect=t.getBoundingClientRect(); const before=e.clientY<rect.top+rect.height/2;
  reorderIn(dragArrayFor(c,id),id,tid,before); save(); render();
});
document.addEventListener('dragend',()=>{ DRAG=null; $$('.drop-above,.drop-below').forEach(el=>el.classList.remove('drop-above','drop-below')); });

/* ---- Enter = move down the column (Excel-style); works in any data table ---- */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey||e.ctrlKey||e.metaKey) return;
  const el=e.target;
  if(!el||el.tagName==='SELECT') return;
  const table=el.closest&&el.closest('table.tbl'); if(!table) return;
  if(el.dataset.fc){ e.preventDefault();
    const period=el.dataset.fc.split('|')[1];
    const all=[...table.querySelectorAll('input[data-fc]')].filter(i=>i.dataset.fc.split('|')[1]===period);
    const i=all.indexOf(el); if(i>=0&&all[i+1]){ all[i+1].focus(); try{all[i+1].select();}catch(_){} }
    return; }
  if(el.dataset.bind){ e.preventDefault();
    const parts=el.dataset.bind.split('.'); const coll=parts[0], field=parts[parts.length-1];
    const all=[...table.querySelectorAll(`[data-bind^="${coll}."]`)].filter(i=>i.dataset.bind.endsWith('.'+field));
    const i=all.indexOf(el); if(i>=0&&all[i+1]){ all[i+1].focus(); try{all[i+1].select();}catch(_){} }
    return; }
});

/* ---- copy / paste a whole PO line ---- */
let LINE_CLIP=null;
const LINE_FIELDS=['lineNo','description','wbs','spendCode','glCode','value'];
ACTIONS.copyLine=t=>{ const l=lineOf(t.dataset.id); if(!l) return;
  LINE_CLIP=LINE_FIELDS.map(k=>l[k]??'');
  try{ navigator.clipboard.writeText(LINE_CLIP.join('\t')); }catch(_){}
  save(); render(); toast('Line copied — use 📋 on another line, or Ctrl-V in a cell');
};
ACTIONS.pasteLine=t=>{ const l=lineOf(t.dataset.id); if(!l||!LINE_CLIP) return;
  LINE_FIELDS.forEach((k,i)=>{ if(i===0) return; // keep the target's own line number
    l[k]=k==='value'?parseNum(LINE_CLIP[i]):String(LINE_CLIP[i]??''); });
  save(); render(); toast('Line values pasted');
};
document.addEventListener('paste',e=>{
  const el=e.target; if(!el||!el.dataset) return;
  const text=(e.clipboardData||window.clipboardData).getData('text');
  if(!text||(!text.includes('\t')&&!text.includes('\n'))) return; // single values paste normally
  const vals=text.replace(/\r/g,'').split(/[\t\n]/).map(v=>v.trim()).filter((v,i,a)=>!(v===''&&i===a.length-1));
  if(el.dataset.bind&&el.dataset.bind.startsWith('poLines.')){ // fill across the PO line row
    e.preventDefault();
    const [,id,field]=el.dataset.bind.split('.');
    const l=lineOf(id); if(!l) return;
    let idx=LINE_FIELDS.indexOf(field); if(idx<0) return;
    vals.forEach(v=>{ if(idx<LINE_FIELDS.length){ const k=LINE_FIELDS[idx];
      l[k]=k==='value'?parseNum(v):v; idx++; } });
    save(); render(); toast('Pasted across the line');
    return;
  }
  if(el.dataset.fc){ // fill across consecutive forecast periods
    e.preventDefault();
    const [ref,startKey]=el.dataset.fc.split('|');
    const ps=periodList(); let i=ps.findIndex(p=>p.key===startKey); if(i<0) return;
    vals.forEach(v=>{ if(i<ps.length){ const key=ref+'|'+ps[i].key;
      if(!v) delete S.forecast[key];
      else if(v.endsWith('%')) S.forecast[key]={mode:'pct',v:parseNum(v)};
      else S.forecast[key]={mode:'val',v:parseNum(v)};
      i++; } });
    save(); render(); toast('Pasted across '+Math.min(vals.length,ps.length)+' periods');
    return;
  }
});

function overviewRows(){
  const rows=[];
  S.contracts.forEach(c=>{
    const poList=posOfContract(c.id);
    rows.push({ref:'contract:'+c.id,kind:'Contract',archived:!!c.archived,
      what:c.what||c.contractNumber||c.supplier||'',where:c.where||'',supplier:c.supplier||'',contractNo:c.contractNumber||'',
      poNo:poList.map(p=>p.poNumber).filter(Boolean).join(', '),
      lineCount:poList.reduce((s,p)=>s+linesOfPO(p.id).length,0),
      orig:parseNum(c.totalValue),vars:contractVarsSum(c),current:contractCurrent(c),
      endDate:c.endDate||'',actuals:contractActuals(c.id),notes:c.notes||''});
  });
  standalonePOs().forEach(p=>{
    rows.push({ref:'po:'+p.id,kind:'Standalone PO',archived:!!p.archived,
      what:p.description||'',where:p.where||'',supplier:p.supplier||'',contractNo:'',
      poNo:p.poNumber||'',lineCount:linesOfPO(p.id).length,
      orig:poLinesSum(p.id),vars:0,current:poLinesSum(p.id),
      endDate:'',actuals:poActuals(p.id),notes:''});
  });
  S.budget.forEach(r=>{ const d=rowCalc(r); // legacy manual lines
    rows.push({ref:'budget:'+r.id,kind:'Manual',archived:!!r.archived,legacy:true,id:r.id,
      what:r.what||'',where:r.where||'',supplier:d.supplier,contractNo:d.contractNo,
      poNo:d.poNo,lineCount:'',orig:d.orig,vars:d.vars,current:d.current,
      endDate:d.endDate,actuals:d.actuals,notes:r.notes||''});

        :`<button class="btn sm ghost" data-goto="${r.ref}" title="Open in Contracts · POs · Lines">→</button>`}</span></td></tr>`).join('');
  }
  const tAll=sums(rows);

  $('#budget-body').innerHTML= rows.length?
    `<div class="tblwrap"><table class="tbl"><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}">${esc(colLabel(c))}</th>`).join('')}<th></th></tr></thead><tbody>${body}</tbody></table></div>

      <button class="btn primary" data-act="contractModal">+ Add a contract</button>
      <button class="btn" data-act="importCSV">📥 Import from CSV</button></div></div>`;

ACTIONS.showBacklinks=t=>{ const refs=backlinksTo(t.dataset.ref);
  modal(`<div class="m-h"><h3>Linked from</h3></div><div class="m-b">${refs.map(r=>r.startsWith('note:')?`<div style="margin:4px 0"><span class="chip" data-goto="${esc(r)}"><span class="ic">📄</span>${esc((byId(S.notes,r.slice(5))||{}).name||'Notes')}</span></div>`:`<div style="margin:4px 0">${chipHTML(r)}</div>`).join('')||'<div class="empty">No links</div>'}</div><div class="m-f"><button class="btn" data-act="closeModal">Close</button></div>`); };

/* variations live on the CONTRACT: original total value + variations = current contract value */
ACTIONS.cvariations=t=>{ const c=contractOf(t.dataset.id); if(!c) return;
  const rows=(c.variations||[]).map(v=>`<div class="settings-row">
    <input value="${esc(v.label)}" placeholder="Description" style="flex:1" onchange="updVar('${c.id}','${v.id}','label',this.value)">
    <input type="date" value="${esc(v.date||'')}" onchange="updVar('${c.id}','${v.id}','date',this.value)">
    <input class="num" style="width:110px" value="${v.value?fmt(v.value):''}" placeholder="0" onchange="updVar('${c.id}','${v.id}','value',this.value)">
    <button class="btn sm ghost danger" onclick="delVar('${c.id}','${v.id}')">✕</button></div>`).join('');
  modal(`<div class="m-h"><h3>Variations — ${esc(c.supplier)} ${esc(c.contractNumber||'')}</h3></div><div class="m-b">
    ${rows||'<div class="muted small" style="margin-bottom:8px">No variations yet.</div>'}
    <button class="btn sm" onclick="addVar('${c.id}')">+ Add variation</button>
    <div style="margin-top:14px;border-top:1px solid var(--line-2);padding-top:10px" class="small">
      Original ${money(c.totalValue)} + variations ${money(contractVarsSum(c))} = <b>current contract value ${money(contractCurrent(c))}</b></div>
  </div><div class="m-f"><button class="btn primary" data-act="closeModal">Done</button></div>`);
};
window.addVar=cid=>{ const c=contractOf(cid); c.variations=c.variations||[]; c.variations.push({id:uid(),label:'',value:0,date:todayStr()}); save(); ACTIONS.cvariations({dataset:{id:cid}}); render(); };
window.updVar=(cid,vid,k,val)=>{ const c=contractOf(cid); const v=byId(c.variations||[],vid); if(v){ v[k]=k==='value'?parseNum(val):val; save(); ACTIONS.cvariations({dataset:{id:cid}}); render(); } };
window.delVar=(cid,vid)=>{ const c=contractOf(cid); c.variations=(c.variations||[]).filter(v=>v.id!==vid); save(); ACTIONS.cvariations({dataset:{id:cid}}); render(); };

ACTIONS.customView=()=>{ const view=activeView();
  modal(`<div class="m-h"><h3>Custom view</h3></div><div class="m-b">
    <form data-form="saveView" id="cvform">
    <label class="f"><span>View name</span><input name="name" value="${esc(VIEW_TEMPLATES.some(t=>t.id===view.id)?'':view.name)}" placeholder="e.g. Monthly report" required></label>
    <div class="grid2">
      <label class="f"><span>Group by</span><select name="groupBy">
        <option value="">No grouping</option>
        <option value="supplier" ${view.groupBy==='supplier'?'selected':''}>Supplier</option>
        <option value="contract" ${view.groupBy==='contract'?'selected':''}>Contract</option></select></label>
      <label class="f"><span>Filter (text match)</span><input name="filter" value="${esc(view.filter||'')}" placeholder="e.g. henderson"></label>
    </div>
    <span class="small muted">Columns</span>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-top:4px">
      ${BUDGET_COLS.map(c=>`<label class="small nowrap"><input type="checkbox" name="col" value="${c.k}" ${view.cols.includes(c.k)?'checked':''}> ${esc(colLabel(c))}</label>`).join('')}
    </div></form>
  </div><div class="m-f">
    ${byId(S.views,view.id)?`<button class="btn danger" data-act="delView" data-id="${view.id}" style="margin-right:auto">Delete view</button>`:''}
    <button class="btn" data-act="closeModal">Cancel</button>
    <button class="btn primary" type="submit" form="cvform">Save view</button></div>`);
};
FORMS.saveView=f=>{ const cols=[...f.querySelectorAll('input[name=col]:checked')].map(i=>i.value);
  if(!cols.length) return toast('Pick at least one column');
  const existing=byId(S.views,S.ui.view);
  const v=existing&&existing.name===f.name.value?existing:{id:uid()};
  v.name=f.name.value.trim(); v.cols=cols; v.groupBy=f.groupBy.value; v.filter=f.filter.value.trim();
  if(!byId(S.views,v.id)) S.views.push(v);
  S.ui.view=v.id; save(); closeModal(); render(); toast('View saved');
};
ACTIONS.delView=t=>{ S.views=S.views.filter(v=>v.id!==t.dataset.id); S.ui.view='full'; save(); closeModal(); render(); };

/* ----- contracts / POs / lines / invoices ----- */
const STRUCT_TEMPLATES=[
  {id:'active',name:'Active'},{id:'all',name:'Everything (incl. archived)'},
  {id:'ending90',name:'Ending within 90 days'},{id:'unrec',name:'Unreconciled'},{id:'archived',name:'Archived only'},
];
function structModeOf(viewId){ return STRUCT_TEMPLATES.some(t=>t.id===viewId)?viewId:(byId(S.structViews,viewId)||{}).mode||'active'; }
function structVisible(archived,mode){ return mode==='all'?true:(mode==='archived'?!!archived:!archived); }
function structTextMatch(strings,q){ return !q||strings.join(' ').toLowerCase().includes(q); }
function renderStructure(){
  const viewId=S.ui.structView||'active';
  const custom=byId(S.structViews,viewId);
  if(custom&&S.ui.structFilter===undefined) S.ui.structFilter=custom.filter;
  const mode=structModeOf(viewId);
  const q=(S.ui.structFilter||'').toLowerCase();
  $('#budget-tools').innerHTML=`
    <select data-act="none" id="structViewSel" title="View">
      ${STRUCT_TEMPLATES.map(t=>`<option value="${t.id}" ${viewId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}
      ${S.structViews.length?'<optgroup label="Saved views">'+S.structViews.map(t=>`<option value="${t.id}" ${viewId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')+'</optgroup>':''}
    </select>
    <input data-bind="ui.structFilter" value="${esc(S.ui.structFilter||'')}" placeholder="Filter… (supplier, number, WBS)" style="width:200px">
    <button class="btn sm" data-act="saveStructView" title="Save the current filter as a named view">💾 View</button>
    ${custom?`<button class="btn sm ghost danger" data-act="delStructView" data-id="${custom.id}" title="Delete saved view">✕</button>`:''}
    <button class="btn sm" data-act="poModal" title="Add a PO with no contract">+ PO (standalone)</button>
    <button class="btn sm primary" data-act="contractModal">+ Contract</button>`;
  $('#structViewSel').onchange=e=>{ S.ui.structView=e.target.value; const cv=byId(S.structViews,e.target.value); if(cv) S.ui.structFilter=cv.filter; save(); render(); };

  const today=todayStr(), soon=addDays(today,90);
  const contracts=S.contracts.filter(c=>{
    if(!structVisible(c.archived,mode)) return false;
    if(mode==='ending90'&&!(c.endDate&&c.endDate<=soon)) return false;
    if(mode==='unrec'){ const has=posOfContract(c.id).some(p=>linesOfPO(p.id).length); if(!has||Math.abs(contractCurrent(c)-contractLinesSum(c.id))<0.005) return false; }
    const poStr=posOfContract(c.id).map(p=>p.poNumber+' '+linesOfPO(p.id).map(l=>l.lineNo+' '+(l.wbs||'')+' '+(l.description||'')).join(' ')).join(' ');
    return structTextMatch([c.supplier,c.supplierNumber,c.contractNumber,c.notes||'',poStr],q);
  });
  const cards=contracts.map(c=>contractCardHTML(c,mode)).join('');
  const standalone=standalonePOs().filter(p=>structVisible(p.archived,mode)&&mode!=='ending90'&&mode!=='unrec'
    &&structTextMatch([p.poNumber,p.supplier||'',p.description||'',linesOfPO(p.id).map(l=>l.lineNo+' '+(l.wbs||'')).join(' ')],q));
  const saCard=standalone.length?`<div class="card contract-card">
      <div class="card-h"><span class="title">Standalone POs</span><span class="muted small">no contract</span>
      <span class="sp" style="flex:1"></span><button class="btn sm" data-act="poModal">+ PO</button></div>
      <div class="card-b">${standalone.map(p=>poBlockHTML(p,true)).join('')}</div></div>`:'';
  $('#budget-body').innerHTML=(cards+saCard)||`<div class="card"><div class="empty">${S.contracts.length||S.pos.length?'Nothing matches this view / filter.':'No contracts yet.'}<br><br>
    <button class="btn primary" data-act="contractModal">+ Add a contract</button>
    <button class="btn" data-act="poModal">+ Add a standalone PO</button>
    <button class="btn" data-act="importCSV">📥 Import from CSV</button></div></div>`;
}
function poBlockHTML(p,showSupplier){
  const lines=linesOfPO(p.id);
  const lrows=lines.map(l=>{
    const invs=invoicesOfLine(l.id);
    const invHTML=invs.map(i=>`<div class="inv" data-anchor="invoice:${i.id}">
        <span class="muted">Inv</span><b>${esc(i.invoiceNumber||'?')}</b>
        <span class="num nowrap">${money(i.value)}</span>
        ${i.date?`<span class="muted small">${dstr(i.date)}</span>`:''}
        <span class="muted">${esc(i.forWhat||'')}</span>${i.notes?`<span class="muted small" title="${esc(i.notes)}">🗒</span>`:''}
        <button class="btn sm ghost" data-act="invoiceModal" data-id="${i.id}" data-line="${l.id}">edit</button>
        <button class="btn sm ghost danger" data-act="delInvoice" data-id="${i.id}">✕</button></div>`).join('');
    return `<tr data-anchor="poline:${l.id}" class="${l.archived?'arch':''}" data-drop="poLines:${l.id}">
      <td style="width:20px;padding-right:0"><span class="dragh" draggable="true" data-drag="poLines:${l.id}" title="Drag to reorder">⠿</span></td>
      <td><input data-bind="poLines.${l.id}.lineNo" value="${esc(l.lineNo)}" style="min-width:44px;width:60px"></td>
      <td><textarea rows="1" data-bind="poLines.${l.id}.description" placeholder="Description">${esc(l.description||'')}</textarea></td>
      <td><input data-bind="poLines.${l.id}.wbs" value="${esc(l.wbs||'')}" placeholder="WBS" style="width:100px"></td>
      <td><input data-bind="poLines.${l.id}.spendCode" value="${esc(l.spendCode||'')}" placeholder="Spend" style="width:80px"></td>
      <td><input data-bind="poLines.${l.id}.glCode" value="${esc(l.glCode||'')}" placeholder="GL" style="width:80px"></td>
      <td><input class="num" data-bind="poLines.${l.id}.value" data-type="num" value="${l.value?fmt(l.value):''}" style="width:100px"></td>
      <td class="num nowrap small">${money(lineInvoiced(l.id))}</td>
      <td class="nowrap"><button class="btn sm ghost" data-act="invoiceModal" data-line="${l.id}" title="Add invoice">+ inv</button>
        <button class="btn sm ghost" data-act="copyLine" data-id="${l.id}" title="Copy this line's values">⧉</button>
        ${LINE_CLIP?`<button class="btn sm ghost" data-act="pasteLine" data-id="${l.id}" title="Paste copied line values here">📋</button>`:''}
        <button class="btn sm ghost" data-act="archLine" data-id="${l.id}" title="${l.archived?'Unarchive':'Archive'} line">${l.archived?'↩':'🗄'}</button>
        <button class="btn sm ghost danger" data-act="delLine" data-id="${l.id}">✕</button></td></tr>
      ${invs.length?`<tr><td></td><td></td><td colspan="7"><div class="inv-rows">${invHTML}</div></td></tr>`:''}`;
  }).join('');
  const pSum=poLinesSum(p.id);
  const folded=!!S.ui.poCollapsed[p.id];
  return `<div class="po-block ${p.archived?'card arch':''}" data-anchor="po:${p.id}" data-drop="pos:${p.id}">
    <div class="po-h"><span class="dragh" draggable="true" data-drag="pos:${p.id}" title="Drag to reorder">⠿</span>
      <span class="fc-caret" data-act="tglPO" data-id="${p.id}" title="${folded?'Expand':'Collapse'} PO">${folded?'▶':'▼'}</span>
      <b>PO ${esc(p.poNumber||'?')}</b>${p.archived?'<span class="badge">archived</span>':''}
      ${showSupplier?`<input data-bind="pos.${p.id}.supplier" value="${esc(p.supplier||'')}" placeholder="Supplier" style="width:130px;border-color:transparent;background:transparent">
      <input data-bind="pos.${p.id}.where" value="${esc(p.where||'')}" placeholder="${esc(whereLabel())}" style="width:110px;border-color:transparent;background:transparent">`:''}
      <input data-bind="pos.${p.id}.description" value="${esc(p.description||'')}" placeholder="Description" style="flex:1;border-color:transparent;background:transparent">
      <span class="muted small nowrap">${lines.length} line${lines.length===1?'':'s'} · ${money(pSum)}</span>
      <button class="btn sm ghost" data-act="addLine" data-po="${p.id}">+ line</button>
      <button class="btn sm ghost" data-act="archPO" data-id="${p.id}" title="${p.archived?'Unarchive':'Archive'} PO">${p.archived?'↩':'🗄'}</button>
      <button class="btn sm ghost danger" data-act="delPO" data-id="${p.id}" title="Delete PO">✕</button></div>
    ${lines.length&&!folded?`<div class="po-b"><div class="tblwrap" style="box-shadow:none"><table class="tbl">
      <thead><tr><th></th><th>Line</th><th>Description</th><th>WBS</th><th>Spend code</th><th>GL code</th><th class="num">Value</th><th class="num">Invoiced</th><th></th></tr></thead>
      <tbody>${lrows}</tbody></table></div></div>`:''}</div>`;
}
ACTIONS.tglPO=t=>{ S.ui.poCollapsed[t.dataset.id]=!S.ui.poCollapsed[t.dataset.id]; save(); render(); };
ACTIONS.tglContract=t=>{ S.ui.structCollapsed[t.dataset.id]=!S.ui.structCollapsed[t.dataset.id]; save(); render(); };
function contractCardHTML(c,mode){
  const cSum=contractLinesSum(c.id), cv=contractCurrent(c), diff=cv-cSum, vars=contractVarsSum(c);
  const badge= !S.pos.some(p=>p.contractId===c.id)?'' :
    Math.abs(diff)<0.005?`<span class="badge ok" title="PO lines add up to the current contract value">✓ lines reconcile</span>`
    :`<span class="badge ${diff>0?'warn':'bad'}" title="Current contract value ${money(cv)} vs PO lines ${money(cSum)}">${diff>0?'△ '+money(diff)+' unallocated':'△ lines exceed contract by '+money(-diff)}</span>`;
  const folded=!!S.ui.structCollapsed[c.id];
  const poCount=posOfContract(c.id).length, lnCount=posOfContract(c.id).reduce((s,p)=>s+linesOfPO(p.id).length,0);
  const pos=folded?'':posOfContract(c.id).filter(p=>structVisible(p.archived,mode)).map(p=>poBlockHTML(p,false)).join('');
  return `<div class="card contract-card ${c.archived?'arch':''}" data-anchor="contract:${c.id}" data-drop="contracts:${c.id}">
    <div class="card-h"><span class="dragh" draggable="true" data-drag="contracts:${c.id}" title="Drag to reorder">⠿</span>
      <span class="fc-caret" data-act="tglContract" data-id="${c.id}" title="${folded?'Expand':'Collapse'} contract">${folded?'▶':'▼'}</span>
      <span class="title">${esc(c.supplier||'Supplier')}</span>${c.what?`<span class="title" style="color:var(--accent)">— ${esc(c.what)}</span>`:''}${c.archived?'<span class="badge">archived</span>':''}
      ${folded?`<span class="muted small">${poCount} PO${poCount===1?'':'s'} · ${lnCount} line${lnCount===1?'':'s'}</span>`:''}
      <span class="muted small">supplier # ${esc(c.supplierNumber||'—')} · contract <b>${esc(c.contractNumber||'—')}</b></span>
      ${badge}<span class="sp" style="flex:1"></span>
      <span class="nowrap" title="Original ${money(c.totalValue)}${vars?' + variations '+money(vars):''}"><b>${money(cv)}</b>${vars?` <a href="#" class="small" data-act="cvariations" data-id="${c.id}">incl. ${money(vars)} var</a>`:` <a href="#" class="small muted" data-act="cvariations" data-id="${c.id}">+ variation</a>`}${c.endDate?` <span class="muted small">ends ${dstr(c.endDate)}</span>`:''}</span>
      ${backlinksTo('contract:'+c.id).length?`<button class="btn sm ghost" data-act="showBacklinks" data-ref="contract:${c.id}">↩${backlinksTo('contract:'+c.id).length}</button>`:''}
      <button class="btn sm" data-act="poModal" data-contract="${c.id}">+ PO</button>
      <button class="btn sm ghost" data-act="contractModal" data-id="${c.id}">edit</button>
      <button class="btn sm ghost" data-act="archContract" data-id="${c.id}" title="${c.archived?'Unarchive':'Archive'} contract">${c.archived?'↩':'🗄'}</button>
      <button class="btn sm ghost danger" data-act="delContract" data-id="${c.id}">✕</button></div>
    ${folded?'':`<div class="card-b">${pos||'<div class="muted small">No purchase orders yet — add one to start entering PO lines.</div>'}</div>`}</div>`;
}
ACTIONS.saveStructView=()=>{ const name=prompt('Name this view (saves the current filter + template)'); if(!name) return;
  S.structViews.push({id:uid(),name:name.trim(),filter:S.ui.structFilter||'',mode:structModeOf(S.ui.structView||'active')});
  S.ui.structView=S.structViews[S.structViews.length-1].id; save(); render(); toast('View saved'); };
ACTIONS.delStructView=t=>{ S.structViews=S.structViews.filter(v=>v.id!==t.dataset.id); S.ui.structView='active'; save(); render(); };
ACTIONS.archContract=t=>{ const c=contractOf(t.dataset.id); if(c){ c.archived=!c.archived; save(); render(); toast(c.archived?'Contract archived':'Contract restored'); } };
ACTIONS.archPO=t=>{ const p=poOf(t.dataset.id); if(p){ p.archived=!p.archived; save(); render(); toast(p.archived?'PO archived':'PO restored'); } };
ACTIONS.archLine=t=>{ const l=lineOf(t.dataset.id); if(l){ l.archived=!l.archived; save(); render(); toast(l.archived?'PO line archived':'PO line restored'); } };
ACTIONS.contractModal=t=>{ const c=t&&t.dataset.id?contractOf(t.dataset.id):null;
  modal(`<div class="m-h"><h3>${c?'Edit contract':'New contract'}</h3></div><div class="m-b">
    <form data-form="saveContract" id="cform">${c?`<input type="hidden" name="id" value="${c.id}">`:''}
    <div class="grid2">
      <label class="f"><span>Supplier name</span><input name="supplier" value="${esc(c?c.supplier:'')}" required></label>
      <label class="f"><span>Supplier number</span><input name="supplierNumber" value="${esc(c?c.supplierNumber:'')}"></label>
      <label class="f"><span>Contract number</span><input name="contractNumber" value="${esc(c?c.contractNumber:'')}"></label>
      <label class="f"><span>Total value (original)</span><input name="totalValue" value="${c&&c.totalValue?fmt(c.totalValue):''}" placeholder="0"></label>
      <label class="f"><span>For what (shows on Overview)</span><input name="what" value="${esc(c?c.what||'':'')}"></label>
      <label class="f"><span>${esc(whereLabel())}</span><input name="where" value="${esc(c?c.where||'':'')}"></label>
      <label class="f"><span>Start date</span><input type="date" name="startDate" value="${esc(c?c.startDate||'':'')}"></label>
      <label class="f"><span>Current end date</span><input type="date" name="endDate" value="${esc(c?c.endDate||'':'')}"></label>
    </div>
    <label class="f"><span>Notes</span><textarea name="notes" rows="2">${esc(c?c.notes||'':'')}</textarea></label></form>
  </div><div class="m-f"><button class="btn" data-act="closeModal">Cancel</button>
  <button class="btn primary" type="submit" form="cform">${c?'Save':'Add contract'}</button></div>`);
};
FORMS.saveContract=f=>{ const id=f.id&&f.id.value;
  const data={supplier:f.supplier.value.trim(),supplierNumber:f.supplierNumber.value.trim(),contractNumber:f.contractNumber.value.trim(),
    what:f.what.value.trim(),where:f.where.value.trim(),
    totalValue:parseNum(f.totalValue.value),startDate:f.startDate.value,endDate:f.endDate.value,notes:f.notes.value};
  if(id){ Object.assign(contractOf(id),data); } else S.contracts.push({id:uid(),variations:[],archived:false,...data});
  save(); closeModal(); render();
};
ACTIONS.delContract=t=>{ const id=t.dataset.id; const nPos=posOfContract(id).length;
  if(!confirm('Delete this contract'+(nPos?' and its '+nPos+' PO(s), lines and invoices':'')+'?')) return;
  const poIds=posOfContract(id).map(p=>p.id); const lineIds=S.poLines.filter(l=>poIds.includes(l.poId)).map(l=>l.id);
  S.invoices=S.invoices.filter(i=>!lineIds.includes(i.poLineId));
  S.poLines=S.poLines.filter(l=>!poIds.includes(l.poId));
  S.pos=S.pos.filter(p=>p.contractId!==id);
  S.contracts=S.contracts.filter(c=>c.id!==id);
  S.budget.forEach(b=>{ if(b.contractId===id){ b.contractId='';b.poId='';b.poLineId=''; } });
  S.fcLines=S.fcLines.filter(f=>f.parentRef!=='contract:'+id);
  save(); render();
};
ACTIONS.poModal=t=>{ const cid=(t&&t.dataset.contract)||'';
  modal(`<div class="m-h"><h3>New purchase order</h3></div><div class="m-b">
    <form data-form="savePO" id="poform">
    <label class="f"><span>PO number</span><input name="poNumber" required></label>
    <label class="f"><span>Contract</span><select name="contractId" onchange="document.getElementById('po-supplier-f').style.display=this.value?'none':'block'">
      <option value="">— none (standalone PO) —</option>
      ${S.contracts.filter(c=>!c.archived||c.id===cid).map(c=>`<option value="${c.id}" ${cid===c.id?'selected':''}>${esc((c.contractNumber||'no #')+' · '+c.supplier)}</option>`).join('')}
    </select></label>
    <label class="f" id="po-supplier-f" style="display:${cid?'none':'block'}"><span>Supplier (for standalone POs)</span><input name="supplier"></label>
    <label class="f"><span>Description</span><input name="description"></label></form>
  </div><div class="m-f"><button class="btn" data-act="closeModal">Cancel</button>
  <button class="btn primary" type="submit" form="poform">Add PO</button></div>`);
  setTimeout(()=>{const i=$('#poform input[name=poNumber]'); if(i) i.focus();},50);
};
FORMS.savePO=f=>{ const cid=f.contractId.value;
  S.pos.push({id:uid(),contractId:cid,supplier:cid?'':f.supplier.value.trim(),poNumber:f.poNumber.value.trim(),description:f.description.value.trim(),archived:false});
  save(); closeModal(); render(); };
ACTIONS.delPO=t=>{ const id=t.dataset.id; if(!confirm('Delete this PO, its lines and invoices?')) return;
  const lineIds=linesOfPO(id).map(l=>l.id);
  S.invoices=S.invoices.filter(i=>!lineIds.includes(i.poLineId));
  S.poLines=S.poLines.filter(l=>l.poId!==id);
  S.pos=S.pos.filter(p=>p.id!==id);
  S.budget.forEach(b=>{ if(b.poId===id){ b.poId='';b.poLineId=''; } });

/* ----- forecast & phasing (July–June financial year) ----- */
function fyQuarter(y,m){ // FY runs Jul–Jun: Q1 FY27 = Jul–Sep 2026
  const q=m>=7?Math.floor((m-7)/3)+1:Math.floor((m-1)/3)+3;
  const fy=(m>=7?y+1:y)%100;
  return {q,fy,months:['Jul–Sep','Oct–Dec','Jan–Mar','Apr–Jun'][q-1]};
}
function fyOptions(){ // financial years around the config start; FY starts in July
  const [sy,sm]=(S.fcCfg.start||currentMonthKey()).split('-').map(Number);
  const baseJulYear=sm>=7?sy:sy-1; const out=[];
  for(let d=-1;d<=3;d++){ const jy=baseJulYear+d; const fy=(jy+1)%100;
    out.push({start:jy+'-07',label:`FY${String(fy).padStart(2,'0')} (Jul ${String(jy).slice(2)}–Jun ${String(jy+1).slice(2)})`}); }
  return out;
}
function periodList(){ const cfg=S.fcCfg; const out=[];
  let [y,m]=cfg.start.split('-').map(Number);
  const step=cfg.gran==='quarter'?3:1;
  if(cfg.gran==='quarter') m=m-((m-1)%3); // snap to quarter start (Jul/Oct/Jan/Apr)
  for(let i=0;i<cfg.count;i++){
    const from=new Date(y,m-1,1), to=new Date(y,m-1+step,0);
    const key=cfg.gran==='quarter'?`${y}-Q${Math.floor((m-1)/3)+1}`:`${y}-${String(m).padStart(2,'0')}`;
    let label,sub;
    if(cfg.gran==='quarter'){ const fq=fyQuarter(y,m); label=`Q${fq.q} FY${fq.fy}`; sub=fq.months+' '+String(y).slice(2); }
    else { label=from.toLocaleDateString('en-NZ',{month:'short',year:'2-digit'}); sub=''; }
    out.push({key,label,sub,from,to});
    m+=step; while(m>12){m-=12;y++;}
  }
  return out;
}
const dateInPeriod=(ds,p)=>{ if(!ds) return false; const d=new Date(ds+'T00:00'); return d>=p.from&&d<=p.to; };
const actualsInPeriod=(lineIds,p)=>S.invoices.filter(i=>lineIds.includes(i.poLineId)&&dateInPeriod(i.date,p)).reduce((s,i)=>s+parseNum(i.value),0);
const fcEntry=(ref,key)=>S.forecast[ref+'|'+key];
function fcOwn(ref,current,actuals,key){ const f=fcEntry(ref,key); if(!f) return 0;
  return f.mode==='pct'? (current-actuals)*f.v/100 : f.v; }
function fcLineChild(f){ // a user-added forecast line: pick PO + line, name it with a 'for'
  const l=lineOf(f.poLineId), p=poOf(f.poId);
  const current=l?parseNum(l.value):0, actuals=l?lineInvoiced(l.id):0;
  return {ref:'fcline:'+f.id,f,label:f.forWhat||'(forecast line)',
    sub:(p?'PO '+(p.poNumber||'?'):'no PO')+(l?' / '+(l.lineNo||'?'):''),
    current,actuals,lineIds:l?[l.id]:[]};
}
const fcChildren=parentRef=>S.fcLines.filter(f=>f.parentRef===parentRef&&(S.ui.fcArch==='show'||!f.archived)).map(fcLineChild);
function fcTopRows(){ // contracts + standalone POs, each with user-defined forecast lines beneath
  const rows=[];
  S.contracts.filter(c=>!c.archived).forEach(c=>{
    rows.push({ref:'contract:'+c.id,label:(c.supplier||'Contract')+(c.contractNumber?' · '+c.contractNumber:''),sub:'Contract',
      current:contractCurrent(c),actuals:contractActuals(c.id),
      lineIds:posOfContract(c.id).flatMap(p=>linesOfPO(p.id).map(l=>l.id)),children:fcChildren('contract:'+c.id)});
  });
  standalonePOs().filter(p=>!p.archived).forEach(p=>{
    rows.push({ref:'po:'+p.id,label:'PO '+(p.poNumber||'?')+(p.supplier?' · '+p.supplier:''),sub:'Standalone PO',
      current:poLinesSum(p.id),actuals:poActuals(p.id),lineIds:linesOfPO(p.id).map(l=>l.id),children:fcChildren('po:'+p.id)});
  });
  S.budget.filter(b=>!b.archived&&!b.contractId&&!b.poId&&!b.poLineId).forEach(b=>{
    const d=rowCalc(b);
    rows.push({ref:'budget:'+b.id,label:b.what||'(budget line)',sub:b.where||'Manual budget',current:d.current,actuals:0,lineIds:[],children:[]});
  });
  const q=(S.ui.fcFilter||'').toLowerCase();
  return q?rows.filter(r=>(r.label+' '+r.sub).toLowerCase().includes(q)):rows;
}
function fcRollup(row,key){ // contract/PO rows = pure sum of their forecast lines; manual budget rows keep their own entry
  const kids=(row.children||[]).reduce((s,ch)=>s+fcOwn(ch.ref,ch.current,ch.actuals,key),0);
  if(row.ref.startsWith('contract:')||row.ref.startsWith('po:')) return kids;
  return fcOwn(row.ref,row.current,row.actuals,key)+kids;
}
function fcCellHTML(ref,current,actuals,p,extra){
  extra=extra||{};
  if(extra.readonly){ // parent contract/PO row: not editable, just the summed forecast of the lines below
    const parts=[]; if(extra.act) parts.push('act '+fmt(extra.act));
    return `<td class="fc-cell fc-ro num nowrap" title="Sum of the forecast lines below (edit those, not this)">${extra.roll?fmt(extra.roll):'·'}<span class="sub">${parts.join(' ')}</span></td>`;
  }
  const f=fcEntry(ref,p.key);
  const shown=f?(f.mode==='pct'?f.v+'%':fmt(f.v)):'';
  const own=fcOwn(ref,current,actuals,p.key);
  const parts=[];
  if(f&&f.mode==='pct') parts.push('≈'+fmt(own));
  if(extra.act) parts.push('act '+fmt(extra.act));
  return `<td class="fc-cell"><input data-fc="${ref}|${p.key}" class="${f&&f.mode==='pct'?'pct':''}" value="${esc(shown)}" placeholder="·" title="Enter a value, or a % of remaining (e.g. 25%).">
    <span class="sub">${parts.join(' · ')||''}</span></td>`;
}

    <input type="month" data-bind="fcCfg.start" value="${esc(cfg.start)}" title="First period">

    <input data-bind="ui.fcFilter" value="${esc(S.ui.fcFilter||'')}" placeholder="Filter…" style="width:140px">
    <label class="small nowrap" title="Show archived forecast lines"><input type="checkbox" id="fcArchChk" ${S.ui.fcArch==='show'?'checked':''}> show archived</label>`;
  const fca=$('#fcArchChk'); if(fca) fca.onchange=e=>{ S.ui.fcArch=e.target.checked?'show':'active'; save(); render(); };

        <label class="small muted" style="display:inline-flex;align-items:center;gap:2px">start <input type="date" data-bind="fcLines.${f.id}.startDate" value="${esc(f.startDate||'')}" style="width:130px"></label>

  const rowHTML=row=>{

    const expandable=row.ref.startsWith('contract:')||row.ref.startsWith('po:');
    const cells=ps.map(p=>fcCellHTML(row.ref,row.current,row.actuals,p,

    const fcTot=ps.reduce((s,p)=>s+fcRollup(row,p.key),0);

    return `<tr data-anchor="${row.ref}">

        <b>${esc(row.label)}</b>${row.sub?`<br><span class="muted small" style="margin-left:${expandable?'22px':'0'}">${esc(row.sub)}${(row.children||[]).length?' · '+row.children.length+' forecast line'+(row.children.length===1?'':'s'):''}</span>`:''}</td>
      <td class="num nowrap">${money(row.current)}</td><td class="num nowrap">${money(row.actuals)}</td>

      <td class="num nowrap">${Math.abs(variance)<.005?'<span class="badge ok">0</span>':`<span class="badge ${variance>0?'warn':'bad'}" title="${variance>0?'Unphased budget':'Phased above remaining budget'}">${money(variance)}</span>`}</td>
