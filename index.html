function handleForecastCell(el){ const [ref,key]=el.dataset.fc.split('|'); const raw=el.value.trim();
  if(!raw){ delete S.forecast[ref+'|'+key]; }
  else if(raw.endsWith('%')){ S.forecast[ref+'|'+key]={mode:'pct',v:parseNum(raw)}; }
  else{ S.forecast[ref+'|'+key]={mode:'val',v:parseNum(raw)}; }
  save(); renderKeepFocus();
}
ACTIONS.fcToggle=t=>{ const ref=t.dataset.ref; S.ui.fcOpen[ref]=!S.ui.fcOpen[ref]; save(); render(); };
ACTIONS.addFcLine=t=>{ const parentRef=t.dataset.parent;
  S.fcLines.push({id:uid(),parentRef,poId:'',poLineId:'',forWhat:'',statusId:'',startDate:'',endDate:'',archived:false});
  S.ui.fcOpen[parentRef]=true; save(); render(); };
ACTIONS.archFcLine=t=>{ const f=byId(S.fcLines,t.dataset.id); if(f){ f.archived=!f.archived; save(); render(); toast(f.archived?'Forecast line archived':'Forecast line restored'); } };
ACTIONS.delFcLine=t=>{ const id=t.dataset.id;
  const hasEntries=Object.keys(S.forecast).some(k=>k.startsWith('fcline:'+id+'|'));
  if(hasEntries&&!confirm('Delete this forecast line and its phased values?')) return;
  Object.keys(S.forecast).forEach(k=>{ if(k.startsWith('fcline:'+id+'|')) delete S.forecast[k]; });
  S.fcLines=S.fcLines.filter(f=>f.id!==id); save(); render(); };
ACTIONS.fcSeedLines=t=>{ const parentRef=t.dataset.parent;
  const pos=parentRef.startsWith('contract:')?posOfContract(parentRef.slice(9)):S.pos.filter(p=>'po:'+p.id===parentRef);
  let n=0;
  pos.filter(p=>!p.archived).forEach(p=>linesOfPO(p.id).filter(l=>!l.archived).forEach(l=>{
    if(!S.fcLines.some(f=>f.parentRef===parentRef&&f.poLineId===l.id)){
      S.fcLines.push({id:uid(),parentRef,poId:p.id,poLineId:l.id,forWhat:l.description||''}); n++; }
  }));
  if(!n) return toast('Every PO line already has a forecast line');
  S.ui.fcOpen[parentRef]=true; save(); render(); toast(n+' forecast line'+(n===1?'':'s')+' added');
};
ACTIONS.spreadRow=t=>{ const ref=t.dataset.ref; const ps=periodList();
  const find=(rows)=>{ for(const r of rows){ if(r.ref===ref) return {r,child:false}; const c=(r.children||[]).find(ch=>ch.ref===ref); if(c) return {r:c,child:true}; } return null; };
  const hit=find(fcTopRows()); if(!hit) return;
  const row=hit.r;
  const empty=ps.filter(p=>!fcEntry(ref,p.key));
  if(!empty.length) return toast('No empty periods to spread into');
  const already=hit.child?ps.reduce((s,p)=>s+fcOwn(ref,row.current,row.actuals,p.key),0):ps.reduce((s,p)=>s+fcRollup(row,p.key),0);
  const per=(row.current-row.actuals-already)/empty.length;
  if(per<=0) return toast('Nothing left to spread');
  empty.forEach(p=>{ S.forecast[ref+'|'+p.key]={mode:'val',v:Math.round(per*100)/100}; });
  save(); render();
};
ACTIONS.saveFcView=()=>{ const name=prompt('Name this forecast view (saves periods + filter)'); if(!name) return;
  const v={id:uid(),name:name.trim(),gran:S.fcCfg.gran,start:S.fcCfg.start,count:S.fcCfg.count,filter:S.ui.fcFilter||''};
  S.fcViews.push(v); S.ui.fcView=v.id; save(); render(); toast('Forecast view saved'); };
ACTIONS.delFcView=t=>{ S.fcViews=S.fcViews.filter(v=>v.id!==t.dataset.id); S.ui.fcView=''; save(); render(); };

/* ================= CALENDAR ================= */
function calDate(){ return new Date((S.ui.calDate||todayStr())+'T00:00'); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function eventsOn(ds){ return S.events.filter(e=>{ if(e.endDate) return ds>=e.date&&ds<=e.endDate; return e.date===ds; })
  .filter(e=>!S.ui.tagFilter||!S.ui.tagFilter.length||(e.tagIds||[]).some(t=>S.ui.tagFilter.includes(t))||!(e.tagIds||[]).length); }
function tasksDue(ds){ const out=[]; walkTasks(t=>{ if(t.due===ds&&!stateOf(t.stateId).done) out.push(t); }); return out; }
function tasksCompleted(ds){ const out=[]; walkTasks(t=>{ if(t.completed===ds&&stateOf(t.stateId).done) out.push(t); }); return out; }
function taskDonePill(t){ return `<div class="ev task done" data-goto="task:${t.id}" title="Completed: ${esc(t.name)}"><span>✓</span><span class="t">${esc(t.name)}</span></div>`; }

function renderCalendar(v){
  const mode=S.ui.calMode||'month', d=calDate();
  const monthName=d.toLocaleDateString('en-NZ',{month:'long',year:'numeric'});
  const weekStart=new Date(d); weekStart.setDate(d.getDate()-((d.getDay()+6)%7)); // Monday
  const title= mode==='month'?monthName : mode==='week'? 'Week of '+weekStart.toLocaleDateString('en-NZ',{day:'numeric',month:'long',year:'numeric'}) : d.toLocaleDateString('en-NZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const tagChips=S.settings.eventTags.map(t=>{ const on=!S.ui.tagFilter||!S.ui.tagFilter.length||S.ui.tagFilter.includes(t.id);
    return `<span class="pill" data-act="toggleTagFilter" data-id="${t.id}" style="background:${on?t.color:'transparent'};color:${on?'#fff':t.color};border-color:${t.color}">${esc(t.name)}</span>`; }).join(' ');
  v.innerHTML=`<div class="toolbar">
    <button class="btn icon" data-act="calNav" data-dir="-1">‹</button>
    <button class="btn icon" data-act="calNav" data-dir="1">›</button>
    <button class="btn sm" data-act="calToday">Today</button>
    <h2 style="margin:0 8px;font-size:20px">${esc(title)}</h2>
    <div class="sp"></div>
    ${tagChips}
    <div class="subtabs" style="margin-left:8px">
      ${['month','week','day'].map(m=>`<button data-act="calMode" data-mode="${m}" class="${mode===m?'on':''}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}
    </div>
    <button class="btn sm primary" data-act="eventModal">+ Event</button></div>
    <div id="cal-body"></div>`;
  if(mode==='month') renderMonth(); else if(mode==='week') renderWeek(weekStart); else renderDay(d);
}
function evPill(e){ const tag=tagOf((e.tagIds||[])[0]); const col=tag?tag.color:'var(--ink-2)';
  return `<div class="ev" data-act="eventModal" data-id="${e.id}" title="${esc(e.title)}"><span class="dot" style="background:${col}"></span><span class="t">${e.time?'<b>'+esc(e.time)+'</b> ':''}${esc(e.title)}</span></div>`; }
function taskPill(t){ return `<div class="ev task" data-goto="task:${t.id}" title="Task due: ${esc(t.name)}"><span>☑</span><span class="t">${esc(t.name)}</span></div>`; }

function renderMonth(){
  const d=calDate(); const first=new Date(d.getFullYear(),d.getMonth(),1);
  const start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  let cells=''; const today=todayStr();
  for(let i=0;i<42;i++){ const day=new Date(start); day.setDate(start.getDate()+i); const ds=iso(day);
    const dim=day.getMonth()!==d.getMonth();
    const evs=eventsOn(ds).map(evPill).join(''), tks=tasksDue(ds).map(taskPill).join(''), done=tasksCompleted(ds).map(taskDonePill).join('');
    cells+=`<div class="cal-cell ${dim?'dim':''} ${ds===today?'today':''}">
      <span class="dnum" data-act="calGotoDay" data-date="${ds}" style="cursor:pointer" title="Open day view">${day.getDate()}</span>
      <button class="addbtn" data-act="eventModal" data-date="${ds}" title="Add event">+</button>${evs}${tks}${done}</div>`;
  }
  $('#cal-body').innerHTML=`<div class="cal-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>`;
}
function renderWeek(weekStart){
  let cells=''; const today=todayStr();
  for(let i=0;i<7;i++){ const day=new Date(weekStart); day.setDate(weekStart.getDate()+i); const ds=iso(day);
    const evs=eventsOn(ds).map(evPill).join(''), tks=tasksDue(ds).map(taskPill).join(''), done=tasksCompleted(ds).map(taskDonePill).join('');
    cells+=`<div class="cal-cell ${ds===today?'today':''}" style="min-height:340px">
      <span class="dnum" data-act="calGotoDay" data-date="${ds}" style="cursor:pointer">${day.getDate()}</span>
      <span class="muted small"> ${day.toLocaleDateString('en-NZ',{weekday:'short'})}</span>
      <button class="addbtn" data-act="eventModal" data-date="${ds}">+</button>${evs}${tks}${done}</div>`;
  }
  $('#cal-body').innerHTML=`<div class="cal-grid" style="grid-template-columns:repeat(7,1fr)">${cells}</div>`;
}
function renderDay(d){ const ds=iso(d);
  const evs=eventsOn(ds), tks=tasksDue(ds), done=tasksCompleted(ds);
  $('#cal-body').innerHTML=`<div class="card"><div class="card-b cal-list">
    ${evs.length?'<div class="day-h">Events</div>'+evs.map(e=>{
      const tags=(e.tagIds||[]).map(id=>{const t=tagOf(id);return t?`<span class="badge" style="background:${t.color}1a;color:${t.color}">${esc(t.name)}</span>`:'';}).join(' ');
      return `<div style="padding:8px 0;border-bottom:1px solid var(--line-2)" data-anchor="event:${e.id}">
        <div style="display:flex;gap:8px;align-items:center"><b style="cursor:pointer" data-act="eventModal" data-id="${e.id}">${e.time?esc(e.time)+' · ':''}${esc(e.title)}</b>${tags}
        ${e.organiser?`<span class="badge" title="Organiser">👤 ${esc(e.organiser)}</span>`:''}
        <span class="sp" style="flex:1"></span><button class="btn sm ghost" data-act="eventModal" data-id="${e.id}">edit</button></div>
        ${e.notes?`<div class="small" style="white-space:pre-wrap;margin-top:4px">${esc(e.notes)}</div>`:''}
        ${(e.links||[]).length?`<div style="margin-top:4px">${e.links.map(l=>chipHTML(l)).join(' ')}</div>`:''}</div>`;
    }).join(''):''}
    ${tks.length?'<div class="day-h">Tasks due</div>'+tks.map(t=>`<div style="padding:3px 0">${taskPill(t)}</div>`).join(''):''}
    ${done.length?'<div class="day-h">Actions completed</div>'+done.map(t=>`<div style="padding:3px 0">${taskDonePill(t)}</div>`).join(''):''}
    ${!evs.length&&!tks.length&&!done.length?'<div class="empty">Nothing on this day.<br><br><button class="btn primary" data-act="eventModal" data-date="'+ds+'">+ Add event</button></div>':''}
  </div></div>`;
}
ACTIONS.calNav=t=>{ const d=calDate(); const dir=Number(t.dataset.dir); const mode=S.ui.calMode;
  if(mode==='month') d.setMonth(d.getMonth()+dir); else if(mode==='week') d.setDate(d.getDate()+7*dir); else d.setDate(d.getDate()+dir);
  S.ui.calDate=iso(d); save(); render(); };
ACTIONS.calToday=()=>{ S.ui.calDate=todayStr(); save(); render(); };
ACTIONS.calMode=t=>{ S.ui.calMode=t.dataset.mode; save(); render(); };
ACTIONS.calGotoDay=t=>{ S.ui.calDate=t.dataset.date; S.ui.calMode='day'; save(); render(); };
ACTIONS.toggleTagFilter=t=>{ const id=t.dataset.id; let f=S.ui.tagFilter||[];
  if(!f.length) f=[id]; else if(f.includes(id)){ f=f.filter(x=>x!==id); } else f.push(id);
  if(f.length===S.settings.eventTags.length) f=[];
  S.ui.tagFilter=f; save(); render(); };

let evLinks=[]; // working set for the open event modal
function openEventModal(id,presetDate){ const e=id?byId(S.events,id):null;
  evLinks=e?[...(e.links||[])]:[];
  modal(`<div class="m-h"><h3>${e?'Edit event':'New event'}</h3></div><div class="m-b">
    <form data-form="saveEvent" id="evform">${e?`<input type="hidden" name="id" value="${e.id}">`:''}
    <label class="f"><span>Title</span><input name="title" value="${esc(e?e.title:'')}" required></label>
    <div class="grid2">
      <label class="f"><span>Date</span><input type="date" name="date" value="${esc(e?e.date:(presetDate||S.ui.calDate||todayStr()))}" required></label>
      <label class="f"><span>Time (optional)</span><input type="time" name="time" value="${esc(e?e.time||'':'')}"></label>
      <label class="f"><span>End date (multi-day, optional)</span><input type="date" name="endDate" value="${esc(e?e.endDate||'':'')}"></label>
      <label class="f"><span>Organiser</span><input name="organiser" value="${esc(e?e.organiser||'':'')}" placeholder="Who's running it"></label>
    </div>
    <span class="small muted">Tags</span>
    <div style="margin:4px 0 10px;display:flex;gap:10px;flex-wrap:wrap">
      ${S.settings.eventTags.map(t=>`<label class="small nowrap"><input type="checkbox" name="tag" value="${t.id}" ${e&&(e.tagIds||[]).includes(t.id)?'checked':''}> <span style="color:${t.color};font-weight:600">${esc(t.name)}</span></label>`).join('')}
    </div>
    <label class="f"><span>Notes / hui notes</span><textarea name="notes" rows="5">${esc(e?e.notes||'':'')}</textarea></label>
    <span class="small muted">Linked items</span>
    <div id="evlinks" style="margin:4px 0 6px;display:flex;gap:4px;flex-wrap:wrap"></div>
    <button class="btn sm" type="button" data-act="evAddLink">🔗 Add link</button>
    </form>
  </div><div class="m-f">
    ${e?`<button class="btn danger" data-act="delEvent" data-id="${e.id}" style="margin-right:auto">Delete</button>`:''}
    <button class="btn" data-act="closeModal">Cancel</button>
    <button class="btn primary" type="submit" form="evform">${e?'Save':'Add event'}</button></div>`);
  drawEvLinks();
  setTimeout(()=>{const i=$('#evform input[name=title]'); if(i&&!e)i.focus();},50);
}
function drawEvLinks(){ const el=$('#evlinks'); if(el) el.innerHTML=evLinks.map(l=>chipHTML(l,'ev')).join(' ')||'<span class="muted small">None</span>'; }
ACTIONS.eventModal=t=>openEventModal(t&&t.dataset.id,t&&t.dataset.date);
ACTIONS.evAddLink=()=>{ const keep=collectEventForm(); linkPicker(ref=>{ if(!evLinks.includes(ref)) evLinks.push(ref); openEventModal(keep.id,keep.date); restoreEventForm(keep); }); };
function collectEventForm(){ const f=$('#evform'); if(!f) return {};
  return {id:f.id?f.id.value:'',title:f.title.value,date:f.date.value,time:f.time.value,endDate:f.endDate.value,organiser:f.organiser.value,notes:f.notes.value,
    tags:[...f.querySelectorAll('input[name=tag]:checked')].map(i=>i.value)}; }
function restoreEventForm(k){ const f=$('#evform'); if(!f) return;
  f.title.value=k.title||''; f.date.value=k.date||todayStr(); f.time.value=k.time||''; f.endDate.value=k.endDate||''; f.organiser.value=k.organiser||''; f.notes.value=k.notes||'';
  f.querySelectorAll('input[name=tag]').forEach(i=>i.checked=(k.tags||[]).includes(i.value)); }
ACTIONS.unlink=t=>{ const ref=t.dataset.ref, ctx=t.dataset.ctx;
  if(ctx==='ev'){ evLinks=evLinks.filter(l=>l!==ref); drawEvLinks(); }
  else if(ctx&&ctx.startsWith('task:')){ const id=ctx.slice(5); walkTasks(x=>{ if(x.id===id) x.links=(x.links||[]).filter(l=>l!==ref); }); save(); render(); }
};
FORMS.saveEvent=f=>{ const id=f.id&&f.id.value;
  const data={title:f.title.value.trim(),date:f.date.value,time:f.time.value,endDate:f.endDate.value,organiser:f.organiser.value.trim(),notes:f.notes.value,
    tagIds:[...f.querySelectorAll('input[name=tag]:checked')].map(i=>i.value),links:evLinks};
  if(data.endDate&&data.endDate<data.date) data.endDate='';
  if(id) Object.assign(byId(S.events,id),data); else S.events.push({id:uid(),...data});
  save(); closeModal(); render();
};
ACTIONS.delEvent=t=>{ if(!confirm('Delete this event?')) return; S.events=S.events.filter(e=>e.id!==t.dataset.id); save(); closeModal(); render(); };

/* ================= ACTIONS (tasks) ================= */
function findTask(id,list,parent){ list=list||S.tasks;
  for(let i=0;i<list.length;i++){ const t=list[i];
    if(t.id===id) return {t,list,idx:i,parent:parent||null};
    if(t.children){ const r=findTask(id,t.children,t); if(r) return r; } }
  return null;
}
function newTask(){ return {id:uid(),name:'',type:'task',due:'',lastActioned:todayStr(),completed:'',stateId:S.settings.taskStates[0].id,priorityId:'',owner:'',tagIds:[],notes:'',links:[],collapsed:false,children:[],showNotes:false}; }
function newHeader(){ return {id:uid(),name:'',type:'header',children:[],collapsed:false}; }
function touch(t){ t.lastActioned=todayStr(); }
function weekBounds(){ const d=new Date(todayStr()+'T00:00'); const mon=new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7));
  const sun=new Date(mon); sun.setDate(mon.getDate()+6); return {from:iso(mon),to:iso(sun)}; }
const prioRank=id=>{ const i=(S.settings.taskPriorities||[]).findIndex(p=>p.id===id); return i<0?99:i; };

function renderTasks(v){
  const hide=S.ui.hideDone, week=S.ui.taskWeekOnly;
  const owners=[...new Set([]. concat(...collectTasks().map(t=>t.owner).filter(Boolean)))];
  v.innerHTML=`<div class="toolbar">
    <button class="btn sm primary" data-act="addTask">+ Task</button>
    <button class="btn sm" data-act="addHeader" title="Add a section header (e.g. a programme or workstream)">+ Header</button>
    <button class="btn sm ${week?'accent':''}" data-act="tglWeek" title="Show this week's priorities">★ This week</button>
    <div class="sp" style="flex:1"></div>
    <span class="small muted">${countOpenTasks()} open</span>
    <label class="small nowrap" style="margin-left:10px"><input type="checkbox" ${hide?'checked':''} data-act="none" id="hideDone"> hide completed</label>
  </div>
  ${week?renderWeekView():`<div class="card"><div class="card-b task-tree" id="ttree">${S.tasks.length?taskListHTML(S.tasks,hide,0):'<div class="empty">No tasks yet. Add one — Enter for the next, Tab to nest. Use + Header to group by programme or workstream.</div>'}</div></div>`}
  <div class="small muted" style="margin-top:8px">Enter = new task below · Tab / Shift-Tab = nest / un-nest · click the state pill to cycle, the flag to set priority · tasks appear on the calendar by due date and completion date.</div>`;
  $('#hideDone').onchange=e=>{ S.ui.hideDone=e.target.checked; save(); render(); };
}
function collectTasks(){ const out=[]; walkTasks(t=>{ if(t.type!=='header') out.push(t); }); return out; }
function countOpenTasks(){ let n=0; collectTasks().forEach(t=>{ if(!stateOf(t.stateId).done) n++; }); return n; }
function renderWeekView(){ const wb=weekBounds(); const today=todayStr();
  const rows=collectTasks().filter(t=>!stateOf(t.stateId).done && (t.priorityId||(t.due&&t.due<=wb.to)))
    .sort((a,b)=>prioRank(a.priorityId)-prioRank(b.priorityId)||(a.due||'9999').localeCompare(b.due||'9999'));
  if(!rows.length) return `<div class="card"><div class="empty">Nothing prioritised or due this week. Set a priority flag or a due date, then check back.</div></div>`;
  return `<div class="card"><div class="card-b">
    <div class="small muted" style="margin-bottom:6px">This week (${dstr(wb.from)} – ${dstr(wb.to)}) — open tasks with a priority or a due date, most urgent first.</div>
    ${rows.map(t=>{ const st=stateOf(t.stateId), pr=priorityOf(t.priorityId);
      const dueCls=t.due?(t.due<today?'due-over':(t.due<=wb.to?'due-soon':'')):'';
      return `<div class="task-row" data-anchor="task:${t.id}" style="cursor:pointer" data-goto="task:${t.id}">
        ${pr?`<span class="prio" style="background:${pr.color}">${esc(pr.name.split(' ')[0])}</span>`:'<span class="prio none">—</span>'}
        <span class="pill" style="background:${st.color}1c;color:${st.color};border-color:${st.color}55">${esc(st.name)}</span>
        <span style="flex:1">${esc(t.name||'(untitled)')}</span>
        ${(t.tagIds||[]).map(id=>{const tg=taskTagOf(id);return tg?`<span class="badge" style="background:${tg.color}1a;color:${tg.color}">${esc(tg.name)}</span>`:'';}).join(' ')}
        ${t.owner?`<span class="badge" title="Owner">👤 ${esc(t.owner)}</span>`:''}
        <span class="small ${dueCls}" style="width:110px;text-align:right">${t.due?dstr(t.due):''}</span></div>`;
    }).join('')}</div></div>`;
}
function taskListHTML(list,hide,depth){ return list.filter(t=>t.type==='header'||!hide||!stateOf(t.stateId).done||hasOpenDesc(t)).map(t=>taskHTML(t,hide,depth)).join(''); }
function hasOpenDesc(t){ let open=false; walkTasks(x=>{ if(x.type!=='header'&&!stateOf(x.stateId).done) open=true; },t.children||[]); return open; }
function taskHTML(t,hide,depth){
  const kids=(t.children||[]);
  const caret=`<span class="caret ${kids.length?'':'chidden'}" data-act="tglTask" data-id="${t.id}">${t.collapsed?'▶':'▼'}</span>`;
  const drag=`<span class="dragh" draggable="true" data-drag="tasks:${t.id}" title="Drag to reorder">⠿</span>`;
  const kidsHTML=kids.length&&!t.collapsed?`<div class="task-kids">${taskListHTML(kids,hide,depth+1)}</div>`:'';
  if(t.type==='header'){
    const fs=Math.max(13,16-depth); // sub-headers get progressively smaller
    return `<div data-tid="${t.id}" data-drop="tasks:${t.id}">
      <div class="task-row header-row" data-anchor="task:${t.id}">
        ${drag}${caret}
        <input class="theader" style="font-size:${fs}px" value="${esc(t.name)}" placeholder="${depth?'Sub-header…':'Section header…'}" data-tname="${t.id}">
        <span class="rowtools">
          <button class="btn sm ghost" data-act="addSub" data-id="${t.id}" title="Add task inside">＋ task</button>
          <button class="btn sm ghost" data-act="addSubHeader" data-id="${t.id}" title="Add sub-header inside">＋ header</button>
          <button class="btn sm ghost" data-act="outdentTask" data-id="${t.id}" title="Un-nest">⇤</button>
          <button class="btn sm ghost" data-act="indentTask" data-id="${t.id}" title="Nest">⇥</button>
          <button class="btn sm ghost danger" data-act="delTask" data-id="${t.id}" title="Delete">✕</button>
        </span></div>${kidsHTML}</div>`;
  }
  const st=stateOf(t.stateId); const today=todayStr(); const pr=priorityOf(t.priorityId);
  const dueCls=t.due&&!st.done?(t.due<today?'due-over':(t.due<=addDays(today,3)?'due-soon':'')):'';
  return `<div data-tid="${t.id}" data-drop="tasks:${t.id}">
    <div class="task-row ${st.done?'done':''}" data-anchor="task:${t.id}">
      ${drag}${caret}
      <span class="prio ${pr?'':'none'}" data-act="cyclePriority" data-id="${t.id}" title="${pr?esc(pr.name):'Set priority'}" ${pr?`style="background:${pr.color}"`:''}>${pr?esc(pr.name.split(' ')[0]):'⚑'}</span>
      <span class="pill" data-act="cycleState" data-id="${t.id}" style="background:${st.color}1c;color:${st.color};border-color:${st.color}55" title="Click to change state">${esc(st.name)}</span>
      <input class="tname" value="${esc(t.name)}" placeholder="Task…" data-tname="${t.id}">
      <span class="tlinks">${(t.tagIds||[]).map(id=>{const tg=taskTagOf(id);return tg?`<span class="chip" data-act="taskTagMenu" data-id="${t.id}" style="border-color:${tg.color};background:${tg.color}1a">${esc(tg.name)}</span>`:'';}).join('')}${(t.links||[]).map(l=>chipHTML(l,'task:'+t.id)).join('')}</span>
      ${(t.notes||t.showNotes)?`<span class="notebtn ${t.showNotes?'open':''}" data-act="taskNotes" data-id="${t.id}" title="Notes — click to ${t.showNotes?'hide':'view'}">🗒 ${t.showNotes?'▾':'▸'}</span>`:''}
      <span class="meta">
        <input class="towner" value="${esc(t.owner||'')}" placeholder="owner" data-towner="${t.id}" title="Owner / person" list="ownerlist">
        <span class="rowtools">
          <button class="btn sm ghost" data-act="taskTagMenu" data-id="${t.id}" title="Tags">🏷</button>
          <button class="btn sm ghost" data-act="taskLink" data-id="${t.id}" title="Link to contract / PO / event / budget…">🔗</button>
          <button class="btn sm ghost" data-act="taskNotes" data-id="${t.id}" title="Notes">🗒</button>
          <button class="btn sm ghost" data-act="addSub" data-id="${t.id}" title="Add sub-task">＋</button>
          <button class="btn sm ghost" data-act="outdentTask" data-id="${t.id}" title="Un-nest">⇤</button>
          <button class="btn sm ghost" data-act="indentTask" data-id="${t.id}" title="Nest under task above">⇥</button>
          <button class="btn sm ghost danger" data-act="delTask" data-id="${t.id}" title="Delete">✕</button>
        </span>
        <input type="date" class="${dueCls}" value="${esc(t.due||'')}" data-tdue="${t.id}" title="Due date">
        <span class="small muted nowrap" title="Last actioned">↻ ${t.lastActioned?dstr(t.lastActioned):'—'}</span>
      </span>
    </div>
    ${t.showNotes?`<div class="task-notes"><textarea data-tnotes="${t.id}" placeholder="Notes…">${esc(t.notes||'')}</textarea></div>`:''}
    ${kidsHTML}
  </div>`;
}
function addDays(ds,n){ const d=new Date(ds+'T00:00'); d.setDate(d.getDate()+n); return iso(d); }
function ownerDatalist(){ const owners=[...new Set(collectTasks().map(t=>t.owner).filter(Boolean))];
  let dl=$('#ownerlist'); if(!dl){ dl=document.createElement('datalist'); dl.id='ownerlist'; document.body.appendChild(dl); }
  dl.innerHTML=owners.map(o=>`<option value="${esc(o)}">`).join(''); }

ACTIONS.addTask=()=>{ const t=newTask(); S.tasks.push(t); save(); render(); focusTask(t.id); };
ACTIONS.addHeader=()=>{ const h=newHeader(); S.tasks.push(h); save(); render(); focusTask(h.id); };
ACTIONS.tglWeek=()=>{ S.ui.taskWeekOnly=!S.ui.taskWeekOnly; save(); render(); };
ACTIONS.addSub=el=>{ const r=findTask(el.dataset.id); if(!r) return; r.t.children=r.t.children||[]; const t=newTask(); r.t.children.push(t); r.t.collapsed=false; if(r.t.type!=='header') touch(r.t); save(); render(); focusTask(t.id); };
ACTIONS.addSubHeader=el=>{ const r=findTask(el.dataset.id); if(!r) return; r.t.children=r.t.children||[]; const h=newHeader(); r.t.children.push(h); r.t.collapsed=false; save(); render(); focusTask(h.id); };
ACTIONS.tglTask=el=>{ const r=findTask(el.dataset.id); if(r){ r.t.collapsed=!r.t.collapsed; save(); render(); } };
ACTIONS.cycleState=el=>{ const r=findTask(el.dataset.id); if(!r) return;
  const states=S.settings.taskStates; const i=states.findIndex(s=>s.id===r.t.stateId);
  r.t.stateId=states[(i+1)%states.length].id; touch(r.t);
  const ns=stateOf(r.t.stateId); // completion date shows on the calendar
  if(ns.done&&!r.t.completed) r.t.completed=todayStr();
  if(!ns.done) r.t.completed='';
  save(); render(); };
ACTIONS.cyclePriority=el=>{ const r=findTask(el.dataset.id); if(!r) return;
  const ps=S.settings.taskPriorities||[]; const order=['',...ps.map(p=>p.id)];
  const i=order.indexOf(r.t.priorityId||''); r.t.priorityId=order[(i+1)%order.length]; touch(r.t); save(); render(); };
ACTIONS.taskTagMenu=el=>{ const id=el.dataset.id; const r=findTask(id); if(!r) return; const t=r.t; t.tagIds=t.tagIds||[];
  modal(`<div class="m-h"><h3>Tags — ${esc(t.name||'task')}</h3></div><div class="m-b">
    <div style="display:flex;gap:8px;flex-wrap:wrap">${(S.settings.taskTags||[]).map(tg=>`<label class="chip" style="border-color:${tg.color};${t.tagIds.includes(tg.id)?`background:${tg.color}1a`:''}"><input type="checkbox" ${t.tagIds.includes(tg.id)?'checked':''} onchange="toggleTaskTag('${id}','${tg.id}',this.checked)" style="margin-right:4px">${esc(tg.name)}</label>`).join('')}</div>
    <div class="small muted" style="margin-top:10px">Manage the tag list in ⚙ Settings.</div>
  </div><div class="m-f"><button class="btn primary" data-act="closeModal">Done</button></div>`); };
window.toggleTaskTag=(id,tag,on)=>{ const r=findTask(id); if(!r) return; r.t.tagIds=r.t.tagIds||[];
  if(on){ if(!r.t.tagIds.includes(tag)) r.t.tagIds.push(tag); } else r.t.tagIds=r.t.tagIds.filter(x=>x!==tag);
  touch(r.t); save(); render(); };
ACTIONS.delTask=el=>{ const r=findTask(el.dataset.id); if(!r) return;
  const n=(r.t.children||[]).length; if((r.t.name||n)&&!confirm('Delete this '+(r.t.type==='header'?'header':'task')+(n?' and its '+n+' item(s)':'')+'?')) return;
  r.list.splice(r.idx,1); save(); render(); };
ACTIONS.indentTask=el=>{ const r=findTask(el.dataset.id); if(!r||r.idx===0) return toast('Nothing above to nest under');
  const prev=r.list[r.idx-1]; r.list.splice(r.idx,1); prev.children=prev.children||[]; prev.children.push(r.t); prev.collapsed=false; save(); render(); focusTask(r.t.id); };
ACTIONS.outdentTask=el=>{ const r=findTask(el.dataset.id); if(!r||!r.parent) return;
  const pr=findTask(r.parent.id); r.list.splice(r.idx,1); pr.list.splice(pr.idx+1,0,r.t); save(); render(); focusTask(r.t.id); };
ACTIONS.taskNotes=el=>{ const r=findTask(el.dataset.id); if(r){ r.t.showNotes=!r.t.showNotes; save(); render();
  if(r.t.showNotes) setTimeout(()=>{ const ta=document.querySelector(`[data-tnotes="${r.t.id}"]`); if(ta) ta.focus(); },40); } };
ACTIONS.taskLink=el=>{ const id=el.dataset.id;
  linkPicker(ref=>{ const r=findTask(id); if(r){ r.t.links=r.t.links||[]; if(!r.t.links.includes(ref)) r.t.links.push(ref); touch(r.t); save(); render(); } },'task:'+id); };
function focusTask(id){ setTimeout(()=>{ const i=document.querySelector(`[data-tname="${id}"]`); if(i){ i.focus(); } },40); ownerDatalist(); }

/* task field editing via delegation */
document.addEventListener('change',e=>{
  const n=e.target.closest('[data-tname]'); if(n){ const r=findTask(n.dataset.tname); if(r){ r.t.name=n.value; if(r.t.type!=='header')touch(r.t); save(); } return; }
  const d=e.target.closest('[data-tdue]'); if(d){ const r=findTask(d.dataset.tdue); if(r){ r.t.due=d.value; touch(r.t); save(); renderKeepFocus(); } return; }
  const o=e.target.closest('[data-towner]'); if(o){ const r=findTask(o.dataset.towner); if(r){ r.t.owner=o.value; touch(r.t); save(); ownerDatalist(); } return; }
  const x=e.target.closest('[data-tnotes]'); if(x){ const r=findTask(x.dataset.tnotes); if(r){ r.t.notes=x.value; touch(r.t); save(); } return; }
});
document.addEventListener('keydown',e=>{
  const n=e.target.closest&&e.target.closest('[data-tname]'); if(!n) return;
  const id=n.dataset.tname;
  if(e.key==='Enter'){ e.preventDefault(); const r=findTask(id); if(!r) return; r.t.name=n.value; if(r.t.type!=='header')touch(r.t);
    const t=newTask(); r.list.splice(r.idx+1,0,t); save(); render(); focusTask(t.id); }
  else if(e.key==='Tab'){ e.preventDefault(); const r=findTask(id); if(!r) return; r.t.name=n.value;
    if(e.shiftKey) ACTIONS.outdentTask({dataset:{id}}); else ACTIONS.indentTask({dataset:{id}}); }
});

/* ================= STATUS (block note editor) ================= */
function curPage(){ return byId(S.notes,S.ui.notePage)||S.notes[0]; }
function findBlock(id,list,parent){ list=list||curPage().blocks;
  for(let i=0;i<list.length;i++){ const b=list[i];
    if(b.id===id) return {b,list,idx:i,parent:parent||null};
    if(b.children){ const r=findBlock(id,b.children,b); if(r) return r; } }
  return null;
}
function newBlock(type){ const b={id:uid(),type:type||'p',html:''};
  if(type==='toggle'){ b.open=true; b.children=[{id:uid(),type:'p',html:''}]; }
  if(type==='table'){ b.rows=[['Column','Column'],['','']]; }
  return b;
}
const BLOCK_PH={p:'Type “/” for headings, bullets, toggles, tables, links… (this is a free notes area)',h1:'Heading 1',h2:'Heading 2',h3:'Heading 3',bullet:'List item',callout:'Callout',toggle:'Toggle heading'};

/* ---- note page templates ---- */
function tBlocks(spec){ return spec.map(s=>{ const b=newBlock(s[0]); if(s[0]==='table'){ b.rows=s[1]; } else b.html=s[1]||''; return b; }); }
const NOTE_TEMPLATES={
  blank:{name:'Blank page',icon:'📄',blocks:()=>[newBlock('h1'),newBlock('p')]},
  stakeholder:{name:'Stakeholder list',icon:'👥',blocks:()=>tBlocks([
    ['h1','Stakeholder list'],
    ['p','Who matters to this programme, what they care about, and how we engage them.'],
    ['table',[['Stakeholder','Organisation','Interest / stake','Influence','Engagement approach','Owner','Last contact'],['','','','','','',''],['','','','','','','']]],
  ])},
  marketing:{name:'Marketing plan',icon:'📣',blocks:()=>tBlocks([
    ['h1','Marketing plan'],
    ['h2','Objectives'],['bullet','Objective 1'],
    ['h2','Audiences'],['table',[['Audience','Key message','Channel','Timing'],['','','','']]],
    ['h2','Campaign calendar'],['table',[['Activity','Channel','Start','End','Owner','Status'],['','','','','','']]],
    ['h2','Budget'],['p','Link budget lines here with /link.'],
  ])},
  behaviour:{name:'Behaviour change approach',icon:'🔄',blocks:()=>tBlocks([
    ['h1','Behaviour change approach'],
    ['h2','Target behaviour'],['p','The specific behaviour we want to shift, and for whom.'],
    ['h2','Barriers & drivers'],['table',[['Barrier','Driver','Intervention'],['','','']]],
    ['h2','Interventions'],['bullet','Intervention 1'],
    ['h2','Measures of success'],['bullet','Measure 1'],
  ])},
  mne:{name:'M&E baseline',icon:'📊',blocks:()=>tBlocks([
    ['h1','Monitoring & evaluation baseline'],
    ['h2','Outcomes & indicators'],['table',[['Outcome','Indicator','Baseline','Target','Data source','Frequency'],['','','','','','']]],
    ['h2','Baseline notes'],['p','Baseline conditions at programme start.'],
    ['h2','Evaluation questions'],['bullet','Question 1'],
  ])},
  links:{name:'Links database',icon:'🔗',kind:'links',blocks:()=>[]},
};

function blockHTML(b){
  const handle=`<span class="handle" data-act="blockMenu" data-id="${b.id}" title="Block options">⋮⋮</span>`;
  if(b.type==='divider') return `<div class="blk t-divider" data-blk="${b.id}">${handle}</div>`;
  if(b.type==='table'){
    const rows=(b.rows||[]).map((r,ri)=>`<tr>${r.map((c,ci)=>`<td contenteditable="true" data-tcell="${b.id}" data-r="${ri}" data-c="${ci}">${c}</td>`).join('')}</tr>`).join('');
    return `<div class="blk t-table" data-blk="${b.id}">${handle}<table class="ntbl"><tbody>${rows}</tbody></table>
      <div class="tbl-tools"><button class="btn sm ghost" data-act="tblRow" data-id="${b.id}">+ row</button>
      <button class="btn sm ghost" data-act="tblCol" data-id="${b.id}">+ column</button>
      <button class="btn sm ghost" data-act="tblDelRow" data-id="${b.id}">− row</button>
      <button class="btn sm ghost" data-act="tblDelCol" data-id="${b.id}">− column</button></div></div>`;
  }
  if(b.type==='toggle'){
    return `<div class="blk t-toggle" data-blk="${b.id}">${handle}
      <div class="tg-head"><span class="tgc" data-act="tglBlock" data-id="${b.id}">${b.open?'▼':'▶'}</span>
      <div class="bc" contenteditable="true" data-bid="${b.id}" data-ph="Toggle heading">${b.html}</div></div>
      ${b.open?`<div class="tg-kids">${(b.children||[]).map(blockHTML).join('')}
        <div class="small muted" style="padding:2px 6px;cursor:pointer" data-act="addChildBlock" data-id="${b.id}">+ add inside</div></div>`:''}</div>`;
  }
  return `<div class="blk t-${b.type}" data-blk="${b.id}">${handle}<div class="bc" contenteditable="true" data-bid="${b.id}" data-ph="${BLOCK_PH[b.type]||''}">${b.html}</div></div>`;
}
function renderStatus(v){
  const pg=curPage();
  const rail=`<div class="note-rail">
    ${S.notes.map(p=>`<button class="note-tab ${p.id===pg.id?'on':''}" data-act="notePage" data-id="${p.id}"><span>${p.icon||'📄'}</span> ${esc(p.name)}</button>`).join('')}
    <button class="note-tab add" data-act="newNotePage" title="New page">＋ Page</button></div>`;
  let doc;
  if(pg.kind==='links'){ doc=linksDBHTML(); }
  else{ doc=`<div class="doc" id="doc">
    <div class="page-head"><span class="pico" data-act="renamePage" title="Rename / change icon">${pg.icon||'📄'}</span>
      <input class="ptitle" value="${esc(pg.name)}" data-pgname="${pg.id}" placeholder="Untitled">
      <span class="sp" style="flex:1"></span>
      <button class="btn sm ghost danger" data-act="delNotePage" data-id="${pg.id}" title="Delete page">Delete page</button></div>
    ${(pg.blocks||[]).map(blockHTML).join('')}
    <div class="blk"><div class="bc muted small" data-act="addBlockEnd" style="cursor:text;padding-top:10px">+ Click to add a block — press “/” for headings, toggles, tables and links</div></div></div>`; }
  v.innerHTML=rail+doc;
}
ACTIONS.notePage=t=>{ S.ui.notePage=t.dataset.id; save(); render(); };
ACTIONS.newNotePage=()=>{
  modal(`<div class="m-h"><h3>New notes page</h3></div><div class="m-b">
    <div class="small muted" style="margin-bottom:8px">Start blank or from a template.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${Object.entries(NOTE_TEMPLATES).map(([k,t])=>`<button class="btn" data-act="createNotePage" data-tpl="${k}" style="justify-content:flex-start;padding:12px"><span style="font-size:18px;margin-right:8px">${t.icon}</span>${esc(t.name)}</button>`).join('')}
    </div></div><div class="m-f"><button class="btn" data-act="closeModal">Cancel</button></div>`);
};
ACTIONS.createNotePage=t=>{ const tpl=NOTE_TEMPLATES[t.dataset.tpl]||NOTE_TEMPLATES.blank;
  const pg={id:uid(),name:tpl.name,icon:tpl.icon,kind:tpl.kind||'doc',blocks:tpl.blocks()};
  if(tpl===NOTE_TEMPLATES.blank&&pg.blocks[0]) pg.blocks[0].html='';
  S.notes.push(pg); S.ui.notePage=pg.id; save(); closeModal(); render();
  if(pg.kind!=='links'&&pg.blocks[0]) focusBlock(pg.blocks[0].id,true);
};
ACTIONS.renamePage=()=>{ const pg=curPage();
  const icon=prompt('Page icon (an emoji):',pg.icon||'📄'); if(icon!==null){ pg.icon=icon.trim()||'📄'; save(); render(); } };
ACTIONS.delNotePage=t=>{ if(S.notes.length<=1) return toast('Keep at least one page');
  if(!confirm('Delete this notes page?')) return;
  S.notes=S.notes.filter(p=>p.id!==t.dataset.id); S.ui.notePage=S.notes[0].id; save(); render(); };

/* ---- links database ---- */
function linksDBHTML(){
  const q=(S.ui.linkFilter||'').toLowerCase();
  const rows=S.links.filter(l=>!q||[l.title,l.url,l.category,l.notes].join(' ').toLowerCase().includes(q));
  const cats=[...new Set(S.links.map(l=>l.category).filter(Boolean))];
  return `<div class="doc" id="doc" style="max-width:1000px">
    <div class="page-head"><span class="pico">🔗</span><input class="ptitle" value="${esc(curPage().name)}" data-pgname="${curPage().id}">
      <span class="sp" style="flex:1"></span>
      <button class="btn sm ghost danger" data-act="delNotePage" data-id="${curPage().id}">Delete page</button></div>
    <div class="toolbar" style="margin:6px 0 12px">
      <input data-bind="ui.linkFilter" value="${esc(S.ui.linkFilter||'')}" placeholder="Filter links…" style="width:220px">
      ${cats.length?`<span class="muted small">Categories: ${cats.map(esc).join(', ')}</span>`:''}
      <span class="sp" style="flex:1"></span>
      <button class="btn sm primary" data-act="addLink">+ Link</button></div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>Title</th><th>URL</th><th>Category</th><th>Notes</th><th></th></tr></thead>
    <tbody>${rows.length?rows.map(l=>`<tr data-drop="links:${l.id}">
      <td style="width:20px;padding-right:0"><span class="dragh" draggable="true" data-drag="links:${l.id}">⠿</span></td>
      <td><input data-bind="links.${l.id}.title" value="${esc(l.title||'')}" placeholder="Title"></td>
      <td><div style="display:flex;align-items:center;gap:4px"><input data-bind="links.${l.id}.url" value="${esc(l.url||'')}" placeholder="https://…">${l.url?`<a href="${esc(l.url)}" target="_blank" rel="noopener" class="btn sm ghost" title="Open link">↗</a>`:''}</div></td>
      <td><input data-bind="links.${l.id}.category" value="${esc(l.category||'')}" placeholder="Category" list="linkcats"></td>
      <td><textarea rows="1" data-bind="links.${l.id}.notes" placeholder="…">${esc(l.notes||'')}</textarea></td>
      <td><button class="btn sm ghost danger" data-act="delLink" data-id="${l.id}">✕</button></td></tr>`).join('')
      :`<tr><td colspan="6"><div class="empty">No links yet. Keep your programme's key documents, dashboards and drive folders here.</div></td></tr>`}</tbody></table></div>
    <datalist id="linkcats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>`;
}
ACTIONS.addLink=()=>{ S.links.push({id:uid(),title:'',url:'',category:'',notes:''}); save(); render();
  setTimeout(()=>{ const els=$$('input[data-bind^="links."][data-bind$=".title"]'); if(els.length) els[els.length-1].focus(); },40); };
ACTIONS.delLink=t=>{ S.links=S.links.filter(l=>l.id!==t.dataset.id); save(); render(); };
function focusBlock(id,toEnd){ setTimeout(()=>{ const el=document.querySelector(`.bc[data-bid="${id}"]`); if(!el) return; el.focus();
  if(toEnd){ const r=document.createRange(); r.selectNodeContents(el); r.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } },40); }

ACTIONS.addBlockEnd=()=>{ const b=newBlock('p'); curPage().blocks.push(b); save(); render(); focusBlock(b.id); };
ACTIONS.addChildBlock=t=>{ const r=findBlock(t.dataset.id); if(!r) return; r.b.children=r.b.children||[]; const b=newBlock('p'); r.b.children.push(b); save(); render(); focusBlock(b.id); };
ACTIONS.tglBlock=t=>{ const r=findBlock(t.dataset.id); if(r){ r.b.open=!r.b.open; save(); render(); } };
ACTIONS.tblRow=t=>{ const r=findBlock(t.dataset.id); if(r){ r.b.rows.push(r.b.rows[0].map(()=>'')); save(); render(); } };
ACTIONS.tblCol=t=>{ const r=findBlock(t.dataset.id); if(r){ r.b.rows.forEach(row=>row.push('')); save(); render(); } };
ACTIONS.tblDelRow=t=>{ const r=findBlock(t.dataset.id); if(r&&r.b.rows.length>1){ r.b.rows.pop(); save(); render(); } };
ACTIONS.tblDelCol=t=>{ const r=findBlock(t.dataset.id); if(r&&r.b.rows[0].length>1){ r.b.rows.forEach(row=>row.pop()); save(); render(); } };

ACTIONS.blockMenu=t=>{ const id=t.dataset.id; const r=findBlock(id); if(!r) return;
  const types=[['p','Text'],['h1','Heading 1'],['h2','Heading 2'],['h3','Heading 3'],['bullet','Bullet'],['callout','Callout'],['toggle','Toggle']];
  modal(`<div class="m-h"><h3>Block</h3></div><div class="m-b">
    <div class="small muted" style="margin-bottom:6px">Turn into</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${types.map(([ty,lb])=>`<button class="btn sm ${r.b.type===ty?'primary':''}" data-act="blockType" data-id="${id}" data-type="${ty}">${lb}</button>`).join('')}
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn sm" data-act="blockMove" data-id="${id}" data-dir="-1">↑ Move up</button>
      <button class="btn sm" data-act="blockMove" data-id="${id}" data-dir="1">↓ Move down</button>
      <button class="btn sm danger" data-act="blockDel" data-id="${id}" style="margin-left:auto">Delete block</button>
    </div></div>`);
};
ACTIONS.blockType=t=>{ const r=findBlock(t.dataset.id); if(!r) return; const ty=t.dataset.type;
  if(ty==='toggle'&&r.b.type!=='toggle'){ r.b.open=true; r.b.children=r.b.children||[newBlock('p')]; }
  r.b.type=ty; save(); closeModal(); render(); };
ACTIONS.blockMove=t=>{ const r=findBlock(t.dataset.id); if(!r) return; const ni=r.idx+Number(t.dataset.dir);
  if(ni<0||ni>=r.list.length) return; r.list.splice(r.idx,1); r.list.splice(ni,0,r.b); save(); closeModal(); render(); };
ACTIONS.blockDel=t=>{ const r=findBlock(t.dataset.id); if(!r) return; r.list.splice(r.idx,1);
  if(!curPage().blocks.length) curPage().blocks.push(newBlock('p')); save(); closeModal(); render(); };

/* typing in blocks */
let bSaveTimer=null;
document.addEventListener('input',e=>{
  const pn=e.target.closest&&e.target.closest('[data-pgname]');
  if(pn){ const pg=byId(S.notes,pn.dataset.pgname); if(pg){ pg.name=pn.value; clearTimeout(bSaveTimer); bSaveTimer=setTimeout(()=>{ save(); const tab=document.querySelector(`.note-tab[data-id="${pg.id}"]`); if(tab) tab.lastChild.textContent=' '+pg.name; },400); } return; }
  const bc=e.target.closest&&e.target.closest('.bc[data-bid]'); if(!bc) return;
  const r=findBlock(bc.dataset.bid); if(!r) return;
  r.b.html=bc.innerHTML;
  clearTimeout(bSaveTimer); bSaveTimer=setTimeout(save,400);
  maybeSlashMenu(bc,r);
});
document.addEventListener('focusout',e=>{
  const td=e.target.closest&&e.target.closest('[data-tcell]'); if(!td) return;
  const r=findBlock(td.dataset.tcell); if(!r) return;
  r.b.rows[Number(td.dataset.r)][Number(td.dataset.c)]=td.innerHTML; save();
});
document.addEventListener('keydown',e=>{
  const bc=e.target.closest&&e.target.closest('.bc[data-bid]'); if(!bc) return;
  const r=findBlock(bc.dataset.bid); if(!r) return;
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); hideSlash();
    r.b.html=bc.innerHTML;
    const nb=newBlock(r.b.type==='bullet'?'bullet':'p');
    r.list.splice(r.idx+1,0,nb); save(); render(); focusBlock(nb.id); }
  else if(e.key==='Backspace'&&bc.textContent.trim()===''&&!bc.querySelector('.chip')){
    if(r.list.length>1||r.parent){ e.preventDefault(); hideSlash();
      const prev=r.list[r.idx-1]; r.list.splice(r.idx,1); save(); render();
      if(prev&&prev.html!==undefined) focusBlock(prev.id,true); } }
  else if(e.key==='Escape') hideSlash();
});
/* slash menu */
const SLASH_ITEMS=[
  ['p','¶','Text'],['h1','H1','Heading 1'],['h2','H2','Heading 2'],['h3','H3','Heading 3'],
  ['bullet','•','Bulleted list'],['toggle','▸','Toggle (collapsible)'],['callout','▢','Callout'],
  ['table','⊞','Table'],['divider','—','Divider'],['link','🔗','Link to item…'],
];
let slashFor=null;
function maybeSlashMenu(bc,r){
  const txt=bc.textContent;
  if(txt.startsWith('/')){ const q=txt.slice(1).toLowerCase(); slashFor=r.b.id;
    const items=SLASH_ITEMS.filter(([ty,ic,lb])=>!q||lb.toLowerCase().includes(q));
    if(!items.length){ hideSlash(); return; }
    const m=$('#slashmenu'); m.innerHTML=items.map(([ty,ic,lb])=>`<button data-act="slashPick" data-type="${ty}"><span class="ic">${ic}</span>${lb}</button>`).join('');
    const rect=bc.getBoundingClientRect();
    m.style.left=(rect.left+window.scrollX)+'px'; m.style.top=(rect.bottom+window.scrollY+4)+'px'; m.style.display='block';
  } else hideSlash();
}
function hideSlash(){ $('#slashmenu').style.display='none'; slashFor=null; }
document.addEventListener('click',e=>{ if(!e.target.closest('#slashmenu')&&!e.target.closest('.bc')) hideSlash(); });
ACTIONS.slashPick=t=>{ const ty=t.dataset.type; const r=slashFor&&findBlock(slashFor); hideSlash(); if(!r) return;
  r.b.html='';
  if(ty==='link'){ linkPicker(ref=>{ const r2=findBlock(r.b.id); if(r2){ r2.b.html+=' '+chipHTML(ref)+'&nbsp;'; save(); render(); focusBlock(r2.b.id,true); } }); save(); render(); return; }
  if(ty==='toggle'){ r.b.type='toggle'; r.b.open=true; r.b.children=r.b.children||[newBlock('p')]; }
  else if(ty==='table'){ const nb=newBlock('table'); r.list.splice(r.idx,1,nb); save(); render(); return; }
  else if(ty==='divider'){ const nb=newBlock('divider'); r.list.splice(r.idx,0,nb); r.b.type='p'; }
  else r.b.type=ty;
  save(); render(); focusBlock(r.b.id);
};

/* ================= CSV DATA ROUND-TRIP (contracts & financial data) ================= */
const CSV_COLS=['type','supplier','supplier_number','contract_number','contract_value','what','where','start_date','end_date','po_number','po_description','line_number','line_description','wbs','spend_code','gl_code','line_value','invoice_number','invoice_value','invoice_date','invoice_for','notes'];
const csvCell=v=>{ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
const csvRow=obj=>CSV_COLS.map(k=>csvCell(obj[k]??'')).join(',');
function buildDataCSV(){ // current data in the import schema — edit in Excel and re-upload
  const lines=[CSV_COLS.join(',')];
  const emitPO=(p)=>{ const c=contractOf(p.contractId)||{};
    lines.push(csvRow({type:'po',supplier:p.supplier||'',contract_number:c.contractNumber||'',where:p.where||'',po_number:p.poNumber,po_description:p.description||''}));
    linesOfPO(p.id).forEach(l=>{
      lines.push(csvRow({type:'line',po_number:p.poNumber,line_number:l.lineNo,line_description:l.description||'',wbs:l.wbs||'',spend_code:l.spendCode||'',gl_code:l.glCode||'',line_value:parseNum(l.value)}));
      invoicesOfLine(l.id).forEach(i=>lines.push(csvRow({type:'invoice',po_number:p.poNumber,line_number:l.lineNo,invoice_number:i.invoiceNumber,invoice_value:parseNum(i.value),invoice_date:i.date||'',invoice_for:i.forWhat||'',notes:i.notes||''})));
    });
  };
  S.contracts.forEach(c=>{
    lines.push(csvRow({type:'contract',supplier:c.supplier,supplier_number:c.supplierNumber||'',contract_number:c.contractNumber||'',contract_value:parseNum(c.totalValue),what:c.what||'',where:c.where||'',start_date:c.startDate||'',end_date:c.endDate||'',notes:c.notes||''}));
    posOfContract(c.id).forEach(emitPO);
  });
  standalonePOs().forEach(emitPO);
  if(!S.contracts.length&&!S.pos.length){ // seed examples for an empty programme
    lines.push('contract,Henderson Civil,S-1001,C-2026-01,150000,Hub construction,Henderson,2026-07-01,2027-06-30,,,,,,,,,,,,,Example contract');
    lines.push('po,,,C-2026-01,,,,,PO-7788,Hub construction works,,,,,,,,,,,,');
    lines.push('line,,,,,,,,PO-7788,,10,Civil works,WBS-100,CAPEX,6100,100000,,,,,');
    lines.push('invoice,,,,,,,,PO-7788,,10,,,,,,INV-001,25000,2026-07-10,Site prep,First claim');
  }
  return lines.join('\n');
}
const CSV_TEMPLATE=buildDataCSV;
function parseCSV(text){ const rows=[]; let row=[],cell='',inQ=false;
  text=text.replace(/\r\n?/g,'\n');
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else inQ=false; } else cell+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'){ row.push(cell); cell=''; rows.push(row); row=[]; }
    else cell+=ch;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function normDate(s){ s=(s||'').trim(); if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/); // NZ d/m/yyyy
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return '';
}
function runCSVImport(text){
  const rows=parseCSV(text);
  if(rows.length<2) return {errors:['No data rows found under the header row.'],recognised:0};
  const alias={total_value:'contract_value',contract_total_value:'contract_value',wbs_element:'wbs',invoice_notes:'notes',line_no:'line_number',po_no:'po_number',contract_no:'contract_number',
    site:'where',location:'where',region:'where',workstream:'where',for_what:'what',forwhat:'what',what_for:'what',description:'po_description'};
  const head=rows[0].map(h=>{ const k=h.toLowerCase().trim().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''); return alias[k]||k; });
  const idx=name=>head.indexOf(name);
  const get=(r,name)=>{ const i=idx(name); return i>=0?(r[i]||'').trim():''; };
  const res={contracts:0,pos:0,lines:0,invoices:0,updated:0,errors:[],recognised:0,head};
  if(idx('type')<0) return {...res,errors:[`No “type” column found. The first row must be a header row including a "type" column (values: contract, po, line, invoice). Detected columns: ${head.join(', ')}. Tip: download the current data below and edit that file — its format is exactly what re-import expects.`]};
  const findContract=no=>S.contracts.find(c=>(c.contractNumber||'').toLowerCase()===no.toLowerCase());
  const findPO=no=>S.pos.find(p=>(p.poNumber||'').toLowerCase()===no.toLowerCase());
  const setIf=(obj,k,v)=>{ if(v!=='') obj[k]=v; };
  rows.slice(1).forEach((r,ri)=>{
    const type=get(r,'type').toLowerCase(); const rowNo=ri+2;
    try{
      if(type==='contract'){
        res.recognised++;
        const no=get(r,'contract_number'), supplier=get(r,'supplier');
        let c=no?findContract(no):S.contracts.find(x=>!x.contractNumber&&x.supplier.toLowerCase()===supplier.toLowerCase());
        if(!c){ c={id:uid(),supplier:'',supplierNumber:'',contractNumber:'',totalValue:0,variations:[],startDate:'',endDate:'',notes:'',archived:false,what:'',where:''}; S.contracts.push(c); res.contracts++; } else res.updated++;
        setIf(c,'supplier',supplier); setIf(c,'supplierNumber',get(r,'supplier_number')); setIf(c,'contractNumber',no);
        setIf(c,'what',get(r,'what')); setIf(c,'where',get(r,'where'));
        if(get(r,'contract_value')!=='') c.totalValue=parseNum(get(r,'contract_value'));
        setIf(c,'startDate',normDate(get(r,'start_date'))); setIf(c,'endDate',normDate(get(r,'end_date'))); setIf(c,'notes',get(r,'notes'));
      }
      else if(type==='po'){
        res.recognised++;
        const no=get(r,'po_number'); if(!no) throw 'po row needs po_number';
        const cno=get(r,'contract_number');
        let contractId='';
        if(cno){ const c=findContract(cno); if(!c) throw `contract "${cno}" not found (import contracts first / order rows contract → po → line → invoice)`; contractId=c.id; }
        let p=findPO(no);
        if(!p){ p={id:uid(),poNumber:no,contractId:'',supplier:'',description:'',archived:false,where:''}; S.pos.push(p); res.pos++; } else res.updated++;
        if(cno) p.contractId=contractId;
        setIf(p,'supplier',get(r,'supplier')); setIf(p,'where',get(r,'where')); setIf(p,'description',get(r,'po_description')||get(r,'notes'));
      }
      else if(type==='line'){
        res.recognised++;
        const pno=get(r,'po_number'), lno=get(r,'line_number');
        if(!pno||!lno) throw 'line row needs po_number and line_number';
        const p=findPO(pno); if(!p) throw `PO "${pno}" not found`;
        let l=linesOfPO(p.id).find(x=>String(x.lineNo)===lno);
        if(!l){ l={id:uid(),poId:p.id,lineNo:lno,wbs:'',spendCode:'',glCode:'',value:0,description:'',archived:false}; S.poLines.push(l); res.lines++; } else res.updated++;
        setIf(l,'description',get(r,'line_description')); setIf(l,'wbs',get(r,'wbs'));
        setIf(l,'spendCode',get(r,'spend_code')); setIf(l,'glCode',get(r,'gl_code'));
        if(get(r,'line_value')!=='') l.value=parseNum(get(r,'line_value'));
      }
      else if(type==='invoice'){
        res.recognised++;
        const pno=get(r,'po_number'), lno=get(r,'line_number'), ino=get(r,'invoice_number');
        if(!pno||!lno||!ino) throw 'invoice row needs po_number, line_number and invoice_number';
        const p=findPO(pno); if(!p) throw `PO "${pno}" not found`;
        const l=linesOfPO(p.id).find(x=>String(x.lineNo)===lno); if(!l) throw `line ${lno} not found on PO ${pno}`;
        let inv=invoicesOfLine(l.id).find(x=>(x.invoiceNumber||'').toLowerCase()===ino.toLowerCase());
        if(!inv){ inv={id:uid(),poLineId:l.id,invoiceNumber:ino,value:0,date:'',forWhat:'',notes:''}; S.invoices.push(inv); res.invoices++; } else res.updated++;
        if(get(r,'invoice_value')!=='') inv.value=parseNum(get(r,'invoice_value'));
        setIf(inv,'date',normDate(get(r,'invoice_date'))); setIf(inv,'forWhat',get(r,'invoice_for')); setIf(inv,'notes',get(r,'notes'));
      }
      else if(type) throw `unknown type "${type}" (use contract / po / line / invoice)`;
    }catch(err){ res.errors.push('Row '+rowNo+': '+err); }
  });
  return res;
}

  let text=($('#csvtext').value||'').trim();

};

function download(filename,content,mime){ const blob=new Blob([content],{type:mime});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
const escXml=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function htmlToText(html){ const d=document.createElement('div'); d.innerHTML=html||'';

function xCell(v,head){ const st=head?' ss:StyleID="h"':'';
  if(typeof v==='number'&&isFinite(v)) return `<Cell${st}><Data ss:Type="Number">${v}</Data></Cell>`;
  return `<Cell${st}><Data ss:Type="String">${escXml(v)}</Data></Cell>`; }
function xSheet(name,rows){ // rows[0] is the header row

  return `<Worksheet ss:Name="${escXml(name.slice(0,31))}"><Table>${body}</Table></Worksheet>`; }

    const st=stateOf(t.stateId); const meta=[st.name];
    if(t.priorityId) meta.push(priorityName(t.priorityId)); if(t.owner) meta.push('owner: '+t.owner);
    if((t.tagIds||[]).length) meta.push('tags: '+t.tagIds.map(id=>(taskTagOf(id)||{}).name).filter(Boolean).join('/'));
    return '  '.repeat(depth)+`- [${st.done?'x':' '}] ${t.name||'(untitled)'}`+(t.due?` (due ${t.due})`:'')+(t.completed?` (completed ${t.completed})`:'')+` — ${meta.join(', ')}, last actioned ${t.lastActioned||'—'}`
      +((t.links||[]).length?` [links: ${t.links.map(l=>refLabel(...l.split(':'))).join('; ')}]`:'')
      +(t.notes?`\n${'  '.repeat(depth+1)}> ${t.notes.replace(/\n/g,' ')}`:'')
      +(t.children&&t.children.length?'\n'+tmd(t.children,depth+1):'');}).join('\n');
  md+=(S.tasks.length?tmd(S.tasks,0):'_None._')+'\n';
  md+=`\n## Calendar\n\n`+mdTable(['Date','Time','Title','Tags','Organiser','Notes'],
    [...S.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date+(e.endDate?' → '+e.endDate:''),e.time||'',e.title,(e.tagIds||[]).map(id=>(tagOf(id)||{}).name).filter(Boolean).join(', '),e.organiser||'',(e.notes||'').replace(/\n/g,' ')]));
  if(S.links.length) md+=`\n## Links\n\n`+mdTable(['Title','URL','Category','Notes'],S.links.map(l=>[l.title||'',l.url||'',l.category||'',(l.notes||'').replace(/\n/g,' ')]));
  const bmd=(b,depth)=>{ const ind='  '.repeat(depth); let out='';
    if(b.type==='h1') out=`# ${htmlToText(b.html)}`; else if(b.type==='h2') out=`## ${htmlToText(b.html)}`;
    else if(b.type==='h3') out=`### ${htmlToText(b.html)}`; else if(b.type==='bullet') out=ind+`- ${htmlToText(b.html)}`;
    else if(b.type==='divider') out='---'; else if(b.type==='callout') out=`> ${htmlToText(b.html)}`;
    else if(b.type==='table') out=mdTable((b.rows[0]||[]).map(htmlToText),(b.rows.slice(1)||[]).map(r=>r.map(htmlToText)));
    else if(b.type==='toggle') out=ind+`- **${htmlToText(b.html)}**`;
    else out=ind+htmlToText(b.html);
    return out+'\n'+(b.children||[]).map(c=>bmd(c,depth+1)).join(''); };
  S.notes.forEach(pg=>{ if(pg.kind==='links') return; md+=`\n## ${pg.name}\n\n`+(pg.blocks||[]).map(b=>bmd(b,0)).join('')+'\n'; });
  download(slug(S.programme.name)+'-'+todayStr()+'.md',md,'text/markdown');
  toast('Markdown snapshot exported — drop it straight into an AI chat');
};

/* --- JSON save / open --- */
let fileHandle=null;
ACTIONS.saveJSON=async()=>{
  const content=JSON.stringify(S,null,1);
  const name=slug(S.programme.name)+'.programme.json';
  if(window.showSaveFilePicker){
    try{
      if(!fileHandle) fileHandle=await showSaveFilePicker({suggestedName:name,types:[{description:'Programme file',accept:{'application/json':['.json']}}]});
      const w=await fileHandle.createWritable(); await w.write(content); await w.close();
      toast('Saved to '+fileHandle.name); save(); return;
    }catch(e){ if(e&&e.name==='AbortError') return; fileHandle=null; }
  }
  download(name,content,'application/json'); toast('Programme file downloaded');
};
ACTIONS.openJSON=async()=>{
  if(window.showOpenFilePicker){
    try{ const [h]=await showOpenFilePicker({types:[{description:'Programme file',accept:{'application/json':['.json']}}]});
      const f=await h.getFile(); importState(JSON.parse(await f.text())); fileHandle=h; return;
    }catch(e){ if(e&&e.name==='AbortError') return; }
  }
  $('#filein').click();
};
$('#filein').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ importState(JSON.parse(await f.text())); }catch(err){ toast('Could not read that file'); }
  e.target.value='';
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); ACTIONS.saveJSON(); }
});

boot();
</script>
