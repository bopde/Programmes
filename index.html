<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programme Manager</title>
<style>
/* ============================================================
   BRAND PALETTE — tweak these to match mansfield.consulting
   ============================================================ */
:root{
  --ink:      #22303e;   /* primary text — deep navy */
  --ink-2:    #5b6b7a;   /* secondary text */
  --ink-3:    #96a2ae;   /* muted text */
  --bg:       #f7f5f0;   /* warm paper background */
  --surface:  #ffffff;   /* cards, tables */
  --surface-2:#fbfaf6;   /* subtle panels */
  --line:     #e6e2d8;   /* borders */
  --line-2:   #efece4;   /* faint borders */
  --navy:     #22303e;   /* brand primary */
  --accent:   #b06a3b;   /* copper accent */
  --accent-soft:#f4e8de;
  --good:     #4a7c59;   /* sage */
  --good-soft:#e8f0ea;
  --warn:     #b45309;
  --warn-soft:#fdf1e3;
  --bad:      #b3423a;
  --bad-soft: #f9e9e8;
  --sel:      #eef3f7;
  --shadow: 0 1px 2px rgba(34,48,62,.06), 0 4px 16px rgba(34,48,62,.05);
  --radius: 10px;
  --serif: Georgia, 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:.01em}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:10px 22px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:15px;flex:none}
#progName{font-family:var(--serif);font-size:18px;font-weight:600;padding:2px 6px;border-radius:6px;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
#progName:hover,#progName:focus{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.tabs{display:flex;gap:2px;margin-left:6px}
.tabs button{border:0;background:none;font:inherit;color:var(--ink-2);padding:7px 14px;border-radius:8px;cursor:pointer}
.tabs button:hover{background:var(--surface);color:var(--ink)}
.tabs button.on{background:var(--navy);color:#fff}
.hd-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.hd-actions .stamp{color:var(--ink-3);font-size:12px;margin-right:6px}

/* ---------- buttons & inputs ---------- */
button{font:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#2e4052}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface);color:var(--ink)}
.btn.sm{padding:3px 8px;font-size:12.5px;border-radius:7px}
.btn.icon{padding:4px 7px}
.btn.danger{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
input[type=date]{padding:4px 6px}
textarea{resize:vertical}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:3px}
label.f input,label.f select,label.f textarea{width:100%}

/* ---------- layout ---------- */
main{max-width:1400px;margin:0 auto;padding:20px 22px 80px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .card-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.card .card-b{padding:12px 14px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
.subtabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px}
.subtabs button{border:0;background:none;padding:5px 12px;border-radius:7px;color:var(--ink-2);cursor:pointer}
.subtabs button.on{background:var(--navy);color:#fff}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.nowrap{white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* ---------- tables ---------- */
table.tbl{border-collapse:collapse;width:100%;background:var(--surface);font-size:13.5px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
.tbl td{padding:5px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:hover td{background:var(--surface-2)}
.tbl td input,.tbl td select{border-color:transparent;background:transparent;width:100%;min-width:60px;padding:4px 6px}
.tbl td input:hover,.tbl td select:hover{border-color:var(--line)}
.tbl td input:focus,.tbl td select:focus{border-color:var(--accent);background:var(--surface)}
.tbl td input.num{text-align:right}
.tbl .grp td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--line)}
.tbl .tot td{background:var(--surface-2);font-weight:600;border-top:2px solid var(--line)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);background:var(--surface)}

/* ---------- chips & pills ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--sel);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:1px 9px;font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap;vertical-align:middle}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip .x{color:var(--ink-3);margin-left:2px;padding:0 2px}
.chip .x:hover{color:var(--bad)}
.chip .ic{opacity:.65;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ---------- modal / toast ---------- */
dialog{border:0;border-radius:14px;box-shadow:0 12px 48px rgba(34,48,62,.25);padding:0;max-width:640px;width:min(92vw,640px);background:var(--surface)}
dialog::backdrop{background:rgba(34,48,62,.35)}
dialog .m-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2)}
dialog .m-h h3{margin:0;font-size:17px}
dialog .m-b{padding:16px 18px;max-height:70vh;overflow:auto}
dialog .m-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line-2)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toast.show{opacity:1}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}100%{background:none}}

/* ---------- start screen ---------- */
#start{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;place-items:center}
#start.show{display:grid}
#start .panel{width:min(92vw,460px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:34px 38px}
#start h1{margin:0 0 4px;font-size:26px}
#start .sub{color:var(--ink-2);margin-bottom:22px}
#start .existing{margin-top:20px;border-top:1px solid var(--line-2);padding-top:14px}
#start .existing button{display:flex;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit;color:var(--ink);justify-content:space-between}
#start .existing button:hover{background:var(--sel)}

/* ---------- budget structure ---------- */
.contract-card{margin-bottom:16px}
.contract-card .card-h .title{font-family:var(--serif);font-size:16px;font-weight:600}
.po-block{border:1px solid var(--line-2);border-radius:8px;margin:10px 0;background:var(--surface-2)}
.po-block .po-h{display:flex;align-items:center;gap:10px;padding:7px 12px;cursor:pointer}
.po-block .po-b{padding:0 12px 10px}
.inv-rows{margin:4px 0 4px 24px;border-left:2px solid var(--line);padding-left:12px}
.inv-rows .inv{display:flex;gap:8px;align-items:center;padding:2px 0;font-size:12.5px}

/* ---------- forecast ---------- */
.fc-cell{position:relative}
.fc-cell input{width:86px;text-align:right;font-variant-numeric:tabular-nums}
.fc-cell .sub{display:block;font-size:10.5px;color:var(--ink-3);text-align:right;padding-right:6px}
.fc-cell input.pct{color:var(--accent);font-weight:600}

/* ---------- calendar ---------- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--line-2);gap:1px;box-shadow:var(--shadow)}
.cal-grid .dow{background:var(--surface-2);padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;text-align:center}
.cal-cell{background:var(--surface);min-height:112px;padding:5px 6px;position:relative}
.cal-cell.dim{background:var(--surface-2)}
.cal-cell.today .dnum{background:var(--accent);color:#fff}
.cal-cell .dnum{font-size:12px;font-weight:600;width:22px;height:22px;display:inline-grid;place-items:center;border-radius:50%;color:var(--ink-2)}
.cal-cell .addbtn{position:absolute;top:4px;right:4px;opacity:0;border:0;background:var(--sel);border-radius:6px;cursor:pointer;padding:1px 7px;color:var(--ink-2)}
.cal-cell:hover .addbtn{opacity:1}
.ev{display:flex;align-items:center;gap:5px;font-size:12px;padding:1px 6px;border-radius:6px;cursor:pointer;margin:1px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ev:hover{background:var(--sel)}
.ev .t{overflow:hidden;text-overflow:ellipsis}
.ev.task{color:var(--ink-2)}
.cal-list .day-h{font-family:var(--serif);font-size:15px;margin:16px 0 6px;font-weight:600}

/* ---------- tasks ---------- */
.task-tree{padding:4px 0}
.task-row{display:flex;align-items:center;gap:7px;padding:3px 8px;border-radius:8px;position:relative}
.task-row:hover{background:var(--surface-2)}
.task-row .caret{width:18px;height:18px;display:grid;place-items:center;color:var(--ink-3);cursor:pointer;border-radius:5px;flex:none;font-size:10px}
.task-row .caret:hover{background:var(--sel);color:var(--ink)}
.task-row .caret.empty{visibility:hidden}
.task-row input.tname{flex:1;border-color:transparent;background:transparent;min-width:140px}
.task-row input.tname:focus{border-color:var(--accent);background:var(--surface)}
.task-row.done input.tname{color:var(--ink-3);text-decoration:line-through}
.task-row .meta{display:flex;align-items:center;gap:6px;flex:none}
.task-row input[type=date]{border-color:transparent;background:transparent;color:var(--ink-2);font-size:12px;width:118px}
.task-row input[type=date]:hover{border-color:var(--line)}
.task-row .rowtools{display:none;gap:2px}
.task-row:hover .rowtools{display:inline-flex}
.task-kids{margin-left:26px;border-left:1px solid var(--line-2);padding-left:4px}
.task-notes{margin:0 0 4px 60px}
.task-notes textarea{width:min(640px,90%);font-size:12.5px;min-height:40px}
.tlinks{display:inline-flex;gap:4px;flex-wrap:wrap;max-width:340px}
.due-over{color:var(--bad)!important;font-weight:600}
.due-soon{color:var(--warn)!important;font-weight:600}

/* ---------- status / notes editor ---------- */
.doc{max-width:860px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:44px 56px;min-height:60vh}
.blk{position:relative;margin:2px 0;border-radius:6px}
.blk .bc{outline:none;padding:3px 6px;border-radius:6px;min-height:1.4em}
.blk .bc:focus{background:var(--surface-2)}
.blk .bc:empty:before{content:attr(data-ph);color:var(--ink-3)}
.blk.t-h1 .bc{font-family:var(--serif);font-size:26px;font-weight:600;margin-top:10px}
.blk.t-h2 .bc{font-family:var(--serif);font-size:20px;font-weight:600;margin-top:8px}
.blk.t-h3 .bc{font-size:16px;font-weight:600}
.blk.t-bullet{display:flex}.blk.t-bullet:before{content:'•';padding:3px 2px 0 10px;color:var(--ink-2)}
.blk.t-bullet .bc{flex:1}
.blk.t-callout{background:var(--accent-soft);border:1px solid #eadbce;padding:6px 10px}
.blk.t-divider{border-top:1px solid var(--line);margin:14px 0;height:0}
.blk .handle{position:absolute;left:-30px;top:3px;opacity:0;color:var(--ink-3);cursor:pointer;padding:2px 6px;border-radius:5px;font-size:13px}
.blk:hover .handle{opacity:1}
.blk .handle:hover{background:var(--sel)}
.blk.t-toggle>.tg-head{display:flex;align-items:flex-start;gap:2px}
.blk.t-toggle>.tg-head .tgc{cursor:pointer;padding:4px 4px 0 2px;color:var(--ink-2);font-size:11px;width:18px;flex:none;text-align:center}
.blk.t-toggle>.tg-head .bc{flex:1;font-weight:600}
.blk.t-toggle>.tg-kids{margin-left:22px;border-left:1px solid var(--line-2);padding-left:8px}
.blk table.ntbl{border-collapse:collapse;margin:4px 0;width:100%}
.blk table.ntbl td{border:1px solid var(--line);padding:4px 8px;min-width:70px}
.blk table.ntbl td[contenteditable]:focus{background:var(--surface-2);outline:none}
.blk table.ntbl tr:first-child td{background:var(--surface-2);font-weight:600}
.tbl-tools{display:none;gap:4px;margin:2px 0 6px}
.blk:hover .tbl-tools{display:flex}
#slashmenu{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(34,48,62,.18);padding:5px;display:none;width:230px}
#slashmenu button{display:flex;width:100%;border:0;background:none;text-align:left;padding:6px 10px;border-radius:7px;cursor:pointer;font:inherit;gap:9px;align-items:center}
#slashmenu button:hover,#slashmenu button.hl{background:var(--sel)}
#slashmenu .ic{width:22px;text-align:center;color:var(--ink-2)}

/* ---------- link picker ---------- */
#lp-results{max-height:320px;overflow:auto;margin-top:8px}
#lp-results button{display:flex;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit;gap:9px;align-items:center}
#lp-results button:hover{background:var(--sel)}
#lp-results .ty{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);width:64px;flex:none}
#lp-results .sub{color:var(--ink-3);font-size:12px;margin-left:auto}

.backlinks{margin-top:4px}
.empty{padding:36px;text-align:center;color:var(--ink-3)}
.settings-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
input[type=color]{padding:0;width:34px;height:28px;border-radius:6px;cursor:pointer}
@media print{header,.toolbar{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark">M</span><span id="progName" contenteditable="true" spellcheck="false"></span></div>
  <nav class="tabs" id="tabs">
    <button data-tab="budget">Budget</button>
    <button data-tab="calendar">Calendar</button>
    <button data-tab="actions">Actions</button>
    <button data-tab="status">Status</button>
  </nav>
  <div class="hd-actions">
    <span class="stamp" id="stamp"></span>
    <button class="btn sm" data-act="saveJSON" title="Save programme file (JSON)">💾 Save</button>
    <button class="btn sm" data-act="openJSON" title="Open programme file">📂 Open</button>
    <button class="btn sm" data-act="exportExcel" title="Export to Excel">📊 Excel</button>
    <button class="btn sm" data-act="exportMD" title="Export Markdown snapshot (AI-friendly)">📝 Markdown</button>
    <button class="btn sm ghost" data-act="settings" title="Settings">⚙</button>
  </div>
</header>
<main id="view"></main>
<dialog id="modal"></dialog>
<div id="slashmenu"></div>
<div id="toast"></div>
<div id="start">
  <div class="panel">
    <h1>Programme Manager</h1>
    <div class="sub">Budgets · Calendar · Actions · Status — one file per programme.</div>
    <form data-form="newProgramme">
      <label class="f"><span>New programme name</span><input name="name" placeholder="e.g. Bike Hubs" required></label>
      <button class="btn primary" type="submit">Create programme</button>
      <button class="btn" type="button" data-act="openJSON">Open a programme file…</button>
    </form>
    <div class="existing" id="startExisting"></div>
  </div>
</div>
<input type="file" id="filein" accept=".json,application/json" style="display:none">
<script>
'use strict';
/* ================= core: state, persistence, boot ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const parseNum=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0;};
const fmt=n=>Number(n||0).toLocaleString('en-NZ',{minimumFractionDigits:0,maximumFractionDigits:2});
const money=n=>(S.programme.currency||'$')+fmt(n);
const dstr=d=>d?new Date(d+'T00:00').toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'}):'';

let S=null, lsKey=null, TAB='budget';

function defaultState(name){return {
  v:1,
  programme:{name:name||'New Programme',currency:'$',created:todayStr(),modified:''},
  settings:{
    taskStates:[
      {id:'todo', name:'To do', color:'#96a2ae', done:false},
      {id:'doing',name:'Doing', color:'#b06a3b', done:false},
      {id:'done', name:'Complete', color:'#4a7c59', done:true},
    ],
    eventTags:[
      {id:'milestone',name:'Milestone',color:'#b06a3b'},
      {id:'meeting',  name:'Meeting',  color:'#22303e'},
      {id:'hui',      name:'Hui',      color:'#4a7c59'},
      {id:'deadline', name:'Deadline', color:'#b3423a'},
    ],
  },
  contracts:[],  // {id,supplier,supplierNumber,contractNumber,totalValue,startDate,endDate,notes}
  pos:[],        // {id,poNumber,contractId,description}
  poLines:[],    // {id,poId,lineNo,wbs,spendCode,glCode,value,description}
  invoices:[],   // {id,poLineId,invoiceNumber,value,date,forWhat,notes}
  budget:[],     // {id,what,where,supplier,contractId,poId,poLineId,orig,variations:[{id,label,value,date}],endDate,notes}
  forecast:{},   // 'lineId|period' -> {mode:'val'|'pct', v:number}
  fcCfg:{gran:'month',start:currentMonthKey(),count:12},
  events:[],     // {id,title,date,endDate,time,tagIds:[],notes,links:[]}
  tasks:[],      // nested: {id,name,due,lastActioned,stateId,notes,links:[],collapsed,children:[]}
  status:[{id:uid(),type:'h1',html:'Current status'},{id:uid(),type:'p',html:''}],
  views:[],      // custom budget views {id,name,cols:[],groupBy,filter}
  ui:{budgetTab:'lines',calMode:'month',calDate:todayStr(),view:'full',hideDone:false},
};}
function currentMonthKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

function save(){ if(!S) return; S.programme.modified=new Date().toISOString();
  try{ localStorage.setItem(lsKey,JSON.stringify(S)); }catch(e){ console.warn(e); }
  const t=new Date(); $('#stamp').textContent='Saved '+t.toLocaleTimeString('en-NZ',{hour:'2-digit',minute:'2-digit'});
}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'programme';}
function listLocal(){const out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
  if(k.startsWith('progapp:data:')){try{const d=JSON.parse(localStorage.getItem(k));out.push({key:k,name:d.programme.name,modified:d.programme.modified});}catch(e){}}}
  return out.sort((a,b)=>(b.modified||'').localeCompare(a.modified||''));}

function boot(){
  const last=localStorage.getItem('progapp:last');
  if(last&&localStorage.getItem(last)){ openKey(last); } else { showStart(); }
}
function showStart(){
  const ex=listLocal();
  $('#startExisting').innerHTML= ex.length? '<div class="small muted" style="margin-bottom:6px">Programmes on this computer</div>'+
    ex.map(p=>`<button data-act="openKey" data-key="${esc(p.key)}"><span>${esc(p.name)}</span><span class="muted small">${p.modified?new Date(p.modified).toLocaleDateString('en-NZ'):''}</span></button>`).join('') : '';
  $('#start').classList.add('show');
}
function openKey(key){
  try{ S=migrate(JSON.parse(localStorage.getItem(key))); }catch(e){ toast('Could not open programme'); showStart(); return; }
  lsKey=key; localStorage.setItem('progapp:last',key);
  $('#start').classList.remove('show'); initUI();
}
function createProgramme(name){
  S=defaultState(name); lsKey='progapp:data:'+slug(name)+'-'+uid().slice(-4);
  localStorage.setItem('progapp:last',lsKey); save();
  $('#start').classList.remove('show'); initUI();
}
function migrate(d){ const def=defaultState('x');
  for(const k of Object.keys(def)) if(d[k]===undefined) d[k]=def[k];
  for(const k of Object.keys(def.ui)) if(d.ui[k]===undefined) d.ui[k]=def.ui[k];
  return d;
}
function importState(obj){
  if(!obj||!obj.programme){ toast('Not a valid programme file'); return; }
  S=migrate(obj); lsKey='progapp:data:'+slug(S.programme.name)+'-'+uid().slice(-4);
  const dup=listLocal().find(p=>p.name===S.programme.name);
  if(dup) lsKey=dup.key; // overwrite the local copy of the same programme
  localStorage.setItem('progapp:last',lsKey); save();
  $('#start').classList.remove('show'); initUI(); toast('Programme loaded');
}
function initUI(){
  $('#progName').textContent=S.programme.name;
  document.title=S.programme.name+' — Programme Manager';
  setTab(TAB);
}
function setTab(name){ TAB=name;
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  render();
}
function render(){
  const v=$('#view');
  if(TAB==='budget') renderBudget(v);
  else if(TAB==='calendar') renderCalendar(v);
  else if(TAB==='actions') renderTasks(v);
  else if(TAB==='status') renderStatus(v);
}

/* ================= lookups & derived values ================= */
const byId=(arr,id)=>arr.find(x=>x.id===id);
const contractOf=id=>byId(S.contracts,id), poOf=id=>byId(S.pos,id), lineOf=id=>byId(S.poLines,id);
const linesOfPO=poId=>S.poLines.filter(l=>l.poId===poId);
const posOfContract=cId=>S.pos.filter(p=>p.contractId===cId);
const invoicesOfLine=lId=>S.invoices.filter(i=>i.poLineId===lId);
const lineInvoiced=lId=>invoicesOfLine(lId).reduce((s,i)=>s+parseNum(i.value),0);
const contractLinesSum=cId=>posOfContract(cId).flatMap(p=>linesOfPO(p.id)).reduce((s,l)=>s+parseNum(l.value),0);
function rowCalc(r){ // budget row derived values
  const orig=parseNum(r.orig), vars=(r.variations||[]).reduce((s,v)=>s+parseNum(v.value),0);
  const current=orig+vars;
  const actuals=r.poLineId?lineInvoiced(r.poLineId):(r.poId?linesOfPO(r.poId).reduce((s,l)=>s+lineInvoiced(l.id),0):0);
  const c=contractOf(r.contractId);
  return {orig,vars,current,actuals,remaining:current-actuals,
    supplier:c?c.supplier:(r.supplier||''),
    contractNo:c?c.contractNumber:'', poNo:r.poId?(poOf(r.poId)||{}).poNumber:'',
    lineNo:r.poLineId?(lineOf(r.poLineId)||{}).lineNo:'',
    endDate:c&&c.endDate?c.endDate:(r.endDate||'')};
}

/* ================= cross-linking ================= */
const TYPE_META={
  task:{ic:'☑',label:'Task'}, event:{ic:'📅',label:'Event'}, contract:{ic:'📜',label:'Contract'},
  po:{ic:'🧾',label:'PO'}, poline:{ic:'#',label:'PO line'}, budget:{ic:'💰',label:'Budget'}, invoice:{ic:'🧮',label:'Invoice'},
};
function walkTasks(fn,list,depth,parent){ (list||S.tasks).forEach(t=>{ fn(t,depth||0,parent||null); if(t.children&&t.children.length) walkTasks(fn,t.children,(depth||0)+1,t); }); }
function refLabel(type,id){
  if(type==='task'){ let n=null; walkTasks(t=>{if(t.id===id)n=t;}); return n?n.name||'(untitled task)':'(deleted task)'; }
  if(type==='event'){ const e=byId(S.events,id); return e?e.title||'(event)':'(deleted event)'; }
  if(type==='contract'){ const c=contractOf(id); return c?(c.supplier+' · '+(c.contractNumber||'no #')):'(deleted contract)'; }
  if(type==='po'){ const p=poOf(id); return p?('PO '+(p.poNumber||'?')):'(deleted PO)'; }
  if(type==='poline'){ const l=lineOf(id); if(!l) return '(deleted line)'; const p=poOf(l.poId); return 'PO '+(p?p.poNumber:'?')+' / '+(l.lineNo||'?'); }
  if(type==='budget'){ const b=byId(S.budget,id); return b?(b.what||'(budget line)'):'(deleted budget line)'; }
  if(type==='invoice'){ const i=byId(S.invoices,id); return i?('Inv '+(i.invoiceNumber||'?')):'(deleted invoice)'; }
  return '(?)';
}
function chipHTML(ref,removeCtx){ const [type,id]=ref.split(':'); const m=TYPE_META[type]||{ic:'∙'};
  return `<span class="chip" data-goto="${esc(ref)}"><span class="ic">${m.ic}</span>${esc(refLabel(type,id))}${removeCtx?`<span class="x" data-act="unlink" data-ref="${esc(ref)}" data-ctx="${esc(removeCtx)}" title="Remove link">×</span>`:''}</span>`;
}
function allEntities(){ const out=[];
  walkTasks((t,d)=>out.push({ref:'task:'+t.id,label:t.name||'(untitled)',sub:'· '.repeat(d)+(stateOf(t.stateId).name),ty:'Task'}));
  S.events.forEach(e=>out.push({ref:'event:'+e.id,label:e.title,sub:dstr(e.date),ty:'Event'}));
  S.contracts.forEach(c=>out.push({ref:'contract:'+c.id,label:c.supplier+' — '+(c.contractNumber||'no #'),sub:money(c.totalValue),ty:'Contract'}));
  S.pos.forEach(p=>{const c=contractOf(p.contractId);out.push({ref:'po:'+p.id,label:'PO '+(p.poNumber||'?'),sub:c?c.supplier:'',ty:'PO'});});
  S.poLines.forEach(l=>{const p=poOf(l.poId);out.push({ref:'poline:'+l.id,label:'PO '+(p?p.poNumber:'?')+' / line '+(l.lineNo||'?'),sub:money(l.value),ty:'PO line'});});
  S.budget.forEach(b=>out.push({ref:'budget:'+b.id,label:b.what||'(budget line)',sub:b.where||'',ty:'Budget'}));
  S.invoices.forEach(i=>out.push({ref:'invoice:'+i.id,label:'Inv '+(i.invoiceNumber||'?'),sub:money(i.value),ty:'Invoice'}));
  return out;
}
let lpCallback=null;
function linkPicker(cb,excludeRef){ lpCallback=cb;
  modal(`<div class="m-h"><h3>Link to…</h3></div><div class="m-b">
    <input id="lp-q" placeholder="Search tasks, events, contracts, POs, budget lines…" style="width:100%" autocomplete="off">
    <div id="lp-results"></div></div>
    <div class="m-f"><button class="btn" data-act="closeModal">Cancel</button></div>`);
  const draw=q=>{ q=(q||'').toLowerCase();
    const items=allEntities().filter(e=>e.ref!==excludeRef&&(!q||(e.label+' '+e.sub+' '+e.ty).toLowerCase().includes(q))).slice(0,40);
    $('#lp-results').innerHTML=items.map(e=>`<button data-act="lpPick" data-ref="${esc(e.ref)}"><span class="ty">${e.ty}</span><span>${esc(e.label)}</span><span class="sub">${esc(e.sub)}</span></button>`).join('')||'<div class="empty">Nothing found</div>';
  };
  draw(''); $('#lp-q').addEventListener('input',e=>draw(e.target.value)); setTimeout(()=>{const i=$('#lp-q'); if(i) i.focus();},50);
}
function backlinksTo(ref){ const out=[];
  walkTasks(t=>{ if((t.links||[]).includes(ref)) out.push('task:'+t.id); });
  S.events.forEach(e=>{ if((e.links||[]).includes(ref)) out.push('event:'+e.id); });
  const scan=b=>{ if(b.html&&b.html.includes('data-goto="'+ref+'"')) out.push('__status'); (b.children||[]).forEach(scan); };
  S.status.forEach(scan);
  return out;
}
function gotoRef(ref){ const [type,id]=ref.split(':');
  if(ref==='__status'||type==='status'){ setTab('status'); return; }
  const tab={task:'actions',event:'calendar'}[type]||'budget';
  if(type==='event'){ const e=byId(S.events,id); if(e){ S.ui.calDate=e.date; } }
  if(['contract','po','poline','invoice'].includes(type)) S.ui.budgetTab='structure';
  if(type==='budget') S.ui.budgetTab='lines';
  if(type==='task'){ // expand ancestors so it is visible
    const expand=(list,path)=>{ for(const t of list){ if(t.id===id){ path.forEach(a=>a.collapsed=false); return true; } if(t.children&&expand(t.children,[...path,t])) return true; } return false; };
    expand(S.tasks,[]);
  }
  setTab(tab);
  setTimeout(()=>{ const el=document.querySelector(`[data-anchor="${ref}"]`);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    else if(type==='event'){ openEventModal(id); }
  },80);
}
const stateOf=id=>byId(S.settings.taskStates,id)||S.settings.taskStates[0]||{id:'todo',name:'To do',color:'#999',done:false};
const tagOf=id=>byId(S.settings.eventTags,id);

/* ================= modal / toast / delegation ================= */
function modal(html){ const d=$('#modal'); d.innerHTML=html; if(!d.open) d.showModal(); }
function closeModal(){ const d=$('#modal'); if(d.open) d.close(); d.innerHTML=''; }
let toastTimer=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

const ACTIONS={}, FORMS={};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]');
  if(g&&!e.target.closest('.x')){ e.preventDefault(); gotoRef(g.dataset.goto); return; }
  const t=e.target.closest('[data-act]');
  if(t){ const fn=ACTIONS[t.dataset.act]; if(fn){ e.preventDefault(); fn(t,e); } return; }
  const tb=e.target.closest('#tabs button');
  if(tb) setTab(tb.dataset.tab);
});
document.addEventListener('change',e=>{
  const b=e.target.closest('[data-bind]'); if(b){ handleBind(b); return; }
  const f=e.target.closest('[data-fc]'); if(f){ handleForecastCell(f); return; }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]'); if(f){ e.preventDefault(); const fn=FORMS[f.dataset.form]; if(fn) fn(f); }
});
$('#progName').addEventListener('blur',()=>{ S.programme.name=$('#progName').textContent.trim()||S.programme.name; $('#progName').textContent=S.programme.name; document.title=S.programme.name+' — Programme Manager'; save(); });
$('#progName').addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();e.target.blur();} });

/* data-bind="collection.id.field" (collections) or "path.field" for S.programme etc */
function handleBind(el){
  const parts=el.dataset.bind.split('.');
  const type=el.dataset.type||'text';
  let val=el.value;
  if(type==='num') val=parseNum(val);
  if(el.type==='checkbox') val=el.checked;
  if(parts[0]==='programme'||parts[0]==='fcCfg'||parts[0]==='ui'){ S[parts[0]][parts[1]]= (type==='num'?parseNum(val):val); }
  else{
    const coll=S[parts[0]]; const item=byId(coll,parts[1]);
    if(!item) return;
    item[parts[2]]=val;
    if(parts[0]==='budget'){ // trickle-down resets
      if(parts[2]==='contractId'){ item.poId=''; item.poLineId=''; }
      if(parts[2]==='poId'){ item.poLineId=''; }
    }
  }
  save();
  const norerender=el.dataset.norerender;
  if(!norerender) render();
}
ACTIONS.closeModal=()=>closeModal();
ACTIONS.openKey=t=>openKey(t.dataset.key);
ACTIONS.lpPick=t=>{ const cb=lpCallback; lpCallback=null; closeModal(); if(cb) cb(t.dataset.ref); };

  const tg=S.settings.eventTags.map(s=>`<div class="settings-row">
      <input type="color" value="${esc(s.color)}" onchange="updTag('${s.id}','color',this.value)">
      <input value="${esc(s.name)}" onchange="updTag('${s.id}','name',this.value)" style="flex:1">
      <button class="btn sm ghost danger" onclick="delTag('${s.id}')">✕</button></div>`).join('');
  modal(`<div class="m-h"><h3>Settings</h3></div><div class="m-b">
    <label class="f" style="max-width:180px"><span>Currency symbol</span><input value="${esc(S.programme.currency)}" data-bind="programme.currency" data-norerender="1"></label>

    <h3 style="margin:18px 0 8px">Data</h3>
    <div class="small muted">Autosaves to this browser. Use 💾 Save for a portable .json file (also readable by AI tools).</div>
    <button class="btn sm danger" style="margin-top:8px" data-act="deleteProgramme">Delete this programme from this browser</button>
  </div><div class="m-f"><button class="btn primary" data-act="closeModal">Done</button></div>`);
};
window.updState=(id,k,v)=>{ const s=byId(S.settings.taskStates,id); if(s){s[k]=v;save();render();} };
window.delState=id=>{ if(S.settings.taskStates.length<=1) return toast('Keep at least one state');
  S.settings.taskStates=S.settings.taskStates.filter(s=>s.id!==id); save(); ACTIONS.settings(); render(); };
window.addState=()=>{ S.settings.taskStates.push({id:uid(),name:'New state',color:'#5b6b7a',done:false}); save(); ACTIONS.settings(); };
window.updTag=(id,k,v)=>{ const s=tagOf(id); if(s){s[k]=v;save();render();} };
window.delTag=id=>{ S.settings.eventTags=S.settings.eventTags.filter(s=>s.id!==id); save(); ACTIONS.settings(); render(); };
window.addTag=()=>{ S.settings.eventTags.push({id:uid(),name:'New tag',color:'#b06a3b'}); save(); ACTIONS.settings(); };
ACTIONS.deleteProgramme=()=>{
  if(!confirm('Delete "'+S.programme.name+'" from this browser? A saved .json file is unaffected.')) return;
  localStorage.removeItem(lsKey); localStorage.removeItem('progapp:last'); closeModal(); location.reload();
};

/* ================= BUDGET ================= */
const BUDGET_COLS=[
  {k:'what',label:'For what'},{k:'where',label:'Where'},{k:'supplier',label:'Supplier'},
  {k:'contract',label:'Contract #'},{k:'po',label:'PO #'},{k:'line',label:'PO line'},
  {k:'orig',label:'Original budget',num:1},{k:'vars',label:'Variations',num:1},
  {k:'current',label:'Current value',num:1},{k:'end',label:'Contract end'},
  {k:'actuals',label:'Actuals',num:1},{k:'remaining',label:'Remaining',num:1},{k:'notes',label:'Notes'},
];
const VIEW_TEMPLATES=[
  {id:'full',name:'Full detail',cols:BUDGET_COLS.map(c=>c.k),groupBy:'',filter:''},
  {id:'financial',name:'Financial summary',cols:['what','supplier','orig','vars','current','actuals','remaining'],groupBy:'',filter:''},
  {id:'bysupplier',name:'By supplier',cols:['what','where','contract','po','current','actuals','remaining'],groupBy:'supplier',filter:''},
  {id:'bywhere',name:'By location',cols:['what','supplier','current','actuals','remaining','notes'],groupBy:'where',filter:''},
  {id:'contractreg',name:'Contract register',cols:['supplier','contract','po','line','current','end','actuals'],groupBy:'contract',filter:''},
];
function activeView(){ return VIEW_TEMPLATES.find(v=>v.id===S.ui.view)||byId(S.views,S.ui.view)||VIEW_TEMPLATES[0]; }

function renderBudget(v){
  const sub=S.ui.budgetTab||'lines';
  v.innerHTML=`<div class="toolbar">
    <div class="subtabs">
      <button data-act="budgetSub" data-sub="lines" class="${sub==='lines'?'on':''}">Budget lines</button>
      <button data-act="budgetSub" data-sub="structure" class="${sub==='structure'?'on':''}">Contracts · POs · Lines</button>
      <button data-act="budgetSub" data-sub="forecast" class="${sub==='forecast'?'on':''}">Forecast &amp; phasing</button>
    </div><div class="sp"></div><div id="budget-tools"></div></div><div id="budget-body"></div>`;
  if(sub==='lines') renderBudgetLines();
  else if(sub==='structure') renderStructure();
  else renderForecast();
}
ACTIONS.budgetSub=t=>{ S.ui.budgetTab=t.dataset.sub; save(); render(); };

/* ----- budget lines table ----- */
function renderBudgetLines(){
  const view=activeView();
  $('#budget-tools').innerHTML=`
    <select data-act="none" id="viewSel" title="View">
      ${VIEW_TEMPLATES.map(t=>`<option value="${t.id}" ${view.id===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}
      ${S.views.length?'<optgroup label="Custom views">'+S.views.map(t=>`<option value="${t.id}" ${view.id===t.id?'selected':''}>${esc(t.name)}</option>`).join('')+'</optgroup>':''}
    </select>
    <button class="btn sm" data-act="customView">✎ Custom view</button>
    <button class="btn sm primary" data-act="addBudgetRow">+ Budget line</button>`;
  $('#viewSel').onchange=e=>{ S.ui.view=e.target.value; save(); render(); };

  const cols=BUDGET_COLS.filter(c=>view.cols.includes(c.k));
  let rows=S.budget.map(r=>({r,d:rowCalc(r)}));
  if(view.filter){ const q=view.filter.toLowerCase();
    rows=rows.filter(({r,d})=>[r.what,r.where,d.supplier,d.contractNo,d.poNo,r.notes].join(' ').toLowerCase().includes(q)); }
  const groups={};
  const gkey=({r,d})=>{ if(!view.groupBy) return ''; if(view.groupBy==='supplier') return d.supplier||'(no supplier)';
    if(view.groupBy==='where') return r.where||'(no location)'; if(view.groupBy==='contract') return d.contractNo?d.supplier+' — '+d.contractNo:'(no contract)'; return ''; };
  rows.forEach(x=>{ const k=gkey(x); (groups[k]=groups[k]||[]).push(x); });

  const cell=(r,d,c)=>{
    switch(c.k){
      case 'what': return `<td><input data-bind="budget.${r.id}.what" value="${esc(r.what)}" placeholder="What is this for?"></td>`;
      case 'where': return `<td><input data-bind="budget.${r.id}.where" value="${esc(r.where)}" placeholder="Where"></td>`;
      case 'supplier': return r.contractId?`<td class="nowrap">${esc(d.supplier)}</td>`:`<td><input data-bind="budget.${r.id}.supplier" value="${esc(r.supplier||'')}" placeholder="Supplier"></td>`;
      case 'contract': return `<td><select data-bind="budget.${r.id}.contractId"><option value="">—</option>${S.contracts.map(c2=>`<option value="${c2.id}" ${r.contractId===c2.id?'selected':''}>${esc((c2.contractNumber||'no #')+' · '+c2.supplier)}</option>`).join('')}</select></td>`;
      case 'po': return `<td><select data-bind="budget.${r.id}.poId" ${r.contractId?'':'disabled'}><option value="">—</option>${posOfContract(r.contractId).map(p=>`<option value="${p.id}" ${r.poId===p.id?'selected':''}>${esc(p.poNumber||'?')}</option>`).join('')}</select></td>`;
      case 'line': return `<td><select data-bind="budget.${r.id}.poLineId" ${r.poId?'':'disabled'}><option value="">—</option>${linesOfPO(r.poId).map(l=>`<option value="${l.id}" ${r.poLineId===l.id?'selected':''}>${esc(l.lineNo||'?')} · ${money(l.value)}</option>`).join('')}</select></td>`;
      case 'orig': return `<td><input class="num" data-bind="budget.${r.id}.orig" data-type="num" value="${r.orig?fmt(r.orig):''}"></td>`;
      case 'vars': return `<td class="num"><a href="#" class="nowrap" data-act="variations" data-id="${r.id}" title="Manage variations">${d.vars?money(d.vars):'+ add'}</a></td>`;
      case 'current': return `<td class="num nowrap"><b>${money(d.current)}</b></td>`;
      case 'end': return r.contractId?`<td class="nowrap small">${dstr(d.endDate)||'<span class="muted">—</span>'}</td>`:`<td><input type="date" data-bind="budget.${r.id}.endDate" value="${esc(r.endDate||'')}"></td>`;
      case 'actuals': return `<td class="num nowrap">${money(d.actuals)}</td>`;
      case 'remaining': return `<td class="num nowrap ${d.remaining<0?'due-over':''}">${money(d.remaining)}</td>`;
      case 'notes': return `<td><input data-bind="budget.${r.id}.notes" value="${esc(r.notes||'')}" placeholder="…"></td>`;
    } return '<td></td>';
  };
  const sums=list=>{ const t={orig:0,vars:0,current:0,actuals:0,remaining:0};
    list.forEach(({d})=>{t.orig+=d.orig;t.vars+=d.vars;t.current+=d.current;t.actuals+=d.actuals;t.remaining+=d.remaining;}); return t; };
  const sumRow=(t,label,cls)=>`<tr class="${cls}"><td colspan="${Math.max(1,cols.findIndex(c=>c.num)===-1?cols.length:cols.findIndex(c=>c.num))}">${esc(label)}</td>${cols.filter((c,i)=>i>=cols.findIndex(x=>x.num)&&cols.findIndex(x=>x.num)>-1).map(c=>c.num?`<td class="num nowrap">${money(t[c.k]||0)}</td>`:'<td></td>').join('')}<td></td></tr>`;

  let body='';
  for(const [k,list] of Object.entries(groups)){
    if(view.groupBy) body+=`<tr class="grp"><td colspan="${cols.length+1}">${esc(k)} <span class="muted small">· ${list.length} line${list.length>1?'s':''} · ${money(sums(list).current)}</span></td></tr>`;
    body+=list.map(({r,d})=>`<tr data-anchor="budget:${r.id}">${cols.map(c=>cell(r,d,c)).join('')}
      <td class="nowrap"><span class="rowtools" style="display:inline-flex;gap:2px">
        ${backlinksTo('budget:'+r.id).length?`<button class="btn sm ghost" title="Linked items" data-act="showBacklinks" data-ref="budget:${r.id}">↩${backlinksTo('budget:'+r.id).length}</button>`:''}
        <button class="btn sm ghost danger" data-act="delBudgetRow" data-id="${r.id}" title="Delete line">✕</button></span></td></tr>`).join('');
  }
  const tAll=sums(rows);
  body+=rows.length?sumRow(tAll,'Total','tot'):'';
  $('#budget-body').innerHTML= S.budget.length?
    `<div class="tblwrap"><table class="tbl"><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}">${c.label}</th>`).join('')}<th></th></tr></thead><tbody>${body}</tbody></table></div>
     <div class="small muted" style="margin-top:8px">Click any cell to edit. Contract → PO → PO line trickle down; supplier and end date follow the contract.</div>`
    :`<div class="card"><div class="empty">No budget lines yet.<br><br><button class="btn primary" data-act="addBudgetRow">+ Add your first budget line</button></div></div>`;
}

/* ----- forecast & phasing ----- */
function periodList(){ const cfg=S.fcCfg; const out=[];
  let [y,m]=cfg.start.split('-').map(Number);
  const step=cfg.gran==='quarter'?3:1;
  if(cfg.gran==='quarter') m=m-((m-1)%3); // snap to quarter start
  for(let i=0;i<cfg.count;i++){
    const from=new Date(y,m-1,1), to=new Date(y,m-1+step,0);
    const key=cfg.gran==='quarter'?`${y}-Q${Math.floor((m-1)/3)+1}`:`${y}-${String(m).padStart(2,'0')}`;
    const label=cfg.gran==='quarter'?`Q${Math.floor((m-1)/3)+1} ${y}`:from.toLocaleDateString('en-NZ',{month:'short',year:'2-digit'});
    out.push({key,label,from,to});
    m+=step; while(m>12){m-=12;y++;}
  }
  return out;
}
const dateInPeriod=(ds,p)=>{ if(!ds) return false; const d=new Date(ds+'T00:00'); return d>=p.from&&d<=p.to; };
function actualsForRow(r,p){ // invoices for the row's PO line(s) in period p
  const lineIds=r.poLineId?[r.poLineId]:(r.poId?linesOfPO(r.poId).map(l=>l.id):[]);
  return S.invoices.filter(i=>lineIds.includes(i.poLineId)&&dateInPeriod(i.date,p)).reduce((s,i)=>s+parseNum(i.value),0);
}
function fcComputed(r,d,key){ const f=S.forecast[r.id+'|'+key]; if(!f) return 0;
  return f.mode==='pct'? (d.current-d.actuals)*f.v/100 : f.v; }

function renderForecast(){
  const cfg=S.fcCfg, ps=periodList();
  $('#budget-tools').innerHTML=`
    <select data-bind="fcCfg.gran"><option value="month" ${cfg.gran==='month'?'selected':''}>Monthly</option><option value="quarter" ${cfg.gran==='quarter'?'selected':''}>Quarterly</option></select>
    <input type="month" data-bind="fcCfg.start" value="${esc(cfg.start)}" title="First period">
    <select data-bind="fcCfg.count" data-type="num">${[4,6,8,12,16,18,24].map(n=>`<option value="${n}" ${cfg.count===n?'selected':''}>${n} periods</option>`).join('')}</select>`;
  if(!S.budget.length){ $('#budget-body').innerHTML=`<div class="card"><div class="empty">Add budget lines first — the forecast phases each budget line across time.</div></div>`; return; }

  const rows=S.budget.map(r=>({r,d:rowCalc(r)}));
  const body=rows.map(({r,d})=>{
    const cells=ps.map(p=>{
      const f=S.forecast[r.id+'|'+p.key];
      const val=fcComputed(r,d,p.key), act=actualsForRow(r,p);
      const shown=f? (f.mode==='pct'? f.v+'%' : fmt(f.v)) : '';
      return `<td class="fc-cell"><input data-fc="${r.id}|${p.key}" class="${f&&f.mode==='pct'?'pct':''}" value="${esc(shown)}" placeholder="·" title="${f&&f.mode==='pct'?money(val)+' ('+f.v+'% of remaining)':'Enter a value, or a % of remaining (e.g. 25%)'}">
        <span class="sub">${act?'act '+fmt(act):(f&&f.mode==='pct'?'≈'+fmt(val):'')}</span></td>`;
    }).join('');
    const fcTot=ps.reduce((s,p)=>s+fcComputed(r,d,p.key),0);
    const variance=d.current-d.actuals-fcTot;
    return `<tr data-anchor="budget:${r.id}"><td class="nowrap" style="max-width:220px;overflow:hidden;text-overflow:ellipsis"><b>${esc(r.what||'(untitled)')}</b><br><span class="muted small">${esc(d.supplier)}</span></td>
      <td class="num nowrap">${money(d.current)}</td><td class="num nowrap">${money(d.actuals)}</td>
      ${cells}
      <td class="num nowrap">${money(fcTot)}</td>
      <td class="num nowrap">${Math.abs(variance)<.005?'<span class="badge ok">0</span>':`<span class="badge ${variance>0?'warn':'bad'}" title="${variance>0?'Unphased budget':'Phased above remaining budget'}">${money(variance)}</span>`}</td>
      <td><button class="btn sm ghost" data-act="spreadRow" data-id="${r.id}" title="Spread remaining evenly over empty future periods">↔</button></td></tr>`;
  }).join('');
  const colTot=ps.map(p=>{ const fc=rows.reduce((s,{r,d})=>s+fcComputed(r,d,p.key),0);
    const act=rows.reduce((s,{r})=>s+actualsForRow(r,p),0);
    return `<td class="num nowrap">${fmt(fc)}<br><span class="small muted">act ${fmt(act)}</span></td>`; }).join('');
  const tCur=rows.reduce((s,{d})=>s+d.current,0), tAct=rows.reduce((s,{d})=>s+d.actuals,0);
  const tFc=rows.reduce((s,{r,d})=>s+ps.reduce((x,p)=>x+fcComputed(r,d,p.key),0),0);
  $('#budget-body').innerHTML=`<div class="tblwrap"><table class="tbl">
    <thead><tr><th>Budget line</th><th class="num">Current value</th><th class="num">Actuals to date</th>
    ${ps.map(p=>`<th class="num nowrap">${p.label}</th>`).join('')}<th class="num">Forecast Σ</th><th class="num">Unphased</th><th></th></tr></thead>
    <tbody>${body}<tr class="tot"><td>Total</td><td class="num nowrap">${money(tCur)}</td><td class="num nowrap">${money(tAct)}</td>${colTot}<td class="num nowrap">${money(tFc)}</td><td class="num nowrap">${money(tCur-tAct-tFc)}</td><td></td></tr></tbody></table></div>
    <div class="small muted" style="margin-top:8px">Type a value (<b>5,000</b>) or a percentage of remaining budget (<b>25%</b>) in any cell — percentages account for what has already been spent. “act” shows invoiced actuals falling in that period.</div>`;
}
function handleForecastCell(el){ const [rid,key]=el.dataset.fc.split('|'); const raw=el.value.trim();
  if(!raw){ delete S.forecast[rid+'|'+key]; }
  else if(raw.endsWith('%')){ S.forecast[rid+'|'+key]={mode:'pct',v:parseNum(raw)}; }
  else{ S.forecast[rid+'|'+key]={mode:'val',v:parseNum(raw)}; }
  save(); render();
}
ACTIONS.spreadRow=t=>{ const r=byId(S.budget,t.dataset.id); if(!r) return; const d=rowCalc(r); const ps=periodList();
  const empty=ps.filter(p=>!S.forecast[r.id+'|'+p.key]);
  if(!empty.length) return toast('No empty periods to spread into');
  const already=ps.reduce((s,p)=>s+fcComputed(r,d,p.key),0);
  const per=(d.current-d.actuals-already)/empty.length;
  if(per<=0) return toast('Nothing left to spread');
  empty.forEach(p=>{ S.forecast[r.id+'|'+p.key]={mode:'val',v:Math.round(per*100)/100}; });
  save(); render();
};

/* ================= CALENDAR ================= */
function calDate(){ return new Date((S.ui.calDate||todayStr())+'T00:00'); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function eventsOn(ds){ return S.events.filter(e=>{ if(e.endDate) return ds>=e.date&&ds<=e.endDate; return e.date===ds; })
  .filter(e=>!S.ui.tagFilter||!S.ui.tagFilter.length||(e.tagIds||[]).some(t=>S.ui.tagFilter.includes(t))||!(e.tagIds||[]).length); }
function tasksDue(ds){ const out=[]; walkTasks(t=>{ if(t.due===ds&&!stateOf(t.stateId).done) out.push(t); }); return out; }

function renderCalendar(v){
  const mode=S.ui.calMode||'month', d=calDate();
  const monthName=d.toLocaleDateString('en-NZ',{month:'long',year:'numeric'});
  const weekStart=new Date(d); weekStart.setDate(d.getDate()-((d.getDay()+6)%7)); // Monday
  const title= mode==='month'?monthName : mode==='week'? 'Week of '+weekStart.toLocaleDateString('en-NZ',{day:'numeric',month:'long',year:'numeric'}) : d.toLocaleDateString('en-NZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const tagChips=S.settings.eventTags.map(t=>{ const on=!S.ui.tagFilter||!S.ui.tagFilter.length||S.ui.tagFilter.includes(t.id);
    return `<span class="pill" data-act="toggleTagFilter" data-id="${t.id}" style="background:${on?t.color:'transparent'};color:${on?'#fff':t.color};border-color:${t.color}">${esc(t.name)}</span>`; }).join(' ');
  v.innerHTML=`<div class="toolbar">
    <button class="btn icon" data-act="calNav" data-dir="-1">‹</button>
    <button class="btn icon" data-act="calNav" data-dir="1">›</button>
    <button class="btn sm" data-act="calToday">Today</button>
    <h2 style="margin:0 8px;font-size:20px">${esc(title)}</h2>
    <div class="sp"></div>
    ${tagChips}
    <div class="subtabs" style="margin-left:8px">
      ${['month','week','day'].map(m=>`<button data-act="calMode" data-mode="${m}" class="${mode===m?'on':''}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}
    </div>
    <button class="btn sm primary" data-act="eventModal">+ Event</button></div>
    <div id="cal-body"></div>`;
  if(mode==='month') renderMonth(); else if(mode==='week') renderWeek(weekStart); else renderDay(d);
}
function evPill(e){ const tag=tagOf((e.tagIds||[])[0]); const col=tag?tag.color:'var(--ink-2)';
  return `<div class="ev" data-act="eventModal" data-id="${e.id}" title="${esc(e.title)}"><span class="dot" style="background:${col}"></span><span class="t">${e.time?'<b>'+esc(e.time)+'</b> ':''}${esc(e.title)}</span></div>`; }
function taskPill(t){ return `<div class="ev task" data-goto="task:${t.id}" title="Task due: ${esc(t.name)}"><span>☑</span><span class="t">${esc(t.name)}</span></div>`; }

function renderMonth(){
  const d=calDate(); const first=new Date(d.getFullYear(),d.getMonth(),1);
  const start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  let cells=''; const today=todayStr();
  for(let i=0;i<42;i++){ const day=new Date(start); day.setDate(start.getDate()+i); const ds=iso(day);
    const dim=day.getMonth()!==d.getMonth();
    const evs=eventsOn(ds).map(evPill).join(''), tks=tasksDue(ds).map(taskPill).join('');
    cells+=`<div class="cal-cell ${dim?'dim':''} ${ds===today?'today':''}">
      <span class="dnum" data-act="calGotoDay" data-date="${ds}" style="cursor:pointer" title="Open day view">${day.getDate()}</span>
      <button class="addbtn" data-act="eventModal" data-date="${ds}" title="Add event">+</button>${evs}${tks}</div>`;
  }
  $('#cal-body').innerHTML=`<div class="cal-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>`;
}
function renderWeek(weekStart){
  let cells=''; const today=todayStr();
  for(let i=0;i<7;i++){ const day=new Date(weekStart); day.setDate(weekStart.getDate()+i); const ds=iso(day);
    const evs=eventsOn(ds).map(evPill).join(''), tks=tasksDue(ds).map(taskPill).join('');
    cells+=`<div class="cal-cell ${ds===today?'today':''}" style="min-height:340px">
      <span class="dnum" data-act="calGotoDay" data-date="${ds}" style="cursor:pointer">${day.getDate()}</span>
      <span class="muted small"> ${day.toLocaleDateString('en-NZ',{weekday:'short'})}</span>
      <button class="addbtn" data-act="eventModal" data-date="${ds}">+</button>${evs}${tks}</div>`;
  }
  $('#cal-body').innerHTML=`<div class="cal-grid" style="grid-template-columns:repeat(7,1fr)">${cells}</div>`;
}
function renderDay(d){ const ds=iso(d);
  const evs=eventsOn(ds), tks=tasksDue(ds);
  $('#cal-body').innerHTML=`<div class="card"><div class="card-b cal-list">
    ${evs.length?'<div class="day-h">Events</div>'+evs.map(e=>{
      const tags=(e.tagIds||[]).map(id=>{const t=tagOf(id);return t?`<span class="badge" style="background:${t.color}1a;color:${t.color}">${esc(t.name)}</span>`:'';}).join(' ');
      return `<div style="padding:8px 0;border-bottom:1px solid var(--line-2)" data-anchor="event:${e.id}">
        <div style="display:flex;gap:8px;align-items:center"><b style="cursor:pointer" data-act="eventModal" data-id="${e.id}">${e.time?esc(e.time)+' · ':''}${esc(e.title)}</b>${tags}
        <span class="sp" style="flex:1"></span><button class="btn sm ghost" data-act="eventModal" data-id="${e.id}">edit</button></div>
        ${e.notes?`<div class="small" style="white-space:pre-wrap;margin-top:4px">${esc(e.notes)}</div>`:''}
        ${(e.links||[]).length?`<div style="margin-top:4px">${e.links.map(l=>chipHTML(l)).join(' ')}</div>`:''}</div>`;
    }).join(''):''}
    ${tks.length?'<div class="day-h">Tasks due</div>'+tks.map(t=>`<div style="padding:3px 0">${taskPill(t)}</div>`).join(''):''}
    ${!evs.length&&!tks.length?'<div class="empty">Nothing on this day.<br><br><button class="btn primary" data-act="eventModal" data-date="'+ds+'">+ Add event</button></div>':''}
  </div></div>`;
}
ACTIONS.calNav=t=>{ const d=calDate(); const dir=Number(t.dataset.dir); const mode=S.ui.calMode;
  if(mode==='month') d.setMonth(d.getMonth()+dir); else if(mode==='week') d.setDate(d.getDate()+7*dir); else d.setDate(d.getDate()+dir);
  S.ui.calDate=iso(d); save(); render(); };
ACTIONS.calToday=()=>{ S.ui.calDate=todayStr(); save(); render(); };
ACTIONS.calMode=t=>{ S.ui.calMode=t.dataset.mode; save(); render(); };
ACTIONS.calGotoDay=t=>{ S.ui.calDate=t.dataset.date; S.ui.calMode='day'; save(); render(); };
ACTIONS.toggleTagFilter=t=>{ const id=t.dataset.id; let f=S.ui.tagFilter||[];
  if(!f.length) f=[id]; else if(f.includes(id)){ f=f.filter(x=>x!==id); } else f.push(id);
  if(f.length===S.settings.eventTags.length) f=[];
  S.ui.tagFilter=f; save(); render(); };

let evLinks=[]; // working set for the open event modal
function openEventModal(id,presetDate){ const e=id?byId(S.events,id):null;
  evLinks=e?[...(e.links||[])]:[];
  modal(`<div class="m-h"><h3>${e?'Edit event':'New event'}</h3></div><div class="m-b">
    <form data-form="saveEvent" id="evform">${e?`<input type="hidden" name="id" value="${e.id}">`:''}

      <label class="f"><span>End date (multi-day, optional)</span><input type="date" name="endDate" value="${esc(e?e.endDate||'':'')}"></label>
    </div>
    <span class="small muted">Tags</span>
    <div style="margin:4px 0 10px;display:flex;gap:10px;flex-wrap:wrap">
      ${S.settings.eventTags.map(t=>`<label class="small nowrap"><input type="checkbox" name="tag" value="${t.id}" ${e&&(e.tagIds||[]).includes(t.id)?'checked':''}> <span style="color:${t.color};font-weight:600">${esc(t.name)}</span></label>`).join('')}
    </div>

function drawEvLinks(){ const el=$('#evlinks'); if(el) el.innerHTML=evLinks.map(l=>chipHTML(l,'ev')).join(' ')||'<span class="muted small">None</span>'; }
ACTIONS.eventModal=t=>openEventModal(t&&t.dataset.id,t&&t.dataset.date);
ACTIONS.evAddLink=()=>{ const keep=collectEventForm(); linkPicker(ref=>{ if(!evLinks.includes(ref)) evLinks.push(ref); openEventModal(keep.id,keep.date); restoreEventForm(keep); }); };
function collectEventForm(){ const f=$('#evform'); if(!f) return {};
  return {id:f.id?f.id.value:'',title:f.title.value,date:f.date.value,time:f.time.value,endDate:f.endDate.value,notes:f.notes.value,
    tags:[...f.querySelectorAll('input[name=tag]:checked')].map(i=>i.value)}; }
function restoreEventForm(k){ const f=$('#evform'); if(!f) return;
  f.title.value=k.title||''; f.date.value=k.date||todayStr(); f.time.value=k.time||''; f.endDate.value=k.endDate||''; f.notes.value=k.notes||'';
  f.querySelectorAll('input[name=tag]').forEach(i=>i.checked=(k.tags||[]).includes(i.value)); }
ACTIONS.unlink=t=>{ const ref=t.dataset.ref, ctx=t.dataset.ctx;
  if(ctx==='ev'){ evLinks=evLinks.filter(l=>l!==ref); drawEvLinks(); }
  else if(ctx&&ctx.startsWith('task:')){ const id=ctx.slice(5); walkTasks(x=>{ if(x.id===id) x.links=(x.links||[]).filter(l=>l!==ref); }); save(); render(); }
};
FORMS.saveEvent=f=>{ const id=f.id&&f.id.value;
  const data={title:f.title.value.trim(),date:f.date.value,time:f.time.value,endDate:f.endDate.value,notes:f.notes.value,
    tagIds:[...f.querySelectorAll('input[name=tag]:checked')].map(i=>i.value),links:evLinks};
  if(data.endDate&&data.endDate<data.date) data.endDate='';
  if(id) Object.assign(byId(S.events,id),data); else S.events.push({id:uid(),...data});
  save(); closeModal(); render();
};
ACTIONS.delEvent=t=>{ if(!confirm('Delete this event?')) return; S.events=S.events.filter(e=>e.id!==t.dataset.id); save(); closeModal(); render(); };

/* ================= ACTIONS (tasks) ================= */
function findTask(id,list,parent){ list=list||S.tasks;
  for(let i=0;i<list.length;i++){ const t=list[i];
    if(t.id===id) return {t,list,idx:i,parent:parent||null};
    if(t.children){ const r=findTask(id,t.children,t); if(r) return r; } }
  return null;
}
function newTask(){ return {id:uid(),name:'',due:'',lastActioned:todayStr(),stateId:S.settings.taskStates[0].id,notes:'',links:[],collapsed:false,children:[],showNotes:false}; }
function touch(t){ t.lastActioned=todayStr(); }

function renderTasks(v){
  const hide=S.ui.hideDone;
  v.innerHTML=`<div class="toolbar">
    <button class="btn sm primary" data-act="addTask">+ Task</button>
    <div class="sp"></div>
    <span class="small muted">${countOpenTasks()} open</span>
    <label class="small nowrap" style="margin-left:10px"><input type="checkbox" ${hide?'checked':''} data-act="none" id="hideDone"> hide completed</label>
  </div>
  <div class="card"><div class="card-b task-tree" id="ttree">${S.tasks.length?taskListHTML(S.tasks,hide):'<div class="empty">No tasks yet. Add one — press Enter to add the next, Tab to nest.</div>'}</div></div>
  <div class="small muted" style="margin-top:8px">Enter = new task below · Tab / Shift-Tab = nest / un-nest · click the state pill to cycle · tasks with due dates appear on the calendar.</div>`;
  $('#hideDone').onchange=e=>{ S.ui.hideDone=e.target.checked; save(); render(); };
}
function countOpenTasks(){ let n=0; walkTasks(t=>{ if(!stateOf(t.stateId).done) n++; }); return n; }
function taskListHTML(list,hide){ return list.filter(t=>!hide||!stateOf(t.stateId).done||hasOpenDesc(t)).map(t=>taskHTML(t,hide)).join(''); }
function hasOpenDesc(t){ let open=false; walkTasks(x=>{ if(!stateOf(x.stateId).done) open=true; },t.children||[]); return open; }
function taskHTML(t,hide){
  const st=stateOf(t.stateId); const kids=(t.children||[]);
  const today=todayStr();
  const dueCls=t.due&&!st.done?(t.due<today?'due-over':(t.due<=addDays(today,3)?'due-soon':'')):'';
  return `<div data-tid="${t.id}">
    <div class="task-row ${st.done?'done':''}" data-anchor="task:${t.id}">
      <span class="caret ${kids.length?'':'empty'}" data-act="tglTask" data-id="${t.id}">${t.collapsed?'▶':'▼'}</span>
      <span class="pill" data-act="cycleState" data-id="${t.id}" style="background:${st.color}1c;color:${st.color};border-color:${st.color}55" title="Click to change state">${esc(st.name)}</span>
      <input class="tname" value="${esc(t.name)}" placeholder="Task…" data-tname="${t.id}">
      <span class="tlinks">${(t.links||[]).map(l=>chipHTML(l,'task:'+t.id)).join('')}</span>
      <span class="meta">
        <span class="rowtools">
          <button class="btn sm ghost" data-act="taskLink" data-id="${t.id}" title="Link to contract / PO / event / budget…">🔗</button>
          <button class="btn sm ghost" data-act="taskNotes" data-id="${t.id}" title="Notes">🗒</button>
          <button class="btn sm ghost" data-act="addSub" data-id="${t.id}" title="Add sub-task">＋</button>
          <button class="btn sm ghost" data-act="outdentTask" data-id="${t.id}" title="Un-nest">⇤</button>
          <button class="btn sm ghost" data-act="indentTask" data-id="${t.id}" title="Nest under task above">⇥</button>
          <button class="btn sm ghost danger" data-act="delTask" data-id="${t.id}" title="Delete">✕</button>
        </span>
        <input type="date" class="${dueCls}" value="${esc(t.due||'')}" data-tdue="${t.id}" title="Due date">
        <span class="small muted nowrap" title="Last actioned">↻ ${t.lastActioned?dstr(t.lastActioned):'—'}</span>
      </span>
    </div>
    ${t.showNotes?`<div class="task-notes"><textarea data-tnotes="${t.id}" placeholder="Notes…">${esc(t.notes||'')}</textarea></div>`:''}
    ${kids.length&&!t.collapsed?`<div class="task-kids">${taskListHTML(kids,hide)}</div>`:''}
  </div>`;
}
function addDays(ds,n){ const d=new Date(ds+'T00:00'); d.setDate(d.getDate()+n); return iso(d); }

ACTIONS.addTask=()=>{ const t=newTask(); S.tasks.push(t); save(); render(); focusTask(t.id); };
ACTIONS.addSub=el=>{ const r=findTask(el.dataset.id); if(!r) return; r.t.children=r.t.children||[]; const t=newTask(); r.t.children.push(t); r.t.collapsed=false; touch(r.t); save(); render(); focusTask(t.id); };
ACTIONS.tglTask=el=>{ const r=findTask(el.dataset.id); if(r){ r.t.collapsed=!r.t.collapsed; save(); render(); } };
ACTIONS.cycleState=el=>{ const r=findTask(el.dataset.id); if(!r) return;
  const states=S.settings.taskStates; const i=states.findIndex(s=>s.id===r.t.stateId);
  r.t.stateId=states[(i+1)%states.length].id; touch(r.t); save(); render(); };
ACTIONS.delTask=el=>{ const r=findTask(el.dataset.id); if(!r) return;
  const n=(r.t.children||[]).length; if((r.t.name||n)&&!confirm('Delete this task'+(n?' and its '+n+' sub-task(s)':'')+'?')) return;
  r.list.splice(r.idx,1); save(); render(); };
ACTIONS.indentTask=el=>{ const r=findTask(el.dataset.id); if(!r||r.idx===0) return toast('Nothing above to nest under');
  const prev=r.list[r.idx-1]; r.list.splice(r.idx,1); prev.children=prev.children||[]; prev.children.push(r.t); prev.collapsed=false; save(); render(); focusTask(r.t.id); };
ACTIONS.outdentTask=el=>{ const r=findTask(el.dataset.id); if(!r||!r.parent) return;
  const pr=findTask(r.parent.id); r.list.splice(r.idx,1); pr.list.splice(pr.idx+1,0,r.t); save(); render(); focusTask(r.t.id); };
ACTIONS.taskNotes=el=>{ const r=findTask(el.dataset.id); if(r){ r.t.showNotes=!r.t.showNotes; save(); render(); } };
ACTIONS.taskLink=el=>{ const id=el.dataset.id;
  linkPicker(ref=>{ const r=findTask(id); if(r){ r.t.links=r.t.links||[]; if(!r.t.links.includes(ref)) r.t.links.push(ref); touch(r.t); save(); render(); } },'task:'+id); };
function focusTask(id){ setTimeout(()=>{ const i=document.querySelector(`[data-tname="${id}"]`); if(i){ i.focus(); } },40); }

/* task field editing via delegation */
document.addEventListener('change',e=>{
  const n=e.target.closest('[data-tname]'); if(n){ const r=findTask(n.dataset.tname); if(r){ r.t.name=n.value; touch(r.t); save(); } return; }
  const d=e.target.closest('[data-tdue]'); if(d){ const r=findTask(d.dataset.tdue); if(r){ r.t.due=d.value; touch(r.t); save(); render(); } return; }
  const x=e.target.closest('[data-tnotes]'); if(x){ const r=findTask(x.dataset.tnotes); if(r){ r.t.notes=x.value; touch(r.t); save(); } return; }
});
document.addEventListener('keydown',e=>{
  const n=e.target.closest&&e.target.closest('[data-tname]'); if(!n) return;
  const id=n.dataset.tname;
  if(e.key==='Enter'){ e.preventDefault(); const r=findTask(id); if(!r) return; r.t.name=n.value; touch(r.t);
    const t=newTask(); r.list.splice(r.idx+1,0,t); save(); render(); focusTask(t.id); }
  else if(e.key==='Tab'){ e.preventDefault(); const r=findTask(id); if(!r) return; r.t.name=n.value;
    if(e.shiftKey) ACTIONS.outdentTask({dataset:{id}}); else ACTIONS.indentTask({dataset:{id}}); }
});

/* ================= STATUS (block note editor) ================= */
function findBlock(id,list,parent){ list=list||S.status;
  for(let i=0;i<list.length;i++){ const b=list[i];
    if(b.id===id) return {b,list,idx:i,parent:parent||null};
    if(b.children){ const r=findBlock(id,b.children,b); if(r) return r; } }
  return null;
}
function newBlock(type){ const b={id:uid(),type:type||'p',html:''};
  if(type==='toggle'){ b.open=true; b.children=[{id:uid(),type:'p',html:''}]; }
  if(type==='table'){ b.rows=[['Column','Column'],['','']]; }
  return b;
}
const BLOCK_PH={p:'Type “/” for headings, bullets, toggles, tables, links…',h1:'Heading 1',h2:'Heading 2',h3:'Heading 3',bullet:'List item',callout:'Callout',toggle:'Toggle heading'};

  if(b.type==='table'){
