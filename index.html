    return `<div class="blk t-table" data-blk="${b.id}">${handle}<table class="ntbl"><tbody>${rows}</tbody></table>
      <div class="tbl-tools"><button class="btn sm ghost" data-act="tblRow" data-id="${b.id}">+ row</button>
      <button class="btn sm ghost" data-act="tblCol" data-id="${b.id}">+ column</button>
      <button class="btn sm ghost" data-act="tblDelRow" data-id="${b.id}">− row</button>
      <button class="btn sm ghost" data-act="tblDelCol" data-id="${b.id}">− column</button></div></div>`;
  }
  if(b.type==='toggle'){
    return `<div class="blk t-toggle" data-blk="${b.id}">${handle}
      <div class="tg-head"><span class="tgc" data-act="tglBlock" data-id="${b.id}">${b.open?'▼':'▶'}</span>
      <div class="bc" contenteditable="true" data-bid="${b.id}" data-ph="Toggle heading">${b.html}</div></div>
      ${b.open?`<div class="tg-kids">${(b.children||[]).map(blockHTML).join('')}
        <div class="small muted" style="padding:2px 6px;cursor:pointer" data-act="addChildBlock" data-id="${b.id}">+ add inside</div></div>`:''}</div>`;
  }
  return `<div class="blk t-${b.type}" data-blk="${b.id}">${handle}<div class="bc" contenteditable="true" data-bid="${b.id}" data-ph="${BLOCK_PH[b.type]||''}">${b.html}</div></div>`;
}
function renderStatus(v){
  v.innerHTML=`<div class="doc" id="doc">${S.status.map(blockHTML).join('')}
    <div class="blk"><div class="bc muted small" data-act="addBlockEnd" style="cursor:text;padding-top:10px">+ Click to add a block — press “/” inside any block for headings, toggles, tables and links</div></div></div>`;
}
function focusBlock(id,toEnd){ setTimeout(()=>{ const el=document.querySelector(`.bc[data-bid="${id}"]`); if(!el) return; el.focus();
  if(toEnd){ const r=document.createRange(); r.selectNodeContents(el); r.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } },40); }

ACTIONS.addBlockEnd=()=>{ const b=newBlock('p'); S.status.push(b); save(); render(); focusBlock(b.id); };
ACTIONS.addChildBlock=t=>{ const r=findBlock(t.dataset.id); if(!r) return; r.b.children=r.b.children||[]; const b=newBlock('p'); r.b.children.push(b); save(); render(); focusBlock(b.id); };
ACTIONS.tglBlock=t=>{ const r=findBlock(t.dataset.id); if(r){ r.b.open=!r.b.open; save(); render(); } };
ACTIONS.tblRow=t=>{ const r=findBlock(t.dataset.id); if(r){ r.b.rows.push(r.b.rows[0].map(()=>'')); save(); render(); } };
ACTIONS.tblCol=t=>{ const r=findBlock(t.dataset.id); if(r){ r.b.rows.forEach(row=>row.push('')); save(); render(); } };
ACTIONS.tblDelRow=t=>{ const r=findBlock(t.dataset.id); if(r&&r.b.rows.length>1){ r.b.rows.pop(); save(); render(); } };
ACTIONS.tblDelCol=t=>{ const r=findBlock(t.dataset.id); if(r&&r.b.rows[0].length>1){ r.b.rows.forEach(row=>row.pop()); save(); render(); } };

ACTIONS.blockMenu=t=>{ const id=t.dataset.id; const r=findBlock(id); if(!r) return;
  const types=[['p','Text'],['h1','Heading 1'],['h2','Heading 2'],['h3','Heading 3'],['bullet','Bullet'],['callout','Callout'],['toggle','Toggle']];
  modal(`<div class="m-h"><h3>Block</h3></div><div class="m-b">
    <div class="small muted" style="margin-bottom:6px">Turn into</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${types.map(([ty,lb])=>`<button class="btn sm ${r.b.type===ty?'primary':''}" data-act="blockType" data-id="${id}" data-type="${ty}">${lb}</button>`).join('')}
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn sm" data-act="blockMove" data-id="${id}" data-dir="-1">↑ Move up</button>
      <button class="btn sm" data-act="blockMove" data-id="${id}" data-dir="1">↓ Move down</button>
      <button class="btn sm danger" data-act="blockDel" data-id="${id}" style="margin-left:auto">Delete block</button>
    </div></div>`);
};
ACTIONS.blockType=t=>{ const r=findBlock(t.dataset.id); if(!r) return; const ty=t.dataset.type;
  if(ty==='toggle'&&r.b.type!=='toggle'){ r.b.open=true; r.b.children=r.b.children||[newBlock('p')]; }
  r.b.type=ty; save(); closeModal(); render(); };
ACTIONS.blockMove=t=>{ const r=findBlock(t.dataset.id); if(!r) return; const ni=r.idx+Number(t.dataset.dir);
  if(ni<0||ni>=r.list.length) return; r.list.splice(r.idx,1); r.list.splice(ni,0,r.b); save(); closeModal(); render(); };
ACTIONS.blockDel=t=>{ const r=findBlock(t.dataset.id); if(!r) return; r.list.splice(r.idx,1);
  if(!S.status.length) S.status.push(newBlock('p')); save(); closeModal(); render(); };

/* typing in blocks */
let bSaveTimer=null;
document.addEventListener('input',e=>{
  const bc=e.target.closest&&e.target.closest('.bc[data-bid]'); if(!bc) return;
  const r=findBlock(bc.dataset.bid); if(!r) return;
  r.b.html=bc.innerHTML;
  clearTimeout(bSaveTimer); bSaveTimer=setTimeout(save,400);
  maybeSlashMenu(bc,r);
});
document.addEventListener('focusout',e=>{
  const td=e.target.closest&&e.target.closest('[data-tcell]'); if(!td) return;
  const r=findBlock(td.dataset.tcell); if(!r) return;
  r.b.rows[Number(td.dataset.r)][Number(td.dataset.c)]=td.innerHTML; save();
});
document.addEventListener('keydown',e=>{
  const bc=e.target.closest&&e.target.closest('.bc[data-bid]'); if(!bc) return;
  const r=findBlock(bc.dataset.bid); if(!r) return;
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); hideSlash();
    r.b.html=bc.innerHTML;
    const nb=newBlock(r.b.type==='bullet'?'bullet':'p');
    r.list.splice(r.idx+1,0,nb); save(); render(); focusBlock(nb.id); }
  else if(e.key==='Backspace'&&bc.textContent.trim()===''&&!bc.querySelector('.chip')){
    if(r.list.length>1||r.parent){ e.preventDefault(); hideSlash();
      const prev=r.list[r.idx-1]; r.list.splice(r.idx,1); save(); render();
      if(prev&&prev.html!==undefined) focusBlock(prev.id,true); } }
  else if(e.key==='Escape') hideSlash();
});
/* slash menu */
const SLASH_ITEMS=[
  ['p','¶','Text'],['h1','H1','Heading 1'],['h2','H2','Heading 2'],['h3','H3','Heading 3'],
  ['bullet','•','Bulleted list'],['toggle','▸','Toggle (collapsible)'],['callout','▢','Callout'],
  ['table','⊞','Table'],['divider','—','Divider'],['link','🔗','Link to item…'],
];
let slashFor=null;
function maybeSlashMenu(bc,r){
  const txt=bc.textContent;
  if(txt.startsWith('/')){ const q=txt.slice(1).toLowerCase(); slashFor=r.b.id;
    const items=SLASH_ITEMS.filter(([ty,ic,lb])=>!q||lb.toLowerCase().includes(q));
    if(!items.length){ hideSlash(); return; }
    const m=$('#slashmenu'); m.innerHTML=items.map(([ty,ic,lb])=>`<button data-act="slashPick" data-type="${ty}"><span class="ic">${ic}</span>${lb}</button>`).join('');
    const rect=bc.getBoundingClientRect();
    m.style.left=(rect.left+window.scrollX)+'px'; m.style.top=(rect.bottom+window.scrollY+4)+'px'; m.style.display='block';
  } else hideSlash();
}
function hideSlash(){ $('#slashmenu').style.display='none'; slashFor=null; }
document.addEventListener('click',e=>{ if(!e.target.closest('#slashmenu')&&!e.target.closest('.bc')) hideSlash(); });
ACTIONS.slashPick=t=>{ const ty=t.dataset.type; const r=slashFor&&findBlock(slashFor); hideSlash(); if(!r) return;
  r.b.html='';
  if(ty==='link'){ linkPicker(ref=>{ const r2=findBlock(r.b.id); if(r2){ r2.b.html+=' '+chipHTML(ref)+'&nbsp;'; save(); render(); focusBlock(r2.b.id,true); } }); save(); render(); return; }
  if(ty==='toggle'){ r.b.type='toggle'; r.b.open=true; r.b.children=r.b.children||[newBlock('p')]; }
  else if(ty==='table'){ const nb=newBlock('table'); r.list.splice(r.idx,1,nb); save(); render(); return; }
  else if(ty==='divider'){ const nb=newBlock('divider'); r.list.splice(r.idx,0,nb); r.b.type='p'; }
  else r.b.type=ty;
  save(); render(); focusBlock(r.b.id);
};

/* ================= EXPORT: Excel / Markdown / JSON ================= */
function download(filename,content,mime){ const blob=new Blob([content],{type:mime});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
const escXml=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function htmlToText(html){ const d=document.createElement('div'); d.innerHTML=html||'';
  d.querySelectorAll('.chip').forEach(c=>{ c.replaceWith('['+c.textContent.replace(/×$/,'').trim()+']'); });
  return d.textContent.replace(/ /g,' ').trim(); }

/* --- Excel (SpreadsheetML — opens directly in Excel as .xls) --- */
function xCell(v,head){ const st=head?' ss:StyleID="h"':'';
  if(typeof v==='number'&&isFinite(v)) return `<Cell${st}><Data ss:Type="Number">${v}</Data></Cell>`;
  return `<Cell${st}><Data ss:Type="String">${escXml(v)}</Data></Cell>`; }
function xSheet(name,rows){ // rows[0] is the header row
  const body=rows.map((r,i)=>`<Row>${r.map(c=>xCell(c,i===0)).join('')}</Row>`).join('\n');
  return `<Worksheet ss:Name="${escXml(name.slice(0,31))}"><Table>${body}</Table></Worksheet>`; }
ACTIONS.exportExcel=()=>{
  const ps=periodList();
  const sheets=[
    xSheet('Budget',[['For what','Where','Supplier','Contract #','PO #','PO line','Original budget','Variations','Current value','Contract end','Actuals','Remaining','Notes'],
      ...S.budget.map(r=>{const d=rowCalc(r);return [r.what,r.where,d.supplier,d.contractNo,d.poNo,d.lineNo,d.orig,d.vars,d.current,d.endDate,d.actuals,d.remaining,r.notes||''];})]),
    xSheet('Contracts',[['Supplier','Supplier #','Contract #','Total value','Start','End','Sum of PO lines','Unallocated','Notes'],
      ...S.contracts.map(c=>[c.supplier,c.supplierNumber,c.contractNumber,parseNum(c.totalValue),c.startDate||'',c.endDate||'',contractLinesSum(c.id),parseNum(c.totalValue)-contractLinesSum(c.id),c.notes||''])]),
    xSheet('POs',[['PO number','Contract #','Supplier','Description','Sum of lines'],
      ...S.pos.map(p=>{const c=contractOf(p.contractId)||{};return [p.poNumber,c.contractNumber||'',c.supplier||'',p.description||'',linesOfPO(p.id).reduce((s,l)=>s+parseNum(l.value),0)];})]),
    xSheet('PO Lines',[['PO number','Line','Description','WBS element','Spend code','GL code','Value','Invoiced','Remaining'],
      ...S.poLines.map(l=>{const p=poOf(l.poId)||{};return [p.poNumber||'',l.lineNo,l.description||'',l.wbs||'',l.spendCode||'',l.glCode||'',parseNum(l.value),lineInvoiced(l.id),parseNum(l.value)-lineInvoiced(l.id)];})]),
    xSheet('Invoices',[['Invoice #','PO number','PO line','Value','Date','For','Notes'],
      ...S.invoices.map(i=>{const l=lineOf(i.poLineId)||{};const p=poOf(l.poId)||{};return [i.invoiceNumber,p.poNumber||'',l.lineNo||'',parseNum(i.value),i.date||'',i.forWhat||'',i.notes||''];})]),
    xSheet('Forecast',[['Budget line','Supplier','Current value','Actuals to date',...ps.map(p=>p.label+' forecast'),...ps.map(p=>p.label+' actual')],
      ...S.budget.map(r=>{const d=rowCalc(r);return [r.what,d.supplier,d.current,d.actuals,...ps.map(p=>fcComputed(r,d,p.key)),...ps.map(p=>actualsForRow(r,p))];})]),
    xSheet('Actions',(()=>{const rows=[['Task','Level','State','Due','Last actioned','Links','Notes']];
      walkTasks((t,depth)=>rows.push(['  '.repeat(depth)+(t.name||''),depth,stateOf(t.stateId).name,t.due||'',t.lastActioned||'',(t.links||[]).map(l=>refLabel(...l.split(':'))).join('; '),t.notes||''])); return rows;})()),
    xSheet('Calendar',[['Date','End date','Time','Title','Tags','Notes','Links'],
      ...[...S.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,e.endDate||'',e.time||'',e.title,(e.tagIds||[]).map(id=>(tagOf(id)||{}).name).filter(Boolean).join(', '),e.notes||'',(e.links||[]).map(l=>refLabel(...l.split(':'))).join('; ')])]),
    xSheet('Status',(()=>{const rows=[['Type','Content']];
      const emit=(b,depth)=>{ if(b.type==='table'){ (b.rows||[]).forEach(r=>rows.push(['table',r.map(htmlToText).join(' | ')])); }
        else if(b.type!=='divider') rows.push([b.type,'  '.repeat(depth)+htmlToText(b.html)]);
        (b.children||[]).forEach(c=>emit(c,depth+1)); };
      S.status.forEach(b=>emit(b,0)); return rows;})()),
  ].join('\n');
  const xml=`<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#EFECE4" ss:Pattern="Solid"/></Style></Styles>
${sheets}
</Workbook>`;
  download(slug(S.programme.name)+'-'+todayStr()+'.xls',xml,'application/vnd.ms-excel');
  toast('Excel workbook exported');
};

/* --- Markdown snapshot (AI-friendly) --- */
function mdTable(head,rows){ if(!rows.length) return '_None._\n';
  const line=r=>'| '+r.map(c=>String(c??'').replace(/\|/g,'\\|').replace(/\n/g,' ')).join(' | ')+' |';
  return [line(head),'|'+head.map(()=>'---').join('|')+'|',...rows.map(line)].join('\n')+'\n'; }
ACTIONS.exportMD=()=>{
  const ps=periodList(); let md=`# ${S.programme.name} — programme snapshot\n\nExported ${todayStr()}.\n\n`;
  md+=`## Budget lines\n\n`+mdTable(['For what','Where','Supplier','Contract #','PO #','PO line','Original','Variations','Current value','End date','Actuals','Remaining','Notes'],
    S.budget.map(r=>{const d=rowCalc(r);return [r.what,r.where,d.supplier,d.contractNo,d.poNo,d.lineNo,fmt(d.orig),fmt(d.vars),fmt(d.current),d.endDate,fmt(d.actuals),fmt(d.remaining),r.notes||''];}));
  md+=`\n## Contracts\n\n`;
  if(!S.contracts.length) md+='_None._\n';
  S.contracts.forEach(c=>{
    md+=`### ${c.supplier} — contract ${c.contractNumber||'(no number)'}\n- Supplier number: ${c.supplierNumber||'—'}\n- Total value: ${money(c.totalValue)}\n- Term: ${c.startDate||'?'} → ${c.endDate||'?'}\n- PO lines allocated: ${money(contractLinesSum(c.id))}${c.notes?'\n- Notes: '+c.notes:''}\n\n`;
    posOfContract(c.id).forEach(p=>{
      md+=`**PO ${p.poNumber}** ${p.description||''}\n\n`+mdTable(['Line','Description','WBS','Spend code','GL code','Value','Invoiced'],
        linesOfPO(p.id).map(l=>[l.lineNo,l.description||'',l.wbs||'',l.spendCode||'',l.glCode||'',fmt(l.value),fmt(lineInvoiced(l.id))]))+'\n';
      const invs=linesOfPO(p.id).flatMap(l=>invoicesOfLine(l.id).map(i=>({...i,line:l.lineNo})));
      if(invs.length) md+=mdTable(['Invoice #','PO line','Value','Date','For','Notes'],invs.map(i=>[i.invoiceNumber,i.line,fmt(i.value),i.date||'',i.forWhat||'',i.notes||'']))+'\n';
    });
  });
  md+=`\n## Forecast (${S.fcCfg.gran}ly from ${S.fcCfg.start})\n\n`+mdTable(['Budget line','Current value','Actuals',...ps.map(p=>p.label)],
    S.budget.map(r=>{const d=rowCalc(r);return [r.what,fmt(d.current),fmt(d.actuals),...ps.map(p=>fmt(fcComputed(r,d,p.key)))];}));
  md+=`\n## Actions\n\n`;
  const tmd=(list,depth)=>list.map(t=>{const st=stateOf(t.stateId);
    return '  '.repeat(depth)+`- [${st.done?'x':' '}] ${t.name||'(untitled)'}`+(t.due?` (due ${t.due})`:'')+` — ${st.name}, last actioned ${t.lastActioned||'—'}`
      +((t.links||[]).length?` [links: ${t.links.map(l=>refLabel(...l.split(':'))).join('; ')}]`:'')
      +(t.notes?`\n${'  '.repeat(depth+1)}> ${t.notes.replace(/\n/g,' ')}`:'')
      +(t.children&&t.children.length?'\n'+tmd(t.children,depth+1):'');}).join('\n');
  md+=(S.tasks.length?tmd(S.tasks,0):'_None._')+'\n';
  md+=`\n## Calendar\n\n`+mdTable(['Date','Time','Title','Tags','Notes'],
    [...S.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date+(e.endDate?' → '+e.endDate:''),e.time||'',e.title,(e.tagIds||[]).map(id=>(tagOf(id)||{}).name).filter(Boolean).join(', '),(e.notes||'').replace(/\n/g,' ')]));
  md+=`\n## Current status\n\n`;
  const bmd=(b,depth)=>{ const ind='  '.repeat(depth); let out='';
    if(b.type==='h1') out=`# ${htmlToText(b.html)}`; else if(b.type==='h2') out=`## ${htmlToText(b.html)}`;
    else if(b.type==='h3') out=`### ${htmlToText(b.html)}`; else if(b.type==='bullet') out=ind+`- ${htmlToText(b.html)}`;
    else if(b.type==='divider') out='---'; else if(b.type==='callout') out=`> ${htmlToText(b.html)}`;
    else if(b.type==='table') out=mdTable((b.rows[0]||[]).map(htmlToText),(b.rows.slice(1)||[]).map(r=>r.map(htmlToText)));
    else if(b.type==='toggle') out=ind+`- **${htmlToText(b.html)}**`;
    else out=ind+htmlToText(b.html);
    return out+'\n'+(b.children||[]).map(c=>bmd(c,depth+1)).join(''); };
  md+=S.status.map(b=>bmd(b,0)).join('')+'\n';
  download(slug(S.programme.name)+'-'+todayStr()+'.md',md,'text/markdown');
  toast('Markdown snapshot exported — drop it straight into an AI chat');
};

/* --- JSON save / open --- */
let fileHandle=null;
ACTIONS.saveJSON=async()=>{
  const content=JSON.stringify(S,null,1);
  const name=slug(S.programme.name)+'.programme.json';
  if(window.showSaveFilePicker){
    try{
      if(!fileHandle) fileHandle=await showSaveFilePicker({suggestedName:name,types:[{description:'Programme file',accept:{'application/json':['.json']}}]});
      const w=await fileHandle.createWritable(); await w.write(content); await w.close();
      toast('Saved to '+fileHandle.name); save(); return;
    }catch(e){ if(e&&e.name==='AbortError') return; fileHandle=null; }
  }
  download(name,content,'application/json'); toast('Programme file downloaded');
};
ACTIONS.openJSON=async()=>{
  if(window.showOpenFilePicker){
    try{ const [h]=await showOpenFilePicker({types:[{description:'Programme file',accept:{'application/json':['.json']}}]});
      const f=await h.getFile(); importState(JSON.parse(await f.text())); fileHandle=h; return;
    }catch(e){ if(e&&e.name==='AbortError') return; }
  }
  $('#filein').click();
};
$('#filein').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ importState(JSON.parse(await f.text())); }catch(err){ toast('Could not read that file'); }
  e.target.value='';
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); ACTIONS.saveJSON(); }
});

boot();
